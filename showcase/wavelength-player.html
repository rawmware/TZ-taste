<!--tz-meta {"id":"showcase-wavelength-player","title":"Wavelength — music player","category":"Showcase","file":"showcase/wavelength-player.html","tags":["app-ui","music","shadcn"],"description":"Wavelength music player: playlists, track list, bottom player bar with seek, shuffle/repeat, volume, dark mode.","dnas":[]} -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wavelength — Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --fg:#09090b; --muted:#f4f4f5; --muted-fg:#71717a;
  --border:#e4e4e7; --card:#ffffff; --primary:#18181b; --primary-fg:#fafafa;
  --ring:#18181b; --accent:#7c3aed;
}
html.dark{
  --bg:#09090b; --fg:#fafafa; --muted:#18181b; --muted-fg:#a1a1aa;
  --border:#27272a; --card:#101013; --primary:#fafafa; --primary-fg:#09090b;
  --ring:#fafafa; --accent:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;height:100vh;overflow:hidden;padding-bottom:92px}
/* sidebar */
.side{width:250px;flex-shrink:0;border-right:1px solid var(--border);padding:18px 12px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em;padding:0 8px 14px}
.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
.side h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-fg);padding:12px 10px 5px}
.pl{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--muted-fg);text-align:left;font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:8px;font-family:inherit}
.pl:hover{color:var(--fg);background:var(--muted)}
.pl.on{color:var(--fg);background:var(--muted);font-weight:600}
.pl .art{width:30px;height:30px;border-radius:7px;flex-shrink:0}
.pl .ct{margin-left:auto;font-size:11.5px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
/* main */
.main{flex:1;min-width:0;overflow:auto;padding:28px 36px 40px}
.hero{display:flex;gap:22px;align-items:flex-end;margin-bottom:26px}
.bigart{width:190px;height:190px;border-radius:16px;flex-shrink:0;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.hero .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-fg)}
.hero h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:4px 0 6px}
.hero p{color:var(--muted-fg);font-size:13.5px}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:99px;padding:9px 20px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.thead,.trow{display:grid;grid-template-columns:34px 1fr 200px 90px 60px;gap:12px;align-items:center;padding:9px 12px;border-radius:8px}
.thead{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg);border-bottom:1px solid var(--border);border-radius:0}
.trow{cursor:pointer;border:1px solid transparent}
.trow:hover{background:var(--muted)}
.trow.playing{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.trow.playing .tt{color:var(--accent)}
.tidx{color:var(--muted-fg);font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.tmeta{display:flex;align-items:center;gap:12px;min-width:0}
.tart{width:38px;height:38px;border-radius:8px;flex-shrink:0}
.tt{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-size:12.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tal{font-size:13px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdur{font-size:12.5px;color:var(--muted-fg);text-align:right;font-variant-numeric:tabular-nums}
.eq{display:none;align-items:flex-end;gap:2px;height:14px;justify-content:center}
.trow.playing .tidx .n{display:none}
.trow.playing .eq{display:flex}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:14px}}
/* player bar */
.bar{position:fixed;left:0;right:0;bottom:0;height:92px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 22px;gap:16px;z-index:30}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now .art{width:52px;height:52px;border-radius:10px;flex-shrink:0}
.now b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{font-size:12.5px;color:var(--muted-fg);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{display:flex;flex-direction:column;align-items:center;gap:7px}
.ctrls{display:flex;align-items:center;gap:6px}
.cbtn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted-fg);font-size:15px;display:flex;align-items:center;justify-content:center}
.cbtn:hover{color:var(--fg);background:var(--muted)}
.cbtn.play{width:42px;height:42px;background:var(--primary);color:var(--primary-fg);font-size:16px}
.cbtn.play:hover{opacity:.88;background:var(--primary)}
.cbtn.on{color:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;width:100%;max-width:520px;font-size:11.5px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.track{flex:1;height:5px;border-radius:99px;background:var(--border);cursor:pointer;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--fg);width:0%}
.track:hover .fill{background:var(--accent)}
.right{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.vol{display:flex;align-items:center;gap:8px;color:var(--muted-fg);font-size:14px}
input[type=range]{-webkit-appearance:none;width:110px;height:5px;border-radius:99px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg)}
@media(max-width:900px){.side{display:none}.thead,.trow{grid-template-columns:34px 1fr 60px}.tal{display:none}.bar{grid-template-columns:1fr;padding:0 14px}.right,.prog .t{display:none}.main{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark">~</span>Wavelength</div>
    <h3>Playlists</h3>
    <div id="plList"></div>
    <h3>Library</h3>
    <button class="pl" id="likedBtn"><span class="art" style="background:linear-gradient(135deg,#dc2626,#7c3aed)"></span>Liked songs<span class="ct num" id="likedCt"></span></button>
    <div style="margin-top:auto;padding:8px"><button class="btn" id="themeBtn" style="width:100%;justify-content:center">Dark mode</button></div>
  </aside>
  <main class="main">
    <div class="hero">
      <div class="bigart" id="heroArt"></div>
      <div><div class="k">Playlist</div><h1 id="heroTitle"></h1><p id="heroSub"></p>
        <div class="actions"><button class="btn primary" id="playAll">▶ Play</button><button class="btn" id="shuffleAll">⇄ Shuffle</button></div>
      </div>
    </div>
    <div class="thead"><span>#</span><span>Title</span><span class="tal">Album</span><span></span><span style="text-align:right">Time</span></div>
    <div id="trackList"></div>
  </main>
</div>
<footer class="bar">
  <div class="now"><div class="art" id="nowArt"></div><div style="min-width:0"><b id="nowTitle">—</b><span id="nowArtist">Pick a track</span></div></div>
  <div class="center">
    <div class="ctrls">
      <button class="cbtn" id="shufBtn" title="Shuffle">⇄</button>
      <button class="cbtn" id="prevBtn" title="Previous">⏮</button>
      <button class="cbtn play" id="playBtn" title="Play/Pause">▶</button>
      <button class="cbtn" id="nextBtn" title="Next">⏭</button>
      <button class="cbtn" id="repBtn" title="Repeat">↻</button>
    </div>
    <div class="prog"><span class="t num" id="tCur">0:00</span><div class="track" id="seek"><div class="fill" id="fill"></div></div><span class="t num" id="tEnd">0:00</span></div>
  </div>
  <div class="right"><span class="vol">♪<input type="range" id="vol" min="0" max="100" value="70"></span></div>
</footer>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  function g(a,b){return "linear-gradient(135deg,"+a+","+b+")"}
  var PLAYLISTS=[
    {id:"focus",name:"Focus Flow",desc:"Deep work, no lyrics.",art:g("#0f172a","#7c3aed"),
     tracks:[
      {t:"Glasswing",a:"Aero Tide",al:"Drift State",d:214,art:g("#0f172a","#38bdf8")},
      {t:"Paper Lanterns",a:"Copper Field",al:"Slow Circuits",d:187,art:g("#78350f","#fbbf24")},
      {t:"Northline",a:"Vela",al:"Meridian",d:243,art:g("#052e16","#4ade80")},
      {t:"Half Light",a:"June Cartel",al:"Amber Hours",d:201,art:g("#7c2d12","#fb923c")},
      {t:"Static Bloom",a:"Aero Tide",al:"Drift State",d:176,art:g("#1e1b4b","#a78bfa")}]},
    {id:"night",name:"Night Drive",desc:"City lights and low frequencies.",art:g("#7c2d12","#dc2626"),
     tracks:[
      {t:"Neon Harbor",a:"Midnight Cassette",al:"After Hours",d:228,art:g("#7c2d12","#f472b6")},
      {t:"Overpass",a:"Vela",al:"Concrete Dreams",d:195,art:g("#111827","#6b7280")},
      {t:"Redline",a:"June Cartel",al:"Night Shift",d:209,art:g("#7f1d1d","#ef4444")},
      {t:"Ultraviolet",a:"Copper Field",al:"Slow Circuits",d:261,art:g("#4c1d95","#c084fc")}]},
    {id:"morning",name:"Morning Acoustic",desc:"Coffee, sunlight, fingerpicked guitar.",art:g("#065f46","#a7f3d0"),
     tracks:[
      {t:"First Pour",a:"Willow Hart",al:"Kitchen Songs",d:183,art:g("#92400e","#fcd34d")},
      {t:"Cedar & Smoke",a:"The Hollows",al:"North Country",d:217,art:g("#3f3f46","#a1a1aa")},
      {t:"Sunday Engine",a:"Willow Hart",al:"Kitchen Songs",d:198,art:g("#14532d","#86efac")}]
    }
  ];
  var pl=PLAYLISTS[0],qi=-1,playing=false,elapsed=0,timer=null,shuffle=false,repeat=0,liked={};
  function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
  function cur(){return qi>-1?pl.tracks[qi]:null}

  /* ---- playlists ---- */
  function renderPls(){
    $("plList").innerHTML=PLAYLISTS.map(function(p){
      return '<button class="pl'+(p.id===pl.id?" on":"")+'" data-pl="'+p.id+'"><span class="art" style="background:'+p.art+'"></span>'+p.name+'<span class="ct num">'+p.tracks.length+'</span></button>';
    }).join("");
    Array.prototype.forEach.call($("plList").querySelectorAll("[data-pl]"),function(b){
      b.onclick=function(){pl=PLAYLISTS.filter(function(x){return x.id===b.dataset.pl})[0];stop();qi=-1;renderAll()};
    });
    var n=Object.keys(liked).length;$("likedCt").textContent=n||"";
  }
  $("likedBtn").onclick=function(){toast("Liked songs: "+Object.keys(liked).length+" tracks")};

  /* ---- tracks ---- */
  function renderAll(){
    $("heroArt").style.background=pl.art;
    $("heroTitle").textContent=pl.name;$("heroSub").textContent=pl.desc+" · "+pl.tracks.length+" songs";
    renderPls();
    $("trackList").innerHTML=pl.tracks.map(function(t,i){
      var k=pl.id+":"+i;
      return '<div class="trow'+(i===qi?" playing":"")+'" data-i="'+i+'"><span class="tidx"><span class="n num">'+(i+1)+'</span><span class="eq"><i></i><i></i><i></i></span></span>'+
      '<span class="tmeta"><span class="tart" style="background:'+t.art+'"></span><span style="min-width:0"><span class="tt">'+t.t+'</span><br><span class="ta">'+t.a+'</span></span></span>'+
      '<span class="tal">'+t.al+'</span><span></span><span class="tdur num">'+fmt(t.d)+'</span></div>';
    }).join("");
    Array.prototype.forEach.call($("trackList").querySelectorAll("[data-i]"),function(r){
      r.onclick=function(){play(+r.dataset.i)};
      r.ondblclick=function(){play(+r.dataset.i)};
    });
  }

  /* ---- playback (simulated) ---- */
  function play(i){qi=i;elapsed=0;start();renderAll();syncNow()}
  function start(){playing=true;$("playBtn").textContent="⏸";clearInterval(timer);timer=setInterval(tick,500)}
  function pause(){playing=false;$("playBtn").textContent="▶";clearInterval(timer)}
  function stop(){pause();elapsed=0;syncBar()}
  function tick(){
    var t=cur();if(!t)return;
    elapsed+=0.5;
    if(elapsed>=t.d){
      if(repeat===2){elapsed=0}
      else next(true);
    }
    syncBar();
  }
  function next(auto){
    if(repeat===2&&!auto){elapsed=0;syncBar();return}
    var n;
    if(shuffle){do{n=Math.floor(Math.random()*pl.tracks.length)}while(n===qi&&pl.tracks.length>1)}
    else n=qi+1;
    if(n>=pl.tracks.length){
      if(repeat===1){n=0}else{stop();qi=-1;renderAll();syncNow();return}
    }
    play(n);
  }
  function prev(){if(elapsed>3){elapsed=0;syncBar();return}play((qi-1+pl.tracks.length)%pl.tracks.length)}
  function syncNow(){
    var t=cur();
    $("nowTitle").textContent=t?t.t:"—";
    $("nowArtist").textContent=t?t.a+" · "+t.al:"Pick a track";
    $("nowArt").style.background=t?t.art:"#e4e4e7";
    $("tEnd").textContent=t?fmt(t.d):"0:00";
    syncBar();
  }
  function syncBar(){
    var t=cur(),p=t?Math.min(elapsed/t.d,1):0;
    $("fill").style.width=(p*100)+"%";
    $("tCur").textContent=fmt(elapsed);
  }
  $("playBtn").onclick=function(){if(qi<0){play(0);return}playing?pause():start()};
  $("nextBtn").onclick=function(){next(false)};
  $("prevBtn").onclick=prev;
  $("playAll").onclick=function(){play(0)};
  $("shuffleAll").onclick=function(){shuffle=!shuffle;$("shufBtn").classList.toggle("on",shuffle);play(Math.floor(Math.random()*pl.tracks.length));toast(shuffle?"Shuffle on":"Shuffle off")};
  $("shufBtn").onclick=function(){shuffle=!shuffle;$("shufBtn").classList.toggle("on",shuffle)};
  $("repBtn").onclick=function(){repeat=(repeat+1)%3;$("repBtn").classList.toggle("on",repeat>0);$("repBtn").textContent=repeat===2?"↻¹":"↻";toast(["Repeat off","Repeat all","Repeat one"][repeat])};
  $("seek").onclick=function(e){
    var t=cur();if(!t)return;
    var r=$("seek").getBoundingClientRect();
    elapsed=Math.max(0,Math.min(t.d,(e.clientX-r.left)/r.width*t.d));syncBar();
  };
  $("vol").addEventListener("input",function(){toast("Volume "+$("vol").value+"%")});
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT")return;
    if(e.code==="Space"){e.preventDefault();$("playBtn").click()}
    else if(e.key==="ArrowRight")next(false);else if(e.key==="ArrowLeft")prev();
  });
  function toast(m){var d=document.createElement("div");d.textContent=m;
    d.style.cssText="position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--primary-fg);font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:9px;z-index:60";
    document.body.appendChild(d);setTimeout(function(){d.remove()},1600)}

  /* ---- theme ---- */
  function setDark(d){document.documentElement.classList.toggle("dark",d);try{localStorage.setItem("wave-dark",d?"1":"0")}catch(e){}}
  $("themeBtn").onclick=function(){setDark(!document.documentElement.classList.contains("dark"))};
  try{if(localStorage.getItem("wave-dark")==="1")setDark(true)}catch(e){}

  renderAll();syncNow();
})();
</script>
</body>
</html>
