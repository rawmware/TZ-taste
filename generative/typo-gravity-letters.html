<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Letters — TZ-taste Generative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070b14;color:#e2e8f0;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tz-head{text-align:center;padding:1.6rem 1.2rem .8rem;max-width:680px}
.tz-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:.6rem}
.tz-title{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;margin-bottom:.5rem}
.tz-caption{font-style:italic;font-size:.98rem;line-height:1.5;opacity:.72}
.tz-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem 1rem}
.tz-btn{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #22d3ee;background:transparent;color:#22d3ee;cursor:pointer}
.tz-btn:hover{background:#22d3ee;color:#070b14}
.tz-wrap{width:100%;max-width:980px;padding:0 1rem 2.5rem}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border:1px solid rgba(34,211,238,.25);border-radius:14px;touch-action:none;background:#070b14;cursor:crosshair}
</style>
</head>
<body>
<header class="tz-head">
<p class="tz-kicker">TZ-taste · Generative</p>
<h1 class="tz-title">Gravity Letters</h1>
<p class="tz-caption">Letters rain down and pile into a heap with simple gravity and collision physics. Click anywhere to drop another letter.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" id="tz-b-seed" type="button">New seed</button>
<button class="tz-btn" id="tz-b-pause" type="button">Pause</button>
<button class="tz-btn" id="tz-b-clear" type="button">Clear</button>
</div>
<div class="tz-wrap"><canvas class="tz-canvas" id="tz-cv"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,seed=77031,letters=[],running=true,raf=0;
var PHRASE="GRAVITY WINS",COLORS=['#22d3ee','#f472b6','#e2e8f0'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function spawn(ch,x,y,rnd,i){
  return{ch:ch,x:x,y:y,vx:(rnd()-.5)*2,vy:-1-rnd()*2,r:15+rnd()*13,rot:(rnd()-.5)*.8,vr:(rnd()-.5)*.1,c:COLORS[i%COLORS.length]};
}
function init(s){
  seed=s;var rnd=mulberry32(s),i;
  letters=[];
  var chars=PHRASE.replace(/ /g,'').split('');
  for(i=0;i<chars.length;i++){letters.push(spawn(chars[i],W*(0.15+0.7*rnd()),-40-i*46,rnd,i));}
}
function physics(){
  var i,j,a,b,dx,dy,d,min,ov,nx,ny,rel;
  for(i=0;i<letters.length;i++){a=letters[i];
    a.vy+=0.38;a.vx*=.999;a.vr*=.99;
    a.x+=a.vx;a.y+=a.vy;a.rot+=a.vr;
    if(a.y+a.r>H){a.y=H-a.r;a.vy*=-0.5;a.vx*=.88;a.vr*=.8;}
    if(a.x-a.r<0){a.x=a.r;a.vx*=-0.6;}
    if(a.x+a.r>W){a.x=W-a.r;a.vx*=-0.6;}
  }
  for(i=0;i<letters.length;i++)for(j=i+1;j<letters.length;j++){
    a=letters[i];b=letters[j];dx=b.x-a.x;dy=b.y-a.y;d=Math.hypot(dx,dy)||1;min=a.r+b.r;
    if(d<min){ov=(min-d)/2;nx=dx/d;ny=dy/d;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rel<0){a.vx+=rel*nx*.5;a.vy+=rel*ny*.5;b.vx-=rel*nx*.5;b.vy-=rel*ny*.5;}
      a.vr+=(rnd2()-.5)*.02;
    }
  }
}
var rnd2=mulberry32(99);
function draw(){
  ctx.fillStyle='#070b14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(34,211,238,.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H-1);ctx.lineTo(W,H-1);ctx.stroke();
  var i,a;
  for(i=0;i<letters.length;i++){a=letters[i];
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
    ctx.font='700 '+(a.r*1.5)+'px Georgia,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=a.c;ctx.shadowBlur=10;ctx.fillStyle=a.c;
    ctx.fillText(a.ch,0,2);ctx.restore();
  }
}
function step(){physics();draw();}
function settle(){for(var k=0;k<420;k++)physics();}
function loop(){step();if(running&&!REDUCED)raf=requestAnimationFrame(loop);}
function resize(){
  var DPR=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  init(seed);
  if(REDUCED){settle();draw();}else{cancelAnimationFrame(raf);if(running)loop();else draw();}
}
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect(),rnd=mulberry32((Math.random()*0x7fffffff)|0);
  letters.push(spawn('ABCDEFGHIJKLMNOPQRSTUVWXYZ'[(rnd()*26)|0],e.clientX-r.left,30,rnd,letters.length));
  if(REDUCED||!running)draw();
});
document.getElementById('tz-b-seed').addEventListener('click',function(){init((Math.random()*0x7fffffff)|0);if(REDUCED){settle();draw();}});
document.getElementById('tz-b-pause').addEventListener('click',function(){
  running=!running;this.textContent=running?'Pause':'Resume';
  if(running&&!REDUCED)loop();else{cancelAnimationFrame(raf);draw();}
});
document.getElementById('tz-b-clear').addEventListener('click',function(){letters=[];draw();});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
