<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truchet Tiles · TZ-taste</title>
<style>
  .tz-page{background:#F4EFE4;color:#1A1A1A;min-height:100vh;font-family:Georgia,'Times New Roman',serif;margin:0}
  .tz-wrap{max-width:1080px;margin:0 auto;padding:32px 20px 48px}
  .tz-kicker{font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#D92B1F;margin:0 0 12px}
  .tz-title{font-size:clamp(32px,6vw,52px);font-weight:700;margin:0 0 10px;line-height:1.05}
  .tz-caption{font-size:16px;line-height:1.6;max-width:62ch;margin:0 0 4px;color:#4a4a4a}
  .tz-controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
  .tz-btn{font-family:'Courier New',Courier,monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:#1A1A1A;border:2px solid #1A1A1A;padding:10px 18px;cursor:pointer}
  .tz-btn:hover{background:#1A1A1A;color:#F4EFE4}
  .tz-btn:active{transform:translateY(1px)}
  .tz-canvas{display:block;width:100%;height:70vh;background:#F4EFE4;border:2px solid #1A1A1A;cursor:pointer}
  .tz-foot{font-family:'Courier New',Courier,monospace;font-size:12px;color:#8a8a8a;margin:14px 0 0;line-height:1.6}
</style>
</head>
<body class="tz-page">
<div class="tz-wrap">
  <p class="tz-kicker">TZ-taste · Generative</p>
  <h1 class="tz-title">Truchet Tiles</h1>
  <p class="tz-caption">Each tile holds two quarter-circle arcs in one of two orientations — every half second a few tiles flip, and the whole field's rivers reroute.</p>
  <div class="tz-controls">
    <button class="tz-btn" id="tz-seed" type="button">New seed</button>
    <button class="tz-btn" id="tz-pause" type="button">Pause</button>
    <button class="tz-btn" id="tz-clear" type="button">Clear</button>
  </div>
  <canvas class="tz-canvas" id="tz-canvas"></canvas>
  <p class="tz-foot">One distinctive choice: click anywhere on the field to reseed it instantly. Seed <span id="tz-seednum"></span>.</p>
</div>
<script>
(function(){
  var BG='#F4EFE4', INK='#1A1A1A', RED='#D92B1F', TILE=46, FLIP_EVERY=500, FLIPS=4;
  var canvas=document.getElementById('tz-canvas'), ctx=canvas.getContext('2d');
  var seedBtn=document.getElementById('tz-seed'), pauseBtn=document.getElementById('tz-pause'),
      clearBtn=document.getElementById('tz-clear'), seedNum=document.getElementById('tz-seednum');
  var seed=121314, rng=mulberry32(seed);
  var grid=null, cols=0, rows=0, W=0, H=0, lastFlip=0;
  var running=true, raf=null;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  function init(){
    rng=mulberry32(seed);
    cols=Math.max(2,Math.floor(W/TILE)); rows=Math.max(2,Math.floor(H/TILE));
    grid=[];
    for(var y=0;y<rows;y++){
      grid.push([]);
      for(var x=0;x<cols;x++){
        grid[y].push({o:rng()<0.5?0:1, red:rng()<0.18});
      }
    }
    seedNum.textContent=seed;
  }

  function drawTile(x,y,t){
    var px=x*TILE, py=y*TILE, r=TILE/2, c=t.red?RED:INK;
    ctx.strokeStyle=c; ctx.lineWidth=t.red?3.4:2.6; ctx.lineCap='round';
    ctx.beginPath();
    if(t.o===0){
      ctx.arc(px,py+r,r,-Math.PI/2,0);
      ctx.moveTo(px+TILE,py);ctx.arc(px+TILE,py+r,r,Math.PI,Math.PI*1.5);
    }else{
      ctx.arc(px+TILE,py,r,Math.PI/2,Math.PI);
      ctx.moveTo(px,py+TILE);ctx.arc(px,py,r,-Math.PI/2,0);
    }
    ctx.stroke();
  }

  function draw(){
    ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++)drawTile(x,y,grid[y][x]);
  }

  function reseed(){
    seed=(seed*9301+49297)%233280; init(); draw();
  }

  function frame(ts){
    if(!running){raf=null;return;}
    if(ts-lastFlip>FLIP_EVERY){
      lastFlip=ts;
      for(var i=0;i<FLIPS;i++){
        var x=Math.floor(Math.random()*cols), y=Math.floor(Math.random()*rows);
        grid[y][x].o^=1;
      }
      draw();
    }
    raf=requestAnimationFrame(frame);
  }

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var r=canvas.getBoundingClientRect();
    W=r.width; H=r.height;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    init(); draw();
  }

  seedBtn.addEventListener('click',reseed);
  canvas.addEventListener('click',reseed);
  pauseBtn.addEventListener('click',function(){
    running=!running; pauseBtn.textContent=running?'Pause':'Resume';
    if(running&&!reduced)raf=requestAnimationFrame(frame);
  });
  clearBtn.addEventListener('click',function(){draw();});

  window.addEventListener('resize',resize);
  resize();
  if(!reduced){lastFlip=performance.now();raf=requestAnimationFrame(frame);}
})();
</script>
</body>
</html>
