<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope Painter — TZ-taste Generative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f7efe0;color:#3a2a1a;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tz-head{text-align:center;padding:1.6rem 1.2rem .8rem;max-width:680px}
.tz-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:.6rem}
.tz-title{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;margin-bottom:.5rem}
.tz-caption{font-style:italic;font-size:.98rem;line-height:1.5;opacity:.72}
.tz-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem 1rem}
.tz-btn{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #3a2a1a;background:transparent;color:#3a2a1a;cursor:pointer}
.tz-btn:hover{background:#3a2a1a;color:#f7efe0}
.tz-wrap{width:100%;max-width:980px;padding:0 1rem 2.5rem}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border:1px solid rgba(58,42,26,.3);border-radius:14px;touch-action:none;background:#f7efe0;cursor:crosshair}
</style>
</head>
<body>
<header class="tz-head">
<p class="tz-kicker">TZ-taste · Generative</p>
<h1 class="tz-title">Kaleidoscope Painter</h1>
<p class="tz-caption">Paint with your pointer and every stroke blooms twelve ways, mirrored into a slow-breathing mandala.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" id="tz-b-seed" type="button">New seed</button>
<button class="tz-btn" id="tz-b-pause" type="button">Pause</button>
<button class="tz-btn" id="tz-b-clear" type="button">Clear</button>
</div>
<div class="tz-wrap"><canvas class="tz-canvas" id="tz-cv"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,cx=0,cy=0,seed=121212,running=true,raf=0;
var SEG=12,PALETTE=['#0e7c7b','#c9a227','#b4552d','#3a2a1a','#d98a94'];
var order=PALETTE.slice(),strokeN=0,prev=null;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(rnd,arr){var i,j,tmp;for(i=arr.length-1;i>0;i--){j=(rnd()*(i+1))|0;tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;}return arr;}
function clearCanvas(){ctx.fillStyle='#f7efe0';ctx.fillRect(0,0,W,H);}
function paintStroke(x0,y0,x1,y1){
  var col=order[strokeN%order.length],i,rx0,ry0,rx1,ry1;
  ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap='round';
  for(i=0;i<SEG;i++){
    var a=i*Math.PI*2/SEG,mirror=(i%2===1);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a);if(mirror)ctx.scale(1,-1);
    rx0=x0-cx;ry0=y0-cy;rx1=x1-cx;ry1=y1-cy;
    ctx.beginPath();ctx.moveTo(rx0,ry0);ctx.lineTo(rx1,ry1);ctx.stroke();
    ctx.restore();
  }
  strokeN++;
}
function seedPaint(){
  var rnd=mulberry32(seed),i;
  order=shuffle(rnd,PALETTE.slice());strokeN=0;clearCanvas();
  for(i=0;i<26;i++){
    var a0=rnd()*6.28,r0=rnd()*Math.min(W,H)*0.36;
    var a1=a0+(rnd()-.5)*1.6,r1=r0+(rnd()-.5)*90;
    paintStroke(cx+Math.cos(a0)*r0,cy+Math.sin(a0)*r0,cx+Math.cos(a1)*r1,cy+Math.sin(a1)*r1);
  }
}
function fade(){
  ctx.fillStyle='rgba(247,239,224,0.016)';ctx.fillRect(0,0,W,H);
  if(running&&!REDUCED)raf=requestAnimationFrame(fade);
}
function resize(){
  var DPR=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cx=W/2;cy=H/2;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  seedPaint();
  cancelAnimationFrame(raf);
  if(!REDUCED&&running)fade();
}
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();
  prev={x:e.clientX-r.left,y:e.clientY-r.top};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  if(!prev)return;
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  paintStroke(prev.x,prev.y,x,y);
  prev={x:x,y:y};
});
cv.addEventListener('pointerup',function(){prev=null;});
cv.addEventListener('pointercancel',function(){prev=null;});
document.getElementById('tz-b-seed').addEventListener('click',function(){
  seed=(Math.random()*0x7fffffff)|0;seedPaint();
});
document.getElementById('tz-b-pause').addEventListener('click',function(){
  running=!running;this.textContent=running?'Pause':'Resume';
  cancelAnimationFrame(raf);
  if(running&&!REDUCED)fade();
});
document.getElementById('tz-b-clear').addEventListener('click',function(){clearCanvas();});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
