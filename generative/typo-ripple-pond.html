<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Click Pond — TZ-taste Generative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f1e7;color:#1a1712;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tz-head{text-align:center;padding:1.6rem 1.2rem .8rem;max-width:680px}
.tz-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:.6rem}
.tz-title{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;margin-bottom:.5rem}
.tz-caption{font-style:italic;font-size:.98rem;line-height:1.5;opacity:.72}
.tz-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem 1rem}
.tz-btn{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #1a1712;background:transparent;color:#1a1712;cursor:pointer}
.tz-btn:hover{background:#1a1712;color:#f6f1e7}
.tz-wrap{width:100%;max-width:980px;padding:0 1rem 2.5rem}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border:1px solid rgba(26,23,18,.3);border-radius:14px;touch-action:none;background:#f6f1e7;cursor:pointer}
</style>
</head>
<body>
<header class="tz-head">
<p class="tz-kicker">TZ-taste · Generative</p>
<h1 class="tz-title">Ripple Click Pond</h1>
<p class="tz-caption">Click anywhere to drop a ripple. The floating words ride the waves, bobbing and tilting as each swell passes.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" id="tz-b-seed" type="button">New seed</button>
<button class="tz-btn" id="tz-b-pause" type="button">Pause</button>
<button class="tz-btn" id="tz-b-clear" type="button">Clear</button>
</div>
<div class="tz-wrap"><canvas class="tz-canvas" id="tz-cv"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,seed=5150,words=[],ripples=[],running=true,raf=0,t=0,lastAuto=0;
var WORDLIST=['drift','tide','wake','current','ripple','still','ebb','flow'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function init(s){
  seed=s;var rnd=mulberry32(s),i;
  words=[];ripples=[];
  for(i=0;i<WORDLIST.length;i++){
    words.push({t:WORDLIST[i],x:rnd()*W,y:rnd()*H,fs:22+rnd()*30,ph:rnd()*6.28,vx:(rnd()-.5)*.25});
  }
  for(i=0;i<3;i++)ripples.push({x:rnd()*W,y:rnd()*H,t0:-i*0.7});
  t=0;
}
function heightAt(x,y,tt){
  var h=0,i,r,dx,dy,rr,dt;
  for(i=0;i<ripples.length;i++){r=ripples[i];
    dx=x-r.x;dy=y-r.y;rr=Math.sqrt(dx*dx+dy*dy);dt=tt-r.t0;
    if(dt<0||dt>6)continue;
    h+=Math.sin(rr*0.09-dt*7)*Math.exp(-rr/150)*Math.exp(-dt/1.8)*10;
  }
  return h;
}
function draw(tt){
  ctx.fillStyle='#f6f1e7';ctx.fillRect(0,0,W,H);
  var i,r,dt,rad,alpha;
  for(i=0;i<ripples.length;i++){r=ripples[i];dt=tt-r.t0;
    if(dt<0||dt>6)continue;
    rad=dt*70;alpha=Math.max(0,0.5*(1-dt/6));
    ctx.strokeStyle='rgba(26,23,18,'+alpha.toFixed(3)+')';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(r.x,r.y,rad,rad*0.55,0,0,6.283);ctx.stroke();
    ctx.strokeStyle='rgba(26,23,18,'+(alpha*0.5).toFixed(3)+')';
    ctx.beginPath();ctx.ellipse(r.x,r.y,rad*0.7,rad*0.38,0,0,6.283);ctx.stroke();
  }
  for(i=0;i<words.length;i++){var w=words[i];
    var x=w.x+Math.sin(tt*0.2+w.ph)*20;
    var h=heightAt(x,w.y,tt);
    var slope=(heightAt(x+8,w.y,tt)-heightAt(x-8,w.y,tt))/16;
    ctx.save();ctx.translate(x,w.y+h);ctx.rotate(slope*0.9);
    ctx.font='italic '+(w.fs|0)+'px Georgia,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(26,23,18,0.92)';ctx.fillText(w.t,0,0);ctx.restore();
  }
}
function loop(ts){
  t+=0.016;
  if(t-lastAuto>2.6){lastAuto=t;ripples.push({x:Math.random()*W,y:Math.random()*H,t0:t});}
  ripples=ripples.filter(function(r){return t-r.t0<6;});
  draw(t);
  if(running&&!REDUCED)raf=requestAnimationFrame(loop);
}
function resize(){
  var DPR=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  init(seed);
  if(REDUCED){draw(1.4);}else{cancelAnimationFrame(raf);if(running)loop();}
}
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();
  ripples.push({x:e.clientX-r.left,y:e.clientY-r.top,t0:t});
  if(REDUCED)draw(1.4);
});
document.getElementById('tz-b-seed').addEventListener('click',function(){init((Math.random()*0x7fffffff)|0);if(REDUCED)draw(1.4);});
document.getElementById('tz-b-pause').addEventListener('click',function(){
  running=!running;this.textContent=running?'Pause':'Resume';
  if(running&&!REDUCED)loop();else cancelAnimationFrame(raf);
});
document.getElementById('tz-b-clear').addEventListener('click',function(){ripples=[];draw(t);if(REDUCED)draw(1.4);});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
