<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Packing · TZ-taste</title>
<style>
  .tz-page{background:#101010;color:#F4F1E8;min-height:100vh;font-family:Georgia,'Times New Roman',serif;margin:0}
  .tz-wrap{max-width:1080px;margin:0 auto;padding:32px 20px 48px}
  .tz-kicker{font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#F5C518;margin:0 0 12px}
  .tz-title{font-size:clamp(32px,6vw,52px);font-weight:700;margin:0 0 10px;line-height:1.05}
  .tz-caption{font-size:16px;line-height:1.6;max-width:62ch;margin:0 0 4px;color:#bdbdbd}
  .tz-controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
  .tz-btn{font-family:'Courier New',Courier,monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:#F4F1E8;border:2px solid #F4F1E8;padding:10px 18px;cursor:pointer}
  .tz-btn:hover{background:#E30613;border-color:#E30613;color:#101010}
  .tz-btn:active{transform:translateY(1px)}
  .tz-canvas{display:block;width:100%;height:70vh;background:#101010;border:2px solid #F4F1E8}
  .tz-foot{font-family:'Courier New',Courier,monospace;font-size:12px;color:#8a8a8a;margin:14px 0 0;line-height:1.6}
</style>
</head>
<body class="tz-page">
<div class="tz-wrap">
  <p class="tz-kicker">TZ-taste · Generative</p>
  <h1 class="tz-title">Circle Packing</h1>
  <p class="tz-caption">Random points become circles grown to the nearest tangent edge — each new circle kisses its neighbours and stops, packing the field.</p>
  <div class="tz-controls">
    <button class="tz-btn" id="tz-seed" type="button">New seed</button>
    <button class="tz-btn" id="tz-pause" type="button">Pause</button>
    <button class="tz-btn" id="tz-clear" type="button">Clear</button>
  </div>
  <canvas class="tz-canvas" id="tz-canvas"></canvas>
  <p class="tz-foot">One distinctive choice: circles grow in on screen a few at a time, so you watch the packing negotiate for space. Seed <span id="tz-seednum"></span>.</p>
</div>
<script>
(function(){
  var BG='#101010', COLORS=['#E30613','#2E6BE6','#F5C518'];
  var canvas=document.getElementById('tz-canvas'), ctx=canvas.getContext('2d');
  var seedBtn=document.getElementById('tz-seed'), pauseBtn=document.getElementById('tz-pause'),
      clearBtn=document.getElementById('tz-clear'), seedNum=document.getElementById('tz-seednum');
  var seed=60606, rng=mulberry32(seed), circles=[], W=0, H=0, drawn=0;
  var running=true, raf=null;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MAXC=420, MINR=6;

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  function init(){
    rng=mulberry32(seed); circles=[]; drawn=0;
    var maxR=Math.min(W,H)*0.16, attempts=0;
    while(circles.length<MAXC&&attempts<MAXC*40){
      attempts++;
      var x=rng()*W, y=rng()*H, r=maxR;
      for(var i=0;i<circles.length;i++){
        var c=circles[i];
        var d=Math.hypot(x-c.x,y-c.y)-c.r-2;
        if(d<r)r=d;
        if(r<MINR)break;
      }
      if(r>=MINR)circles.push({x:x,y:y,r:r,color:COLORS[circles.length%3]});
    }
    seedNum.textContent=seed+' · '+circles.length+' circles';
  }

  function drawCircle(c){
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.strokeStyle=c.color; ctx.lineWidth=1.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(c.x,c.y,1.6,0,Math.PI*2);
    ctx.fillStyle=c.color; ctx.fill();
  }

  function paint(){
    ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
    for(var i=0;i<drawn;i++)drawCircle(circles[i]);
  }

  function frame(){
    if(!running){raf=null;return;}
    if(drawn<circles.length){
      var n=Math.min(6,circles.length-drawn);
      for(var i=0;i<n;i++)drawCircle(circles[drawn++]);
    }
    raf=requestAnimationFrame(frame);
  }

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var r=canvas.getBoundingClientRect();
    W=r.width; H=r.height;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    init();
    if(reduced){drawn=circles.length;paint();}
    else{drawn=0;paint();}
  }

  seedBtn.addEventListener('click',function(){seed=(seed*9301+49297)%233280;init();drawn=reduced?circles.length:0;paint();});
  pauseBtn.addEventListener('click',function(){
    running=!running; pauseBtn.textContent=running?'Pause':'Resume';
    if(running&&!reduced)raf=requestAnimationFrame(frame);
  });
  clearBtn.addEventListener('click',function(){drawn=0;paint();});

  window.addEventListener('resize',resize);
  resize();
  if(!reduced)raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
