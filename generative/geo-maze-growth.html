<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Growth · TZ-taste</title>
<style>
  .tz-page{background:#FAF8F2;color:#1C1C1C;min-height:100vh;font-family:Georgia,'Times New Roman',serif;margin:0}
  .tz-wrap{max-width:1080px;margin:0 auto;padding:32px 20px 48px}
  .tz-kicker{font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#8a8a8a;margin:0 0 12px}
  .tz-title{font-size:clamp(32px,6vw,52px);font-weight:700;margin:0 0 10px;line-height:1.05}
  .tz-caption{font-size:16px;line-height:1.6;max-width:62ch;margin:0 0 4px;color:#4a4a4a}
  .tz-controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
  .tz-btn{font-family:'Courier New',Courier,monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:#1C1C1C;border:1px solid #1C1C1C;padding:10px 18px;cursor:pointer}
  .tz-btn:hover{background:#1C1C1C;color:#FAF8F2}
  .tz-btn:active{transform:translateY(1px)}
  .tz-canvas{display:block;width:100%;height:70vh;background:#FAF8F2;border:1px solid #1C1C1C}
  .tz-foot{font-family:'Courier New',Courier,monospace;font-size:12px;color:#8a8a8a;margin:14px 0 0;line-height:1.6}
</style>
</head>
<body class="tz-page">
<div class="tz-wrap">
  <p class="tz-kicker">TZ-taste · Generative</p>
  <h1 class="tz-title">Maze Growth</h1>
  <p class="tz-caption">The recursive backtracker walks the grid — carving passages, backtracking at dead ends — until every cell connects in one perfect maze.</p>
  <div class="tz-controls">
    <button class="tz-btn" id="tz-seed" type="button">New seed</button>
    <button class="tz-btn" id="tz-pause" type="button">Pause</button>
    <button class="tz-btn" id="tz-clear" type="button">Clear</button>
  </div>
  <canvas class="tz-canvas" id="tz-canvas"></canvas>
  <p class="tz-foot">One distinctive choice: the walker's head stays marked while carving, so you can follow the algorithm's exact path. Seed <span id="tz-seednum"></span>.</p>
</div>
<script>
(function(){
  var BG='#FAF8F2', INK='#1C1C1C', CELL=20, STEPS=6;
  var canvas=document.getElementById('tz-canvas'), ctx=canvas.getContext('2d');
  var seedBtn=document.getElementById('tz-seed'), pauseBtn=document.getElementById('tz-pause'),
      clearBtn=document.getElementById('tz-clear'), seedNum=document.getElementById('tz-seednum');
  var seed=90021, rng=mulberry32(seed);
  var cols=0, rows=0, walls=null, visited=null, stack=[], head=null, done=false;
  var W=0, H=0, running=true, raf=null;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N=1,S=2,E=4,Wb=8;

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  function idx(x,y){return y*cols+x;}

  function init(){
    rng=mulberry32(seed);
    cols=Math.max(4,Math.floor(W/CELL)); rows=Math.max(4,Math.floor(H/CELL));
    walls=new Uint8Array(cols*rows).fill(N|S|E|Wb);
    visited=new Uint8Array(cols*rows);
    stack=[]; done=false;
    var sx=Math.floor(rng()*cols), sy=Math.floor(rng()*rows);
    visited[idx(sx,sy)]=1; stack.push([sx,sy]); head=[sx,sy];
    seedNum.textContent=seed;
  }

  function carveStep(){
    if(stack.length===0){done=true;head=null;return;}
    var cur=stack[stack.length-1], x=cur[0], y=cur[1];
    var nb=[];
    if(x>0&&!visited[idx(x-1,y)])nb.push([-1,0,Wb,E]);
    if(x<cols-1&&!visited[idx(x+1,y)])nb.push([1,0,E,Wb]);
    if(y>0&&!visited[idx(x,y-1)])nb.push([0,-1,N,S]);
    if(y<rows-1&&!visited[idx(x,y+1)])nb.push([0,1,S,N]);
    if(nb.length===0){stack.pop();head=stack.length?stack[stack.length-1]:null;return;}
    var n=nb[Math.floor(rng()*nb.length)];
    var nx=x+n[0], ny=y+n[1];
    walls[idx(x,y)]&=~n[2]; walls[idx(nx,ny)]&=~n[3];
    visited[idx(nx,ny)]=1; stack.push([nx,ny]); head=[nx,ny];
  }

  function draw(){
    ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
    var ox=(W-cols*CELL)/2, oy=(H-rows*CELL)/2;
    ctx.strokeStyle=INK; ctx.lineWidth=1;
    ctx.beginPath();
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      var w=walls[idx(x,y)], px=ox+x*CELL, py=oy+y*CELL;
      if(w&N){ctx.moveTo(px,py);ctx.lineTo(px+CELL,py);}
      if(w&Wb){ctx.moveTo(px,py);ctx.lineTo(px,py+CELL);}
      if(y===rows-1&&(w&S)){ctx.moveTo(px,py+CELL);ctx.lineTo(px+CELL,py+CELL);}
      if(x===cols-1&&(w&E)){ctx.moveTo(px+CELL,py);ctx.lineTo(px+CELL,py+CELL);}
    }
    ctx.stroke();
    if(head){
      ctx.fillStyle=INK;
      var hx=ox+head[0]*CELL+CELL/2, hy=oy+head[1]*CELL+CELL/2;
      ctx.beginPath(); ctx.arc(hx,hy,3.5,0,Math.PI*2); ctx.fill();
    }
  }

  function frame(){
    if(!running){raf=null;return;}
    if(!done){for(var i=0;i<STEPS;i++)carveStep();draw();}
    raf=requestAnimationFrame(frame);
  }

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var r=canvas.getBoundingClientRect();
    W=r.width; H=r.height;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    init();
    if(reduced){while(!done)carveStep();draw();}
    else draw();
  }

  seedBtn.addEventListener('click',function(){seed=(seed*9301+49297)%233280;init();if(reduced){while(!done)carveStep();}draw();});
  pauseBtn.addEventListener('click',function(){
    running=!running; pauseBtn.textContent=running?'Pause':'Resume';
    if(running&&!reduced)raf=requestAnimationFrame(frame);
  });
  clearBtn.addEventListener('click',function(){draw();});

  window.addEventListener('resize',resize);
  resize();
  if(!reduced)raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
