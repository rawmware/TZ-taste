<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time-of-Day Sky — TZ-taste Generative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fdf6e9;color:#3a2a22;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tz-head{text-align:center;padding:1.6rem 1.2rem .8rem;max-width:680px}
.tz-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:.6rem}
.tz-title{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;margin-bottom:.5rem}
.tz-caption{font-style:italic;font-size:.98rem;line-height:1.5;opacity:.72}
.tz-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem 1rem}
.tz-btn{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #ff5d8f;background:transparent;color:#ff5d8f;cursor:pointer}
.tz-btn:hover{background:#ff5d8f;color:#fdf6e9}
.tz-wrap{width:100%;max-width:980px;padding:0 1rem 2.5rem}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border:1px solid rgba(255,93,143,.35);border-radius:14px;background:#fdf6e9}
</style>
</head>
<body>
<header class="tz-head">
<p class="tz-kicker">TZ-taste · Generative</p>
<h1 class="tz-title">Time-of-Day Sky</h1>
<p class="tz-caption">The sky above is painted from your real local time right now — sun by day, moon and stars by night, honeyed light at dawn and dusk.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" id="tz-b-seed" type="button">New seed</button>
<button class="tz-btn" id="tz-b-pause" type="button">Pause</button>
<button class="tz-btn" id="tz-b-clear" type="button">Clear</button>
</div>
<div class="tz-wrap"><canvas class="tz-canvas" id="tz-cv"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,seed=1010,running=true,raf=0,t=0,clouds=[],stars=[];
var KEYS=[
  {h:0,  top:'#07090e',bot:'#0d1219',stars:1},
  {h:4.5,top:'#14171f',bot:'#232830',stars:1},
  {h:6.5,top:'#e8b48a',bot:'#f7ecd4',stars:0},
  {h:9,  top:'#a8d4d8',bot:'#f2ecdc',stars:0},
  {h:15, top:'#a8d4d8',bot:'#f2ecdc',stars:0},
  {h:17.5,top:'#e5a06e',bot:'#f3dfc0',stars:0},
  {h:19.5,top:'#2a2f38',bot:'#5a4a40',stars:0.25},
  {h:21, top:'#0a0d14',bot:'#131a24',stars:1},
  {h:24, top:'#07090e',bot:'#0d1219',stars:1}
];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRGB(hx){return[parseInt(hx.slice(1,3),16),parseInt(hx.slice(3,5),16),parseInt(hx.slice(5,7),16)];}
function mix(a,b,f){var A=hexRGB(a),B=hexRGB(b);return 'rgb('+((A[0]+(B[0]-A[0])*f)|0)+','+((A[1]+(B[1]-A[1])*f)|0)+','+((A[2]+(B[2]-A[2])*f)|0)+')';}
function skyAt(h){
  var i;
  for(i=0;i<KEYS.length-1;i++){
    if(h>=KEYS[i].h&&h<=KEYS[i+1].h){
      var f=(h-KEYS[i].h)/(KEYS[i+1].h-KEYS[i].h);
      return{top:mix(KEYS[i].top,KEYS[i+1].top,f),bot:mix(KEYS[i].bot,KEYS[i+1].bot,f),stars:KEYS[i].stars+(KEYS[i+1].stars-KEYS[i].stars)*f};
    }
  }
  return{top:KEYS[0].top,bot:KEYS[0].bot,stars:1};
}
function init(s){
  seed=s;var rnd=mulberry32(s),i;
  stars=[];clouds=[];
  for(i=0;i<130;i++)stars.push({x:rnd()*W,y:rnd()*H*0.75,r:0.6+rnd()*1.6,ph:rnd()*6.28});
  for(i=0;i<5;i++)clouds.push({x:rnd()*W,y:H*(0.12+rnd()*0.3),w:90+rnd()*130,sp:4+rnd()*8});
}
function fmt(d){
  var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM',h12=h%12||12;
  return h12+':'+(m<10?'0':'')+m+' '+ap;
}
function draw(tt){
  var now=new Date(),hh=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  var sky=skyAt(hh);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sky.top);g.addColorStop(1,sky.bot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i,s;
  if(sky.stars>0.01){
    for(i=0;i<stars.length;i++){s=stars[i];
      var tw=0.5+0.5*Math.sin(tt*1.4+s.ph);
      ctx.fillStyle='rgba(255,252,240,'+(sky.stars*(0.25+0.65*tw)).toFixed(3)+')';
      ctx.fillRect(s.x,s.y,s.r,s.r);
    }
  }
  var sunEl=Math.sin(Math.PI*(hh-6)/12);
  if(sunEl>0){
    var sx=W*(0.14+0.72*(hh-6)/12),sy=H*0.8-sunEl*H*0.6;
    ctx.save();ctx.shadowColor='#ff8fab';ctx.shadowBlur=46;
    ctx.fillStyle='#ff5d8f';ctx.beginPath();ctx.arc(sx,sy,30,0,6.283);ctx.fill();ctx.restore();
    ctx.strokeStyle='rgba(255,93,143,.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx,sy,44+Math.sin(tt*2)*3,0,6.283);ctx.stroke();
  }else{
    var mh=((hh+24-18)%24)/12;
    var mx=W*(0.14+0.72*mh),my=H*0.8-Math.sin(Math.PI*mh)*H*0.55;
    ctx.fillStyle='#fdf6e9';ctx.beginPath();ctx.arc(mx,my,26,0,6.283);ctx.fill();
    ctx.fillStyle=sky.bot;ctx.beginPath();ctx.arc(mx+11,my-6,22,0,6.283);ctx.fill();
  }
  for(i=0;i<clouds.length;i++){var c=clouds[i];
    var cxp=((c.x+tt*c.sp)%(W+320))-160;
    ctx.fillStyle='rgba(253,246,233,.5)';
    ctx.beginPath();ctx.ellipse(cxp,c.y,c.w,c.w*0.32,0,0,6.283);ctx.fill();
  }
  var pw=Math.min(W*0.62,420),ph=86,px=18,py=H-ph-18;
  ctx.fillStyle='rgba(253,246,233,.94)';
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(px,py,pw,ph,16);else ctx.rect(px,py,pw,ph);
  ctx.fill();
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#ff5d8f';ctx.font='700 40px Georgia,serif';
  ctx.fillText(fmt(now),px+22,py+46);
  ctx.fillStyle='#3a2a22';ctx.font='13px "Courier New",monospace';
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  ctx.fillText(days[now.getDay()]+' · seed '+seed,px+24,py+70);
}
function loop(){t+=0.016;draw(t);if(running&&!REDUCED)raf=requestAnimationFrame(loop);}
function resize(){
  var DPR=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  init(seed);t=0;
  if(REDUCED){draw(0);}else{cancelAnimationFrame(raf);if(running)loop();else draw(0);}
}
document.getElementById('tz-b-seed').addEventListener('click',function(){init((Math.random()*0x7fffffff)|0);if(REDUCED||!running)draw(t);});
document.getElementById('tz-b-pause').addEventListener('click',function(){
  running=!running;this.textContent=running?'Pause':'Resume';
  if(running&&!REDUCED)loop();else{cancelAnimationFrame(raf);draw(t);}
});
document.getElementById('tz-b-clear').addEventListener('click',function(){clouds=[];draw(t);});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
