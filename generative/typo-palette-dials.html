<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dial-Controlled Palettes — TZ-taste Generative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f1ea;color:#1c1a16;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tz-head{text-align:center;padding:1.6rem 1.2rem .8rem;max-width:680px}
.tz-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:.6rem}
.tz-title{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;margin-bottom:.5rem}
.tz-caption{font-style:italic;font-size:.98rem;line-height:1.5;opacity:.72}
.tz-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem .4rem}
.tz-btn{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #1c1a16;background:transparent;color:#1c1a16;cursor:pointer}
.tz-btn:hover{background:#1c1a16;color:#f4f1ea}
.tz-dialbar{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center;padding:.8rem 1rem 1rem}
.tz-dial{display:flex;flex-direction:column;gap:.4rem;font-family:'Courier New',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.tz-range{width:170px;accent-color:#1c1a16;cursor:pointer}
.tz-read{opacity:.6}
.tz-wrap{width:100%;max-width:980px;padding:0 1rem 2.5rem}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border:1px solid rgba(28,26,22,.3);border-radius:14px;background:#f4f1ea}
</style>
</head>
<body>
<header class="tz-head">
<p class="tz-kicker">TZ-taste · Generative</p>
<h1 class="tz-title">Dial-Controlled Palettes</h1>
<p class="tz-caption">Three dials live-remix the hue, saturation, and lightness of the entire scene. Turn them and watch everything repaint at once.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" id="tz-b-seed" type="button">New seed</button>
<button class="tz-btn" id="tz-b-pause" type="button">Pause</button>
<button class="tz-btn" id="tz-b-clear" type="button">Clear</button>
</div>
<div class="tz-dialbar">
<label class="tz-dial">Hue <span class="tz-read" id="tz-hv">168</span><input class="tz-range" id="tz-d-hue" type="range" min="0" max="360" value="168"></label>
<label class="tz-dial">Saturation <span class="tz-read" id="tz-sv">70</span><input class="tz-range" id="tz-d-sat" type="range" min="0" max="100" value="70"></label>
<label class="tz-dial">Lightness <span class="tz-read" id="tz-lv">55</span><input class="tz-range" id="tz-d-lit" type="range" min="12" max="88" value="55"></label>
</div>
<div class="tz-wrap"><canvas class="tz-canvas" id="tz-cv"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,seed=16870,running=true,raf=0,t=0,barSeed=[];
var dHue=document.getElementById('tz-d-hue'),dSat=document.getElementById('tz-d-sat'),dLit=document.getElementById('tz-d-lit');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hsl(h,s,l){return 'hsl('+((h%360+360)%360|0)+','+(s|0)+'%,'+(l|0)+'%)';}
function readouts(){
  document.getElementById('tz-hv').textContent=dHue.value;
  document.getElementById('tz-sv').textContent=dSat.value;
  document.getElementById('tz-lv').textContent=dLit.value;
}
function init(s){
  seed=s;var rnd=mulberry32(s),i;
  barSeed=[];
  for(i=0;i<9;i++)barSeed.push(0.4+rnd()*0.6);
  if(!REDUCED)draw(t);else draw(0);
}
function draw(tt){
  var h=+dHue.value,s=+dSat.value,l=+dLit.value,i;
  ctx.fillStyle='#f4f1ea';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=hsl(h,s*0.22,86);ctx.lineWidth=1;
  for(i=0;i*48<W;i++){ctx.beginPath();ctx.moveTo(i*48,0);ctx.lineTo(i*48,H);ctx.stroke();}
  for(i=0;i*48<H;i++){ctx.beginPath();ctx.moveTo(0,i*48);ctx.lineTo(W,i*48);ctx.stroke();}
  var cx=W/2,cy=H*0.42;
  for(i=0;i<3;i++){
    var rad=86+i*58;
    ctx.strokeStyle=hsl(h+i*40,s,l-6);ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,6.283);ctx.stroke();
    var a=tt*(0.4+i*0.25)*(i%2?-1:1);
    ctx.fillStyle=hsl(h+i*40,s,l-6);
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,7,0,6.283);ctx.fill();
  }
  ctx.font='700 '+Math.min(W*0.17,130)+'px Georgia,serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=hsl(h,s,l-14);
  ctx.fillText('CHROMA',cx,cy+4);
  ctx.font='12px "Courier New",monospace';ctx.fillStyle=hsl(h,s,30);
  ctx.fillText('hsl('+((h|0))+', '+(s|0)+'%, '+(l|0)+'%)',cx,cy+Math.min(W*0.17,130)*0.62);
  var bw=W/9;
  for(i=0;i<9;i++){
    var bh=barSeed[i]*H*0.2;
    ctx.fillStyle=hsl(h+i*14,s,l-8+(i%3)*8);
    ctx.fillRect(i*bw+4,H-bh-14,bw-8,bh);
  }
  readouts();
}
function loop(){t+=0.016;draw(t);if(running&&!REDUCED)raf=requestAnimationFrame(loop);}
function resize(){
  var DPR=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  init(seed);
  if(REDUCED){draw(0);}else{cancelAnimationFrame(raf);t=0;if(running)loop();else draw(0);}
}
[dHue,dSat,dLit].forEach(function(d){
  d.addEventListener('input',function(){if(REDUCED||!running)draw(t);readouts();});
});
document.getElementById('tz-b-seed').addEventListener('click',function(){
  var rnd=mulberry32((Math.random()*0x7fffffff)|0);
  dHue.value=(rnd()*360)|0;dSat.value=40+((rnd()*60)|0);dLit.value=25+((rnd()*55)|0);
  init((Math.random()*0x7fffffff)|0);
});
document.getElementById('tz-b-pause').addEventListener('click',function(){
  running=!running;this.textContent=running?'Pause':'Resume';
  if(running&&!REDUCED)loop();else{cancelAnimationFrame(raf);draw(t);}
});
document.getElementById('tz-b-clear').addEventListener('click',function(){
  dHue.value=168;dSat.value=70;dLit.value=55;init(seed);
});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
