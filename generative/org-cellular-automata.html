<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cellular Automata — TZ-taste</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e6;color:#3c4a3c;font-family:"Avenir Next","Segoe UI",Verdana,sans-serif;-webkit-font-smoothing:antialiased}
.tz-wrap{max-width:760px;margin:0 auto;padding:20px 16px 32px}
.tz-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;margin:0 0 8px}
.tz-title{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:30px;margin:0 0 8px;letter-spacing:.01em}
.tz-caption{font-size:14px;line-height:1.55;opacity:.78;margin:0 0 16px;max-width:58ch}
.tz-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tz-btn{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;opacity:.9}
.tz-btn:hover{opacity:1;background:rgba(60,74,60,.08)}
.tz-btn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.tz-readout{font-size:13px;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border-radius:14px;border:1px solid rgba(60,74,60,.25);background:#f4f1e6;cursor:crosshair}
.tz-foot{font-size:12px;opacity:.55;margin:12px 0 0;line-height:1.5}
</style>
</head>
<body>
<div class="tz-wrap">
<header>
<p class="tz-kicker">TZ-taste &middot; Generative</p>
<h1 class="tz-title">Cellular Automata</h1>
<p class="tz-caption">Elementary cellular automata growing downward, row by row from a single cell. Click anywhere on the canvas to jump to a new rule, 0&ndash;255.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" type="button" id="tz-seed">New seed</button>
<button class="tz-btn" type="button" id="tz-pause">Pause</button>
<button class="tz-btn" type="button" id="tz-clear">Clear</button>
<span class="tz-readout" id="tz-rule">Rule 30</span>
</div>
<canvas class="tz-canvas" id="tz-cv"></canvas>
<p class="tz-foot">Real elementary rules with wraparound edges. Rule 30 is chaotic; try 90, 110, or 184. Seeded with mulberry32.</p>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var seedB=document.getElementById('tz-seed'),pauseB=document.getElementById('tz-pause'),clearB=document.getElementById('tz-clear');
var readout=document.getElementById('tz-rule');
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var DPR=Math.min(window.devicePixelRatio||1,2),W=0,H=0;
var CELL=3,cols=0,cells=[],rule=30,rowsDrawn=0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mulberry32((Math.random()*4294967296)|0);
function init(){
  cols=Math.max(8,Math.floor(W/CELL));
  cells=new Array(cols).fill(0);
  cells[(rng()*cols)|0]=1;
  rowsDrawn=0;
  ctx.fillStyle='#f4f1e6';ctx.fillRect(0,0,W,H);
}
function nextGen(){
  var nx=new Array(cols);
  for(var x=0;x<cols;x++){
    var l=cells[(x-1+cols)%cols],c=cells[x],r=cells[(x+1)%cols];
    nx[x]=(rule>>(l*4+c*2+r))&1;
  }
  cells=nx;
}
function drawRow(){
  ctx.fillStyle='#4a5d4a';
  var y=rowsDrawn*CELL;
  for(var x=0;x<cols;x++)if(cells[x])ctx.fillRect(x*CELL,y,CELL,CELL);
}
function advance(){
  drawRow();rowsDrawn++;nextGen();
  drawRow();rowsDrawn++;nextGen();
  if(rowsDrawn*CELL>=H)init();
}
var raf=0,paused=false;
function loop(){if(paused)return;advance();raf=requestAnimationFrame(loop);}
function setRule(r){rule=r&255;readout.textContent='Rule '+rule;init();}
function resize(){
  var rect=cv.getBoundingClientRect();
  W=Math.max(1,Math.round(rect.width));H=Math.max(1,Math.round(rect.height));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  init();
  if(reduced){while(rowsDrawn*CELL<H){drawRow();rowsDrawn++;nextGen();}}
}
cv.addEventListener('click',function(e){
  var rect=cv.getBoundingClientRect();
  var fx=(e.clientX-rect.left)/rect.width;
  setRule(Math.floor(fx*256));
  if(!reduced&&!paused){cancelAnimationFrame(raf);loop();}
});
seedB.addEventListener('click',function(){rng=mulberry32((Math.random()*4294967296)|0);paused=false;pauseB.textContent='Pause';cancelAnimationFrame(raf);init();if(reduced){while(rowsDrawn*CELL<H){drawRow();rowsDrawn++;nextGen();}}else loop();});
pauseB.addEventListener('click',function(){if(reduced)return;paused=!paused;pauseB.textContent=paused?'Resume':'Pause';if(!paused)loop();});
clearB.addEventListener('click',function(){init();if(!reduced&&!paused){cancelAnimationFrame(raf);loop();}});
window.addEventListener('resize',function(){cancelAnimationFrame(raf);resize();if(!reduced&&!paused)loop();});
resize();if(!reduced)loop();
})();
</script>
</body>
</html>
