<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Trails — TZ-taste Generative</title>
<style>
*{box-sizing:border-box}
.tz-gen-body{margin:0;background:#070d0a;color:#e6f2e9;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.tz-gen-wrap{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
.tz-gen-head{margin:0 0 28px}
.tz-gen-kicker{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#86ff9e;margin:0 0 14px}
.tz-gen-head h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 12px;font-weight:600}
.tz-gen-caption{font-size:16px;line-height:1.6;color:#93a89a;margin:0;max-width:62ch}
.tz-gen-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 14px}
.tz-gen-btn{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:#e6f2e9;border:1px solid #26352b;padding:10px 18px;border-radius:3px;cursor:pointer}
.tz-gen-btn:hover{border-color:#86ff9e;color:#86ff9e}
.tz-gen-seed{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;color:#5a6b60;margin-left:auto}
.tz-gen-canvas{display:block;width:100%;height:70vh;border:1px solid #16241b;border-radius:3px;background:#070d0a}
.tz-gen-note{font-size:14px;line-height:1.65;color:#7c8f83;margin:18px 0 0;max-width:70ch}
@media(max-width:520px){.tz-gen-wrap{padding:32px 16px 48px}.tz-gen-seed{margin-left:0;width:100%}}
</style>
</head>
<body class="tz-gen-body">
<div class="tz-gen-wrap">
  <header class="tz-gen-head">
    <p class="tz-gen-kicker">TZ-taste · Generative</p>
    <h1>Wind Trails</h1>
    <p class="tz-gen-caption">Three stacked wind layers, each a sum of traveling sine waves. Particles ride their layer eastward; the layers breathe at different tempos.</p>
  </header>
  <div class="tz-gen-bar">
    <button class="tz-gen-btn" id="tzSeed">New seed</button>
    <button class="tz-gen-btn" id="tzPause">Pause</button>
    <button class="tz-gen-btn" id="tzClear">Clear</button>
    <span class="tz-gen-seed" id="tzSeedLabel">Seed 0</span>
  </div>
  <canvas class="tz-gen-canvas" id="tzCv" aria-label="Layered sine-wind ribbons carrying particles"></canvas>
  <p class="tz-gen-note">Like watching weather radar in slow motion. A new seed changes the wave frequencies, so no two skies repeat.</p>
</div>
<script>
'use strict';
const cv=document.getElementById('tzCv'),ctx=cv.getContext('2d');
const seedLabel=document.getElementById('tzSeedLabel');
let W=0,H=0,seed=(Math.random()*1e9)|0,rand=null,layers=[],parts=[],t=0,running=true;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG='#070d0a';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function init(){
  rand=mulberry32(seed);
  layers=[];
  const cols=[['134,255,158',0.5],['64,200,120',0.38],['28,140,90',0.3]];
  for(let l=0;l<3;l++){
    const waves=[];
    for(let k=0;k<3;k++)waves.push({f:0.002+rand()*0.006,s:(0.2+rand()*0.6)*(rand()<0.5?-1:1),a:14+rand()*30,p:rand()*7});
    layers.push({waves,base:H*(0.25+l*0.25),col:cols[l][0],alpha:cols[l][1],speed:1.1+l*0.55});
  }
  parts=[];const n=Math.max(180,Math.min(520,Math.floor(W*H/2400)));
  for(let i=0;i<n;i++){const l=(rand()*3)|0;parts.push({x:rand()*W,y:0,l,px:0,py:0});parts[i].y=layerY(l,parts[i].x);}
  parts.forEach(p=>{p.px=p.x;p.py=p.y;});
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  seedLabel.textContent='Seed '+seed;t=0;
}
function layerY(l,x){
  const L=layers[l];let y=L.base;
  for(const w of L.waves)y+=w.a*Math.sin(x*w.f+t*w.s+w.p);
  return y;
}
function step(){
  t+=0.016;
  ctx.fillStyle='rgba(7,13,10,0.055)';ctx.fillRect(0,0,W,H);
  ctx.lineWidth=1;
  for(let l=0;l<3;l++){
    const L=layers[l];
    ctx.strokeStyle='rgba('+L.col+','+(L.alpha*0.28)+')';
    ctx.beginPath();
    for(let x=0;x<=W;x+=14){const y=layerY(l,x);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();
    ctx.strokeStyle='rgba('+L.col+','+L.alpha+')';
    ctx.beginPath();
    for(const p of parts){
      if(p.l!==l)continue;
      p.px=p.x;p.py=p.y;p.x+=L.speed;
      if(p.x>W+10){p.x=-10;}
      p.y=layerY(l,p.x);
      ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }
}
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=Math.max(2,Math.round(r.width));H=Math.max(2,Math.round(r.height));
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);init();
}
window.addEventListener('resize',resize);
document.getElementById('tzSeed').addEventListener('click',()=>{seed=(Math.random()*1e9)|0;init();if(!running)toggle();});
document.getElementById('tzClear').addEventListener('click',init);
function toggle(){running=!running;document.getElementById('tzPause').textContent=running?'Pause':'Resume';if(running&&!reduced)tick();}
document.getElementById('tzPause').addEventListener('click',toggle);
function tick(){if(!running)return;step();requestAnimationFrame(tick);}
resize();
if(reduced){for(let i=0;i<260;i++)step();}
else tick();
</script>
</body>
</html>
