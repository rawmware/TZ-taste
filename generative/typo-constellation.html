<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation Text — TZ-taste Generative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#052530;color:#d9f6ff;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tz-head{text-align:center;padding:1.6rem 1.2rem .8rem;max-width:680px}
.tz-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:.6rem}
.tz-title{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;margin-bottom:.5rem}
.tz-caption{font-style:italic;font-size:.98rem;line-height:1.5;opacity:.72}
.tz-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem 1rem}
.tz-btn{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #67e8f9;background:transparent;color:#67e8f9;cursor:pointer}
.tz-btn:hover{background:#67e8f9;color:#052530}
.tz-wrap{width:100%;max-width:980px;padding:0 1rem 2.5rem}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border:1px solid rgba(103,232,249,.25);border-radius:14px;touch-action:none;background:#052530}
</style>
</head>
<body>
<header class="tz-head">
<p class="tz-kicker">TZ-taste · Generative</p>
<h1 class="tz-title">Constellation Text</h1>
<p class="tz-caption">The word ORION is rebuilt from star-nodes sampled off its own letterforms, linked like a constellation. Drift your cursor near it.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" id="tz-b-seed" type="button">New seed</button>
<button class="tz-btn" id="tz-b-pause" type="button">Pause</button>
<button class="tz-btn" id="tz-b-clear" type="button">Clear</button>
</div>
<div class="tz-wrap"><canvas class="tz-canvas" id="tz-cv"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,seed=1985,nodes=[],links=[],running=true,raf=0,t=0;
var mouse={x:-9999,y:-9999};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function glyphPoints(rnd){
  var c=document.createElement('canvas');c.width=600;c.height=220;
  var g=c.getContext('2d');
  g.font='700 150px Georgia,serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
  g.fillText('ORION',300,118);
  var d=g.getImageData(0,0,600,220).data,pts=[],x,y;
  for(y=0;y<220;y+=6)for(x=0;x<600;x+=6){
    if(d[(y*600+x)*4+3]>128)pts.push({x:x/600,y:y/220});
  }
  return pts;
}
function init(s){
  seed=s;var rnd=mulberry32(s),i,pts=glyphPoints(rnd);
  nodes=[];links=[];
  var gw=Math.min(W*0.86,760),gh=gw*0.34,ox=(W-gw)/2,oy=(H-gh)/2;
  var step=Math.max(1,Math.floor(pts.length/110));
  for(i=0;i<pts.length;i+=step){
    var p=pts[i],bx=ox+p.x*gw,by=oy+p.y*gh;
    nodes.push({bx:bx,by:by,x:bx,y:by,ph:rnd()*6.28,sp:.3+rnd()*.7,star:false,r:1.6+rnd()*1.6});
  }
  for(i=0;i<46;i++){
    bx=rnd()*W;by=rnd()*H;
    nodes.push({bx:bx,by:by,x:bx,y:by,ph:rnd()*6.28,sp:.4+rnd()*.8,star:true,r:.8+rnd()*1.2});
  }
  var glyph=nodes.filter(function(n){return !n.star;});
  for(i=0;i<glyph.length;i++)for(var j=i+1;j<glyph.length;j++){
    var a=glyph[i],b=glyph[j],d=Math.hypot(a.bx-b.bx,a.by-b.by);
    if(d<52)links.push({a:i,b:glyph.indexOf(b),d:d});
  }
}
function draw(tt){
  ctx.fillStyle='#052530';ctx.fillRect(0,0,W,H);
  var i,n,dx,dy,d;
  for(i=0;i<nodes.length;i++){n=nodes[i];
    n.x=n.bx+Math.sin(tt*n.sp+n.ph)*6;
    n.y=n.by+Math.cos(tt*n.sp*.8+n.ph)*6;
    dx=n.x-mouse.x;dy=n.y-mouse.y;d=Math.hypot(dx,dy);
    if(d<120&&!n.star){n.x+=dx/(d+1)*14;n.y+=dy/(d+1)*14;}
  }
  ctx.lineWidth=1;
  for(i=0;i<links.length;i++){
    var a=nodes[links[i].a],b=nodes[links[i].b];
    ctx.strokeStyle='rgba(103,232,249,'+(0.34*(1-links[i].d/52)).toFixed(3)+')';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  for(i=0;i<nodes.length;i++){n=nodes[i];
    var tw=n.star?(0.35+0.65*Math.abs(Math.sin(tt*n.sp+n.ph))):1;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,6.283);
    if(n.star){ctx.fillStyle='rgba(217,246,255,'+(0.55*tw).toFixed(3)+')';}
    else{ctx.shadowColor='#67e8f9';ctx.shadowBlur=8;ctx.fillStyle='rgba(165,243,252,'+tw.toFixed(3)+')';}
    ctx.fill();ctx.shadowBlur=0;
  }
  ctx.font='12px "Courier New",monospace';ctx.fillStyle='rgba(217,246,255,.5)';
  ctx.textAlign='left';ctx.fillText('ORION · '+nodes.length+' nodes · seed '+seed,14,H-14);
}
function loop(){t+=0.016;draw(t);if(running&&!REDUCED)raf=requestAnimationFrame(loop);}
function resize(){
  var DPR=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  init(seed);
  if(REDUCED){draw(0.8);}else{cancelAnimationFrame(raf);t=0;if(running)loop();else draw(0);}
}
cv.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
cv.addEventListener('pointerleave',function(){mouse.x=-9999;mouse.y=-9999;});
document.getElementById('tz-b-seed').addEventListener('click',function(){init((Math.random()*0x7fffffff)|0);if(REDUCED)draw(0.8);});
document.getElementById('tz-b-pause').addEventListener('click',function(){
  running=!running;this.textContent=running?'Pause':'Resume';
  if(running&&!REDUCED)loop();else cancelAnimationFrame(raf);
});
document.getElementById('tz-b-clear').addEventListener('click',function(){nodes=[];links=[];draw(t);});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
