<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Crystal Window — TZ-taste Generative</title>
<style>
*{box-sizing:border-box}
.tz-gen-body{margin:0;background:#060a18;color:#dfe6f5;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.tz-gen-wrap{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
.tz-gen-head{margin:0 0 28px}
.tz-gen-kicker{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#c9a24b;margin:0 0 14px}
.tz-gen-head h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 12px;font-weight:600}
.tz-gen-caption{font-size:16px;line-height:1.6;color:#5f6b8a;margin:0;max-width:62ch}
.tz-gen-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 14px}
.tz-gen-btn{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:#dfe6f5;border:1px solid #2a3350;padding:10px 18px;border-radius:3px;cursor:pointer}
.tz-gen-btn:hover{border-color:#c9a24b;color:#c9a24b}
.tz-gen-seed{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;color:#5f6b8a;margin-left:auto}
.tz-gen-canvas{display:block;width:100%;height:70vh;border:1px solid #2a3350;border-radius:3px;background:#060a18}
.tz-gen-note{font-size:14px;line-height:1.65;color:#5f6b8a;margin:18px 0 0;max-width:70ch}
@media(max-width:520px){.tz-gen-wrap{padding:32px 16px 48px}.tz-gen-seed{margin-left:0;width:100%}}
</style>
</head>
<body class="tz-gen-body">
<div class="tz-gen-wrap">
  <header class="tz-gen-head">
    <p class="tz-gen-kicker">TZ-taste · Generative</p>
    <h1>Ice Crystal Window</h1>
    <p class="tz-gen-caption">Frost grows the way it does on real glass: wandering vapor molecules freeze the instant they touch the crystal. Watch the ferns crawl in from the frame.</p>
  </header>
  <div class="tz-gen-bar">
    <button class="tz-gen-btn" id="tzSeed">New seed</button>
    <button class="tz-gen-btn" id="tzPause">Pause</button>
    <button class="tz-gen-btn" id="tzClear">Clear</button>
    <span class="tz-gen-seed" id="tzSeedLabel">Seed 0</span>
  </div>
  <canvas class="tz-gen-canvas" id="tzCv" aria-label="Frost crystals growing across a dark window"></canvas>
  <p class="tz-gen-note">Growth slows as the pane fills. A new seed wipes the glass and starts the freeze over.</p>
</div>
<script>
'use strict';
const cv=document.getElementById('tzCv'),ctx=cv.getContext('2d');
const seedLabel=document.getElementById('tzSeedLabel');
let W=0,H=0,seed=(Math.random()*1e9)|0,rand=null,t=0,running=true;
let grid=null,cols=0,rows=0,cell=5,walkers=[],frozen=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG='#060a18',FROST='#9fb8d8';
const TARGET=2600;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function idx(x,y){return y*cols+x;}
function touches(x,y){
  if(x>0&&grid[idx(x-1,y)])return true;
  if(x<cols-1&&grid[idx(x+1,y)])return true;
  if(y>0&&grid[idx(x,y-1)])return true;
  if(y<rows-1&&grid[idx(x,y+1)])return true;
  return false;
}
function freeze(x,y){
  grid[idx(x,y)]=1;frozen++;
  ctx.fillStyle=FROST;ctx.globalAlpha=0.75;
  ctx.fillRect(x*cell,y*cell,cell,cell);
  ctx.globalAlpha=1;
}
function spawnWalker(){
  return {x:Math.floor(rand()*cols),y:Math.floor(rand()*rows)};
}
function init(){
  rand=mulberry32(seed);t=0;frozen=0;walkers=[];
  cell=5;cols=Math.floor(W/cell);rows=Math.floor(H/cell);
  grid=new Uint8Array(cols*rows);
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#2a3350';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  const midX=Math.floor(cols/2),midY=Math.floor(rows/2);
  for(let x=0;x<cols;x++){freeze(x,0);freeze(x,rows-1);}
  for(let y=0;y<rows;y++){freeze(0,y);freeze(cols-1,y);freeze(midX,y);freeze(x,midY);}
  for(let i=0;i<24;i++)walkers.push(spawnWalker());
  seedLabel.textContent='Seed '+seed;
}
function step(){
  t+=0.016;
  if(frozen>=TARGET)return;
  const moves=reduced?4000:300;
  for(let m=0;m<moves&&frozen<TARGET;m++){
    for(const w of walkers){
      w.x+=(Math.floor(rand()*3)-1);
      w.y+=(Math.floor(rand()*3)-1);
      if(w.x<0)w.x=0;if(w.x>=cols)w.x=cols-1;
      if(w.y<0)w.y=0;if(w.y>=rows)w.y=rows-1;
      if(!grid[idx(w.x,w.y)]&&touches(w.x,w.y)){
        freeze(w.x,w.y);
        w.x=Math.floor(rand()*cols);w.y=Math.floor(rand()*rows);
      }
    }
  }
}
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=Math.max(2,Math.round(r.width));H=Math.max(2,Math.round(r.height));
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);init();
}
window.addEventListener('resize',resize);
document.getElementById('tzSeed').addEventListener('click',()=>{seed=(Math.random()*1e9)|0;init();if(!running)toggle();});
document.getElementById('tzClear').addEventListener('click',init);
function toggle(){running=!running;document.getElementById('tzPause').textContent=running?'Pause':'Resume';if(running&&!reduced)tick();}
document.getElementById('tzPause').addEventListener('click',toggle);
function tick(){if(!running)return;step();requestAnimationFrame(tick);}
resize();
if(reduced){step();}
else tick();
</script>
</body>
</html>
