<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirograph Gears · TZ-taste</title>
<style>
  .tz-page{background:#F7F3E9;color:#1c1c1c;min-height:100vh;font-family:Georgia,'Times New Roman',serif;margin:0}
  .tz-wrap{max-width:1080px;margin:0 auto;padding:32px 20px 48px}
  .tz-kicker{font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#2A9D8F;margin:0 0 12px}
  .tz-title{font-size:clamp(32px,6vw,52px);font-weight:700;margin:0 0 10px;line-height:1.05}
  .tz-caption{font-size:16px;line-height:1.6;max-width:62ch;margin:0 0 4px;color:#4a4a4a}
  .tz-controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
  .tz-btn{font-family:'Courier New',Courier,monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:#1c1c1c;border:2px solid #1c1c1c;padding:10px 18px;cursor:pointer}
  .tz-btn:hover{background:#E76F8E;border-color:#E76F8E;color:#F7F3E9}
  .tz-btn:active{transform:translateY(1px)}
  .tz-canvas{display:block;width:100%;height:70vh;background:#F7F3E9;border:2px solid #1c1c1c}
  .tz-foot{font-family:'Courier New',Courier,monospace;font-size:12px;color:#8a8a8a;margin:14px 0 0;line-height:1.6}
</style>
</head>
<body class="tz-page">
<div class="tz-wrap">
  <p class="tz-kicker">TZ-taste · Generative</p>
  <h1 class="tz-title">Spirograph Gears</h1>
  <p class="tz-caption">The hypotrochoid equation — x = (R−r)·cos θ + d·cos(((R−r)/r)·θ) — traced by two meshing gears, overprinted in teal and pink.</p>
  <div class="tz-controls">
    <button class="tz-btn" id="tz-seed" type="button">New seed</button>
    <button class="tz-btn" id="tz-pause" type="button">Pause</button>
    <button class="tz-btn" id="tz-clear" type="button">Clear</button>
  </div>
  <canvas class="tz-canvas" id="tz-canvas"></canvas>
  <p class="tz-foot">One distinctive choice: a print-grain overlay keeps every frame looking like a two-color risograph pull. Seed <span id="tz-seednum"></span>.</p>
</div>
<script>
(function(){
  var BG='#F7F3E9', TEAL='#2A9D8F', PINK='#E76F8E';
  var canvas=document.getElementById('tz-canvas'), ctx=canvas.getContext('2d');
  var seedBtn=document.getElementById('tz-seed'), pauseBtn=document.getElementById('tz-pause'),
      clearBtn=document.getElementById('tz-clear'), seedNum=document.getElementById('tz-seednum');
  var seed=918273, rng=mulberry32(seed), gears=[], W=0, H=0;
  var running=true, raf=null, last=0, grain=null;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  function makeGrain(){
    grain=document.createElement('canvas');
    grain.width=Math.max(1,Math.floor(W)); grain.height=Math.max(1,Math.floor(H));
    var g=grain.getContext('2d'), grng=mulberry32(seed*7+3);
    var id=g.createImageData(grain.width,grain.height), d=id.data;
    for(var i=0;i<d.length;i+=4){
      if(grng()<0.05){var v=grng()<0.5?20:235;d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=46;}
      else{d[i+3]=0;}
    }
    g.putImageData(id,0,0);
  }

  function init(){
    rng=mulberry32(seed); gears=[];
    var m=Math.min(W,H)/2;
    var R=m*(0.82+rng()*0.1);
    for(var i=0;i<2;i++){
      var ratio=[3,4,5,6,7,8][Math.floor(rng()*6)];
      var r=R/ratio;
      gears.push({
        R:R, r:r,
        d:r*(0.35+rng()*0.6),
        cx:W/2+(rng()-0.5)*W*0.08, cy:H/2+(rng()-0.5)*H*0.08,
        color:i===0?TEAL:PINK, lw:i===0?2.2:1.4,
        theta:0, thetaMax:Math.PI*2*ratio*1.6, speed:1.6+rng()*1.2
      });
    }
    makeGrain();
    seedNum.textContent=seed;
  }

  function pt(g,th){
    var k=(g.R-g.r)/g.r;
    return [g.cx+(g.R-g.r)*Math.cos(th)+g.d*Math.cos(k*th),
            g.cy+(g.R-g.r)*Math.sin(th)-g.d*Math.sin(k*th)];
  }

  function drawGear(g,from,to){
    ctx.beginPath();
    var steps=Math.max(8,Math.floor((to-from)/0.01));
    for(var i=0;i<=steps;i++){
      var p=pt(g,from+(to-from)*i/steps);
      if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
    }
    ctx.strokeStyle=g.color; ctx.lineWidth=g.lw; ctx.lineJoin='round'; ctx.stroke();
  }

  function paint(){
    ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
    for(var i=0;i<gears.length;i++) drawGear(gears[i],0,gears[i].theta);
    ctx.globalAlpha=0.9; ctx.drawImage(grain,0,0,W,H); ctx.globalAlpha=1;
  }

  function frame(ts){
    if(!running){raf=null;return;}
    var dt=Math.min((ts-last)/1000,0.05); last=ts;
    var done=true;
    for(var i=0;i<gears.length;i++){
      var g=gears[i];
      if(g.theta<g.thetaMax){g.theta=Math.min(g.thetaMax,g.theta+g.speed*dt);drawGear(g,Math.max(0,g.theta-g.speed*dt*1.2),g.theta);}
      else done=true;
    }
    ctx.globalAlpha=0.9; ctx.drawImage(grain,0,0,W,H); ctx.globalAlpha=1;
    if(!done||true) raf=requestAnimationFrame(frame);
  }

  function renderStatic(){
    for(var i=0;i<gears.length;i++) gears[i].theta=gears[i].thetaMax;
    paint();
  }

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var r=canvas.getBoundingClientRect();
    W=r.width; H=r.height;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    init();
    if(reduced) renderStatic(); else paint();
  }

  seedBtn.addEventListener('click',function(){seed=(seed*9301+49297)%233280;init();paint();});
  pauseBtn.addEventListener('click',function(){
    running=!running; pauseBtn.textContent=running?'Pause':'Resume';
    if(running&&!reduced){last=performance.now();raf=requestAnimationFrame(frame);}
  });
  clearBtn.addEventListener('click',function(){paint();});

  window.addEventListener('resize',resize);
  resize();
  if(!reduced){last=performance.now();raf=requestAnimationFrame(frame);}
})();
</script>
</body>
</html>
