<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phyllotaxis Spiral — TZ-taste Generative</title>
<style>
*{box-sizing:border-box}
.tz-gen-body{margin:0;background:#efe6d0;color:#2b2419;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.tz-gen-wrap{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
.tz-gen-head{margin:0 0 28px}
.tz-gen-kicker{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#3f7043;margin:0 0 14px}
.tz-gen-head h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 12px;font-weight:600}
.tz-gen-caption{font-size:16px;line-height:1.6;color:#7a6c52;margin:0;max-width:62ch}
.tz-gen-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 14px}
.tz-gen-btn{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:#2b2419;border:1px solid #c9b98f;padding:10px 18px;border-radius:3px;cursor:pointer}
.tz-gen-btn:hover{border-color:#3f7043;color:#3f7043}
.tz-gen-seed{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;color:#7a6c52;margin-left:auto}
.tz-gen-canvas{display:block;width:100%;height:70vh;border:1px solid #c9b98f;border-radius:3px;background:#efe6d0}
.tz-gen-note{font-size:14px;line-height:1.65;color:#7a6c52;margin:18px 0 0;max-width:70ch}
@media(max-width:520px){.tz-gen-wrap{padding:32px 16px 48px}.tz-gen-seed{margin-left:0;width:100%}}
</style>
</head>
<body class="tz-gen-body">
<div class="tz-gen-wrap">
  <header class="tz-gen-head">
    <p class="tz-gen-kicker">TZ-taste · Generative</p>
    <h1>Phyllotaxis Spiral</h1>
    <p class="tz-gen-caption">Each seed is placed 137.5 degrees around from the last — the golden angle — and a sunflower head assembles itself dot by dot.</p>
  </header>
  <div class="tz-gen-bar">
    <button class="tz-gen-btn" id="tzSeed">New seed</button>
    <button class="tz-gen-btn" id="tzPause">Pause</button>
    <button class="tz-gen-btn" id="tzClear">Clear</button>
    <span class="tz-gen-seed" id="tzSeedLabel">Seed 0</span>
  </div>
  <canvas class="tz-gen-canvas" id="tzCv" aria-label="A phyllotaxis spiral growing dot by dot"></canvas>
  <p class="tz-gen-note">The jitter is the point: perfect math makes perfect spirals, but a little noise makes it feel grown.</p>
</div>
<script>
'use strict';
const cv=document.getElementById('tzCv'),ctx=cv.getContext('2d');
const seedLabel=document.getElementById('tzSeedLabel');
let W=0,H=0,seed=(Math.random()*1e9)|0,rand=null,i=0,t=0,running=true;
let GA=2.39996,c=6,jitter=0,total=900;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG='#efe6d0';
const GREENS=['#3f7043','#5a8a52','#2b5a34','#7ba05b','#446b3a'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function init(){
  rand=mulberry32(seed);i=0;t=0;
  GA=2.39996+(rand()-0.5)*0.06;
  jitter=rand()*0.5;
  total=700+Math.floor(rand()*500);
  c=Math.min(W,H)*0.5/Math.sqrt(total)*0.92;
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  seedLabel.textContent='Seed '+seed;
}
function dot(n){
  const a=n*GA+(rand()-0.5)*jitter*0.1;
  const r=c*Math.sqrt(n);
  const x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;
  ctx.fillStyle=GREENS[n%GREENS.length];
  ctx.globalAlpha=0.88;
  ctx.beginPath();ctx.arc(x,y,1.6+ (n/total)*3.4,0,7);ctx.fill();
}
function step(){
  t+=0.016;
  const batch=reduced?total:26;
  for(let k=0;k<batch&&i<total;k++){dot(i);i++;}
  ctx.globalAlpha=1;
}
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=Math.max(2,Math.round(r.width));H=Math.max(2,Math.round(r.height));
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);init();
}
window.addEventListener('resize',resize);
document.getElementById('tzSeed').addEventListener('click',()=>{seed=(Math.random()*1e9)|0;init();if(!running)toggle();});
document.getElementById('tzClear').addEventListener('click',init);
function toggle(){running=!running;document.getElementById('tzPause').textContent=running?'Pause':'Resume';if(running&&!reduced)tick();}
document.getElementById('tzPause').addEventListener('click',toggle);
function tick(){if(!running)return;step();requestAnimationFrame(tick);}
resize();
if(reduced){step();}
else tick();
</script>
</body>
</html>
