<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke Letters — TZ-taste Generative</title>
<style>
*{box-sizing:border-box}
.tz-gen-body{margin:0;background:#0a0c0e;color:#e6e1d4;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.tz-gen-wrap{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
.tz-gen-head{margin:0 0 28px}
.tz-gen-kicker{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b9b29e;margin:0 0 14px}
.tz-gen-head h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 12px;font-weight:600}
.tz-gen-caption{font-size:16px;line-height:1.6;color:#98a0a6;margin:0;max-width:62ch}
.tz-gen-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 14px}
.tz-gen-btn{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:#e6e1d4;border:1px solid #2b3238;padding:10px 18px;border-radius:3px;cursor:pointer}
.tz-gen-btn:hover{border-color:#e6e1d4}
.tz-gen-seed{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;color:#5f666c;margin-left:auto}
.tz-gen-canvas{display:block;width:100%;height:70vh;border:1px solid #1c2227;border-radius:3px;background:#0a0c0e}
.tz-gen-note{font-size:14px;line-height:1.65;color:#7d838a;margin:18px 0 0;max-width:70ch}
@media(max-width:520px){.tz-gen-wrap{padding:32px 16px 48px}.tz-gen-seed{margin-left:0;width:100%}}
</style>
</head>
<body class="tz-gen-body">
<div class="tz-gen-wrap">
  <header class="tz-gen-head">
    <p class="tz-gen-kicker">TZ-taste · Generative</p>
    <h1>Smoke Letters</h1>
    <p class="tz-gen-caption">A word is typeset offscreen, its pixels sampled into thousands of smoke motes, then released — the letterforms hold for a breath before rising and dissolving.</p>
  </header>
  <div class="tz-gen-bar">
    <button class="tz-gen-btn" id="tzSeed">New seed</button>
    <button class="tz-gen-btn" id="tzPause">Pause</button>
    <button class="tz-gen-btn" id="tzClear">Clear</button>
    <span class="tz-gen-seed" id="tzSeedLabel">Seed 0</span>
  </div>
  <canvas class="tz-gen-canvas" id="tzCv" aria-label="A word dissolving into rising smoke"></canvas>
  <p class="tz-gen-note">Each seed chooses a different word from a small list. New seed, new word, new weather.</p>
</div>
<script>
'use strict';
const cv=document.getElementById('tzCv'),ctx=cv.getContext('2d');
const seedLabel=document.getElementById('tzSeedLabel');
const WORDS=['drift','bloom','ember','quiet','tide','hollow','woven','still'];
let W=0,H=0,seed=(Math.random()*1e9)|0,rand=null,motes=[],frame=0,running=true,word='';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG='#0a0c0e';
const puff=document.createElement('canvas');puff.width=puff.height=48;
(function(){const g=puff.getContext('2d');const gr=g.createRadialGradient(24,24,1,24,24,22);
gr.addColorStop(0,'rgba(230,225,212,0.7)');gr.addColorStop(0.5,'rgba(230,225,212,0.22)');gr.addColorStop(1,'rgba(230,225,212,0)');
g.fillStyle=gr;g.fillRect(0,0,48,48);})();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function init(){
  rand=mulberry32(seed);motes=[];frame=0;
  word=WORDS[(rand()*WORDS.length)|0];
  const off=document.createElement('canvas');off.width=W;off.height=H;
  const g=off.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  g.font='600 '+Math.round(Math.min(W/(word.length*0.62),H*0.42))+'px Georgia,serif';
  g.fillText(word,W/2,H/2);
  const data=g.getImageData(0,0,W,H).data;
  const stepPx=Math.max(3,Math.round(Math.min(W,H)/160));
  for(let y=0;y<H;y+=stepPx)for(let x=0;x<W;x+=stepPx){
    if(data[(y*W+x)*4]>128&&motes.length<5200){
      motes.push({x:x+(rand()-0.5)*4,y:y+(rand()-0.5)*4,
        vx:(rand()-0.5)*0.3,vy:-(0.1+rand()*0.3),
        life:0,max:200+rand()*260,s:3+rand()*5,
        hold:60+rand()*120,ph:rand()*Math.PI*2});
    }
  }
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  seedLabel.textContent='Seed '+seed+' · “'+word+'”';
}
function step(){
  frame++;
  ctx.fillStyle='rgba(10,12,14,0.075)';ctx.fillRect(0,0,W,H);
  for(let i=motes.length-1;i>=0;i--){
    const m=motes[i];m.life++;
    if(m.life>m.max){motes.splice(i,1);continue;}
    if(m.life>m.hold){
      const k=(m.life-m.hold)/(m.max-m.hold);
      m.vy-=0.008;m.vx+=Math.sin(frame*0.03+m.ph)*0.02;
      m.vx*=0.99;m.vy*=0.99;m.x+=m.vx;m.y+=m.vy;
      const a=0.85*(1-k);
      const s=m.s*(1+k*2.4);
      ctx.globalAlpha=Math.max(0,a);
      ctx.drawImage(puff,m.x-s/2,m.y-s/2,s,s);
    }else{
      ctx.globalAlpha=0.9;ctx.fillStyle='#e6e1d4';
      ctx.fillRect(m.x-0.75,m.y-0.75,1.5,1.5);
    }
  }
  ctx.globalAlpha=1;
  if(motes.length===0&&!reduced)init();
}
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=Math.max(2,Math.round(r.width));H=Math.max(2,Math.round(r.height));
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);init();
}
window.addEventListener('resize',resize);
document.getElementById('tzSeed').addEventListener('click',()=>{seed=(Math.random()*1e9)|0;init();if(!running)toggle();});
document.getElementById('tzClear').addEventListener('click',init);
function toggle(){running=!running;document.getElementById('tzPause').textContent=running?'Pause':'Resume';if(running&&!reduced)tick();}
document.getElementById('tzPause').addEventListener('click',toggle);
function tick(){if(!running)return;step();requestAnimationFrame(tick);}
resize();
if(reduced){for(let i=0;i<520;i++)step();}
else tick();
</script>
</body>
</html>
