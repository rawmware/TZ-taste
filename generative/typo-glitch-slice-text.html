<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitch Slice Text — TZ-taste Generative</title>
<style>
*{box-sizing:border-box}
.tz-gen-body{margin:0;background:#0b0b14;color:#e8f0e8;font-family:'Courier New',Courier,monospace;min-height:100vh}
.tz-gen-wrap{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
.tz-gen-head{margin:0 0 28px}
.tz-gen-kicker{font-family:'Courier New',Courier,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#ff2fb3;margin:0 0 14px}
.tz-gen-head h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 12px;font-weight:700}
.tz-gen-caption{font-size:16px;line-height:1.6;color:#5c6b8c;margin:0;max-width:62ch}
.tz-gen-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 14px}
.tz-gen-btn{font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:#e8f0e8;border:1px solid #1f2a44;padding:10px 18px;border-radius:0;cursor:pointer}
.tz-gen-btn:hover{border-color:#ff2fb3;color:#ff2fb3}
.tz-gen-seed{font-family:'Courier New',Courier,monospace;font-size:12px;color:#5c6b8c;margin-left:auto}
.tz-gen-canvas{display:block;width:100%;height:70vh;border:1px solid #1f2a44;border-radius:0;background:#0b0b14}
.tz-gen-note{font-size:14px;line-height:1.65;color:#5c6b8c;margin:18px 0 0;max-width:70ch}
@media(max-width:520px){.tz-gen-wrap{padding:32px 16px 48px}.tz-gen-seed{margin-left:0;width:100%}}
</style>
</head>
<body class="tz-gen-body">
<div class="tz-gen-wrap">
  <header class="tz-gen-head">
    <p class="tz-gen-kicker">TZ-taste · Generative</p>
    <h1>Glitch Slice Text</h1>
    <p class="tz-gen-caption">Fourteen horizontal strips, each torn sideways with cyan and magenta splits. The interference comes in waves — calm stretches, then bursts.</p>
  </header>
  <div class="tz-gen-bar">
    <button class="tz-gen-btn" id="tzSeed">New seed</button>
    <button class="tz-gen-btn" id="tzPause">Pause</button>
    <button class="tz-gen-btn" id="tzClear">Clear</button>
    <span class="tz-gen-seed" id="tzSeedLabel">Seed 0</span>
  </div>
  <canvas class="tz-gen-canvas" id="tzCv" aria-label="The word STATIC glitching with sliced RGB offsets"></canvas>
  <p class="tz-gen-note">New seeds change the surge rhythm and how hard each strip tears. Reduced-motion gets one frozen tear.</p>
</div>
<script>
'use strict';
const cv=document.getElementById('tzCv'),ctx=cv.getContext('2d');
const seedLabel=document.getElementById('tzSeedLabel');
let W=0,H=0,seed=(Math.random()*1e9)|0,rand=null,t=0,running=true;
let layers=null,surgeP=0.3;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG='#0b0b14',WORD='STATIC',SLICES=14;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function tintCopy(color){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.drawImage(layers.base,0,0);
  g.globalCompositeOperation='source-atop';
  g.fillStyle=color;g.fillRect(0,0,W,H);
  return c;
}
function init(){
  rand=mulberry32(seed);t=0;
  surgeP=0.2+rand()*0.35;
  const base=document.createElement('canvas');base.width=W;base.height=H;
  const g=base.getContext('2d');
  g.fillStyle='#e8f0e8';
  g.font='700 '+Math.min(190,Math.floor(W/3.6))+'px "Courier New",monospace';
  g.textAlign='center';g.textBaseline='middle';
  g.fillText(WORD,W/2,H/2);
  layers={base:base};
  layers.cyan=tintCopy('#00e5ff');
  layers.mag=tintCopy('#ff2fb3');
  seedLabel.textContent='Seed '+seed;
}
function drawFrame(surge){
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  const sh=H/SLICES;
  ctx.globalCompositeOperation='lighter';
  for(let s=0;s<SLICES;s++){
    const sy=s*sh;
    const tear=(rand()-0.5)*surge*90;
    const dx=(rand()-0.5)*surge*40;
    ctx.globalAlpha=0.75;
    ctx.drawImage(layers.cyan,0,sy,W,sh,-14+tear,sy,W,sh);
    ctx.drawImage(layers.mag,0,sy,W,sh,14-tear,sy,W,sh);
    ctx.globalAlpha=0.9;
    ctx.drawImage(layers.base,0,sy,W,sh,dx,sy,W,sh);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.22)';
  for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
}
function step(){
  t+=0.016;
  const wave=Math.pow(Math.max(0,Math.sin(t*0.7)+Math.sin(t*0.23)*0.5-0.6),2)*3;
  const burst=rand()<surgeP*0.02?2.2:1;
  drawFrame(Math.min(1,wave*burst+0.04));
}
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=Math.max(2,Math.round(r.width));H=Math.max(2,Math.round(r.height));
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);init();
}
window.addEventListener('resize',resize);
document.getElementById('tzSeed').addEventListener('click',()=>{seed=(Math.random()*1e9)|0;init();if(!running)toggle();});
document.getElementById('tzClear').addEventListener('click',init);
function toggle(){running=!running;document.getElementById('tzPause').textContent=running?'Pause':'Resume';if(running&&!reduced)tick();}
document.getElementById('tzPause').addEventListener('click',toggle);
function tick(){if(!running)return;step();requestAnimationFrame(tick);}
resize();
if(reduced){drawFrame(0.45);}
else tick();
</script>
</body>
</html>
