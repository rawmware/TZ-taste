<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blooming Flowers — TZ-taste</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e6;color:#3c4a3c;font-family:"Avenir Next","Segoe UI",Verdana,sans-serif;-webkit-font-smoothing:antialiased}
.tz-wrap{max-width:760px;margin:0 auto;padding:20px 16px 32px}
.tz-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;margin:0 0 8px}
.tz-title{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:30px;margin:0 0 8px;letter-spacing:.01em}
.tz-caption{font-size:14px;line-height:1.55;opacity:.78;margin:0 0 16px;max-width:58ch}
.tz-controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tz-btn{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;opacity:.9}
.tz-btn:hover{opacity:1;background:rgba(60,74,60,.08)}
.tz-btn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border-radius:14px;border:1px solid rgba(60,74,60,.25);background:#f4f1e6}
.tz-foot{font-size:12px;opacity:.55;margin:12px 0 0;line-height:1.5}
</style>
</head>
<body>
<div class="tz-wrap">
<header>
<p class="tz-kicker">TZ-taste &middot; Generative</p>
<h1 class="tz-title">Blooming Flowers</h1>
<p class="tz-caption">Nine flowers open petal by petal on staggered timers &mdash; each petal easing out in turn, stems swaying gently in the breeze.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" type="button" id="tz-seed">New seed</button>
<button class="tz-btn" type="button" id="tz-pause">Pause</button>
<button class="tz-btn" type="button" id="tz-clear">Clear</button>
</div>
<canvas class="tz-canvas" id="tz-cv"></canvas>
<p class="tz-foot">Procedural blooms: per-petal ease-out-back timing, quadratic stems, sinusoidal sway. Seeded with mulberry32.</p>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var seedB=document.getElementById('tz-seed'),pauseB=document.getElementById('tz-pause'),clearB=document.getElementById('tz-clear');
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var DPR=Math.min(window.devicePixelRatio||1,2),W=0,H=0;
var flowers=[],t=0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mulberry32((Math.random()*4294967296)|0);
function init(){
  flowers=[];t=0;
  var spots=[[0.16,0.72],[0.34,0.55],[0.5,0.78],[0.66,0.52],[0.84,0.74],[0.25,0.32],[0.58,0.30],[0.78,0.34],[0.42,0.44]];
  for(var i=0;i<spots.length;i++){
    var jx=(rng()-0.5)*0.08,jy=(rng()-0.5)*0.08;
    flowers.push({
      x:(spots[i][0]+jx)*W,y:(spots[i][1]+jy)*H,
      petals:6+((rng()*5)|0),start:i*0.7+rng()*0.4,
      size:22+rng()*16,rot:rng()*6.283,
      petal:rng()<0.5?'#8a9a6b':'#a3b184',
      sway:0.5+rng()
    });
  }
  flowers.sort(function(a,b){return a.y-b.y;});
}
function easeBack(k){var c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);}
function clamp01(k){return k<0?0:k>1?1:k;}
function drawFlower(f){
  var bt=clamp01((t-f.start)/3.2);
  if(bt<=0)return;
  var sway=Math.sin(t*1.2*f.sway+f.x*0.01)*0.035;
  var bx=f.x,by=f.y;
  ctx.strokeStyle='#5c7050';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(bx,H+6);
  ctx.quadraticCurveTo(bx+sway*300,by+(H-by)*0.5,bx+sway*120,by);
  ctx.stroke();
  ctx.fillStyle='#5c7050';
  var lx=bx+sway*180,ly=by+(H-by)*0.42;
  ctx.beginPath();ctx.ellipse(lx-10,ly,12,5,0.5+sway,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.ellipse(lx+10,ly+6,12,5,-0.5+sway,0,6.2832);ctx.fill();
  for(var i=0;i<f.petals;i++){
    var pk=easeBack(clamp01((bt-i/f.petals)*f.petals*0.9));
    if(pk<=0)continue;
    var ang=f.rot+i*(6.2832/f.petals)+sway;
    var len=f.size*pk,wd=f.size*0.42*pk;
    var px=bx+Math.cos(ang)*len*0.55,py=by+Math.sin(ang)*len*0.55;
    ctx.fillStyle=f.petal;
    ctx.beginPath();ctx.ellipse(px,py,wd,len*0.55,ang-Math.PI/2,0,6.2832);ctx.fill();
  }
  ctx.fillStyle='#c17c2e';
  ctx.beginPath();ctx.arc(bx,by,Math.max(0.1,f.size*0.22*easeBack(clamp01(bt*3))),0,6.2832);ctx.fill();
}
function draw(){
  ctx.fillStyle='#f4f1e6';ctx.fillRect(0,0,W,H);
  for(var i=0;i<flowers.length;i++)drawFlower(flowers[i]);
}
var raf=0,paused=false;
function loop(){if(paused)return;t+=1/60;draw();raf=requestAnimationFrame(loop);}
function resize(){
  var r=cv.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  init();
  if(reduced){t=12;draw();}else{cancelAnimationFrame(raf);paused=false;pauseB.textContent='Pause';loop();}
}
seedB.addEventListener('click',function(){rng=mulberry32((Math.random()*4294967296)|0);cancelAnimationFrame(raf);paused=false;pauseB.textContent='Pause';init();if(reduced){t=12;draw();}else loop();});
pauseB.addEventListener('click',function(){if(reduced)return;paused=!paused;pauseB.textContent=paused?'Resume':'Pause';if(!paused)loop();});
clearB.addEventListener('click',function(){cancelAnimationFrame(raf);paused=true;pauseB.textContent='Resume';ctx.fillStyle='#f4f1e6';ctx.fillRect(0,0,W,H);});
window.addEventListener('resize',function(){cancelAnimationFrame(raf);resize();});
resize();
})();
</script>
</body>
</html>
