<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lava Lamp Blobs — TZ-taste Generative</title>
<style>
*{box-sizing:border-box}
.tz-gen-body{margin:0;background:#2b1a0e;color:#f3e6d0;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.tz-gen-wrap{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
.tz-gen-head{margin:0 0 28px}
.tz-gen-kicker{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#e07b39;margin:0 0 14px}
.tz-gen-head h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 12px;font-weight:600}
.tz-gen-caption{font-size:16px;line-height:1.6;color:#a98d68;margin:0;max-width:62ch}
.tz-gen-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 14px}
.tz-gen-btn{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:#f3e6d0;border:1px solid #5a3a22;padding:10px 18px;border-radius:3px;cursor:pointer}
.tz-gen-btn:hover{border-color:#e07b39;color:#e07b39}
.tz-gen-seed{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;color:#a98d68;margin-left:auto}
.tz-gen-canvas{display:block;width:100%;height:70vh;border:1px solid #4a2f1c;border-radius:3px;background:#2b1a0e}
.tz-gen-note{font-size:14px;line-height:1.65;color:#a98d68;margin:18px 0 0;max-width:70ch}
@media(max-width:520px){.tz-gen-wrap{padding:32px 16px 48px}.tz-gen-seed{margin-left:0;width:100%}}
</style>
</head>
<body class="tz-gen-body">
<div class="tz-gen-wrap">
  <header class="tz-gen-head">
    <p class="tz-gen-kicker">TZ-taste · Generative</p>
    <h1>Lava Lamp Blobs</h1>
    <p class="tz-gen-caption">Wax blobs warm at the base, rise, cool near the cap, and sink back down. Hypnotic because the cycle never quite repeats.</p>
  </header>
  <div class="tz-gen-bar">
    <button class="tz-gen-btn" id="tzSeed">New seed</button>
    <button class="tz-gen-btn" id="tzPause">Pause</button>
    <button class="tz-gen-btn" id="tzClear">Clear</button>
    <span class="tz-gen-seed" id="tzSeedLabel">Seed 0</span>
  </div>
  <canvas class="tz-gen-canvas" id="tzCv" aria-label="Glowing wax blobs rising inside a lava lamp"></canvas>
  <p class="tz-gen-note">New seeds change how many blobs the lamp holds and how lazily each one climbs.</p>
</div>
<script>
'use strict';
const cv=document.getElementById('tzCv'),ctx=cv.getContext('2d');
const seedLabel=document.getElementById('tzSeedLabel');
let W=0,H=0,seed=(Math.random()*1e9)|0,rand=null,blobs=[],t=0,running=true;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG='#2b1a0e';
const sprite=document.createElement('canvas');sprite.width=sprite.height=128;
(function(){const g=sprite.getContext('2d');
const gr=g.createRadialGradient(64,64,4,64,64,62);
gr.addColorStop(0,'#ffe9c4');gr.addColorStop(0.35,'#f2a15c');
gr.addColorStop(0.7,'rgba(224,123,57,0.55)');gr.addColorStop(1,'rgba(224,123,57,0)');
g.fillStyle=gr;g.fillRect(0,0,128,128);})();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function newBlob(anyY){
  return {x:W/2+(rand()-0.5)*120,
    y:anyY?90+rand()*(H-260):H-160,
    r:14+rand()*22,sp:0.25+rand()*0.5,ph:rand()*6.28,hot:0.4+rand()*0.6};
}
function init(){
  rand=mulberry32(seed);blobs=[];t=0;
  const n=10+Math.floor(rand()*6);
  for(let i=0;i<n;i++)blobs.push(newBlob(true));
  seedLabel.textContent='Seed '+seed;
}
function step(){
  t+=0.016;
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  const cx=W/2,top=70,bot=H-130,hw=95;
  ctx.fillStyle='#1c1109';rr(cx-hw-14,top-24,hw*2+28,bot-top+120,40);ctx.fill();
  ctx.fillStyle='#3a2513';rr(cx-hw,top,hw*2,bot-top,34);ctx.fill();
  ctx.save();rr(cx-hw,top,hw*2,bot-top,34);ctx.clip();
  for(let i=0;i<blobs.length;i++){
    const b=blobs[i];
    b.ph+=0.02;
    b.y-=b.sp*(0.6+0.4*Math.sin(b.ph))*b.hot;
    b.x+=Math.sin(b.ph*1.3)*0.6;
    if(b.y<top+12){blobs[i]=newBlob(false);continue;}
    const edge=Math.min(1,Math.max(0,(b.y-top)/60));
    const rad=b.r*(0.75+0.25*Math.sin(b.ph*2.1))*(0.35+0.65*edge);
    ctx.globalAlpha=0.95;
    ctx.drawImage(sprite,b.x-rad*2,b.y-rad*2,rad*4,rad*4);
  }
  ctx.restore();
  ctx.fillStyle='rgba(255,240,220,0.08)';rr(cx-hw+16,top+18,26,bot-top-36,13);ctx.fill();
  ctx.fillStyle='#120c06';
  ctx.fillRect(cx-hw-10,bot+56,hw*2+20,40);
  ctx.fillRect(cx-34,top-58,68,34);
  ctx.globalAlpha=1;
}
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=Math.max(2,Math.round(r.width));H=Math.max(2,Math.round(r.height));
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);init();
}
window.addEventListener('resize',resize);
document.getElementById('tzSeed').addEventListener('click',()=>{seed=(Math.random()*1e9)|0;init();if(!running)toggle();});
document.getElementById('tzClear').addEventListener('click',init);
function toggle(){running=!running;document.getElementById('tzPause').textContent=running?'Pause':'Resume';if(running&&!reduced)tick();}
document.getElementById('tzPause').addEventListener('click',toggle);
function tick(){if(!running)return;step();requestAnimationFrame(tick);}
resize();
if(reduced){for(let i=0;i<400;i++)step();}
else tick();
</script>
</body>
</html>
