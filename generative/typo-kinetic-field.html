<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic Type Field — TZ-taste Generative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04140b;color:#d8ffe3;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tz-head{text-align:center;padding:1.6rem 1.2rem .8rem;max-width:680px}
.tz-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:.6rem}
.tz-title{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;margin-bottom:.5rem}
.tz-caption{font-style:italic;font-size:.98rem;line-height:1.5;opacity:.72}
.tz-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem 1rem}
.tz-btn{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #33ff66;background:transparent;color:#33ff66;cursor:pointer}
.tz-btn:hover{background:#33ff66;color:#04140b}
.tz-wrap{width:100%;max-width:980px;padding:0 1rem 2.5rem}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border:1px solid rgba(51,255,102,.25);border-radius:14px;touch-action:none;background:#04140b}
</style>
</head>
<body>
<header class="tz-head">
<p class="tz-kicker">TZ-taste · Generative</p>
<h1 class="tz-title">Kinetic Type Field</h1>
<p class="tz-caption">Words drift and spin through a swirling force field. Move your cursor through them to push the words away.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" id="tz-b-seed" type="button">New seed</button>
<button class="tz-btn" id="tz-b-pause" type="button">Pause</button>
<button class="tz-btn" id="tz-b-clear" type="button">Clear</button>
</div>
<div class="tz-wrap"><canvas class="tz-canvas" id="tz-cv"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,seed=20261003,words=[],vorts=[],mouse={x:-9999,y:-9999},running=true,raf=0;
var WORDS=["SIGNAL","STATIC","VECTOR","MODEM","KERNEL","GLOW","SCAN","BITMAP","PHOSPHOR","BBS","DIAL-UP","GLYPH"];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function init(s){
  seed=s;var rnd=mulberry32(s),i;
  words=[];vorts=[];
  for(i=0;i<WORDS.length;i++){words.push({t:WORDS[i],x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*1.4,vy:(rnd()-.5)*1.4,r:rnd()*6.283,vr:(rnd()-.5)*.03,fs:15+rnd()*26});}
  for(i=0;i<3;i++){vorts.push({x:rnd()*W,y:rnd()*H,s:(rnd()-.5)*3,rad:140+rnd()*180});}
  ctx.fillStyle='#04140b';ctx.fillRect(0,0,W,H);
}
function drawWord(w){
  ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.r);
  ctx.font='700 '+w.fs+'px "Courier New",monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#33ff66';ctx.shadowBlur=12;
  ctx.fillStyle='rgba(51,255,102,0.92)';ctx.fillText(w.t,0,0);ctx.restore();
}
function step(){
  ctx.fillStyle='rgba(4,20,11,0.14)';ctx.fillRect(0,0,W,H);
  var i,j,w,v,dx,dy,d,f,tx,ty;
  for(i=0;i<words.length;i++){w=words[i];
    for(j=0;j<vorts.length;j++){v=vorts[j];dx=w.x-v.x;dy=w.y-v.y;d=Math.hypot(dx,dy)+1;
      if(d<v.rad){f=(1-d/v.rad)*v.s;tx=-dy/d;ty=dx/d;w.vx+=tx*f*.06;w.vy+=ty*f*.06;}}
    dx=w.x-mouse.x;dy=w.y-mouse.y;d=Math.hypot(dx,dy);
    if(d<140){f=(1-d/140)*6;w.vx+=dx/(d+1)*f*.1;w.vy+=dy/(d+1)*f*.1;}
    w.vx*=.985;w.vy*=.985;w.x+=w.vx;w.y+=w.vy;w.r+=w.vr;
    if(w.x<-60)w.x=W+60;if(w.x>W+60)w.x=-60;if(w.y<-60)w.y=H+60;if(w.y>H+60)w.y=-60;
    drawWord(w);
  }
}
function drawStatic(){
  ctx.fillStyle='#04140b';ctx.fillRect(0,0,W,H);
  for(var i=0;i<words.length;i++)drawWord(words[i]);
}
function loop(){step();if(running&&!REDUCED)raf=requestAnimationFrame(loop);}
function resize(){
  var DPR=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  init(seed);
  if(REDUCED){drawStatic();}else if(running){cancelAnimationFrame(raf);loop();}
}
cv.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
cv.addEventListener('pointerleave',function(){mouse.x=-9999;mouse.y=-9999;});
document.getElementById('tz-b-seed').addEventListener('click',function(){init((Math.random()*0x7fffffff)|0);if(REDUCED)drawStatic();});
document.getElementById('tz-b-pause').addEventListener('click',function(){
  running=!running;this.textContent=running?'Pause':'Resume';
  if(running&&!REDUCED)loop();else cancelAnimationFrame(raf);
});
document.getElementById('tz-b-clear').addEventListener('click',function(){init(seed);if(REDUCED)drawStatic();});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
