<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elastic Collision Box — TZ-taste Generative</title>
<style>
*{box-sizing:border-box}
.tz-gen-body{margin:0;background:#fff6e8;color:#171412;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.tz-gen-wrap{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
.tz-gen-head{margin:0 0 28px}
.tz-gen-kicker{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#e83a2f;margin:0 0 14px}
.tz-gen-head h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 12px;font-weight:800;letter-spacing:-0.02em}
.tz-gen-caption{font-size:16px;line-height:1.6;color:#8f8577;margin:0;max-width:62ch}
.tz-gen-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 14px}
.tz-gen-btn{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:#171412;border:2px solid #171412;padding:9px 18px;border-radius:0;cursor:pointer}
.tz-gen-btn:hover{border-color:#e83a2f;color:#e83a2f}
.tz-gen-seed{font-family:'SF Mono',Consolas,Menlo,monospace;font-size:12px;color:#8f8577;margin-left:auto}
.tz-gen-canvas{display:block;width:100%;height:70vh;border:2px solid #171412;border-radius:0;background:#fff6e8}
.tz-gen-note{font-size:14px;line-height:1.65;color:#8f8577;margin:18px 0 0;max-width:70ch}
@media(max-width:520px){.tz-gen-wrap{padding:32px 16px 48px}.tz-gen-seed{margin-left:0;width:100%}}
</style>
</head>
<body class="tz-gen-body">
<div class="tz-gen-wrap">
  <header class="tz-gen-head">
    <p class="tz-gen-kicker">TZ-taste · Generative</p>
    <h1>Elastic Collision Box</h1>
    <p class="tz-gen-caption">A box of disks with real elastic collisions: equal masses, conserved momentum, wall bounces with zero energy loss. Chaos, but honest chaos.</p>
  </header>
  <div class="tz-gen-bar">
    <button class="tz-gen-btn" id="tzSeed">New seed</button>
    <button class="tz-gen-btn" id="tzPause">Pause</button>
    <button class="tz-gen-btn" id="tzClear">Clear</button>
    <span class="tz-gen-seed" id="tzSeedLabel">Seed 0</span>
  </div>
  <canvas class="tz-gen-canvas" id="tzCv" aria-label="Colored disks colliding elastically inside a box"></canvas>
  <p class="tz-gen-note">Each seed re-deals disk sizes, speeds, and colors. The physics stays exact no matter what.</p>
</div>
<script>
'use strict';
const cv=document.getElementById('tzCv'),ctx=cv.getContext('2d');
const seedLabel=document.getElementById('tzSeedLabel');
let W=0,H=0,seed=(Math.random()*1e9)|0,rand=null,disks=[],t=0,running=true;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BG='#fff6e8',INK='#171412';
const PAL=['#e83a2f','#ffd23f','#2ec4b6','#171412'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function init(){
  rand=mulberry32(seed);disks=[];t=0;
  const n=22;
  for(let i=0;i<n;i++){
    const r=12+rand()*18;
    const a=rand()*Math.PI*2,sp=1.5+rand()*1.6;
    disks.push({x:r+rand()*(W-2*r),y:r+rand()*(H-2*r),r:r,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      c:PAL[Math.floor(rand()*PAL.length)]});
  }
  seedLabel.textContent='Seed '+seed;
}
function step(){
  t+=0.016;
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  for(const d of disks){
    d.x+=d.vx;d.y+=d.vy;
    if(d.x<d.r){d.x=d.r;d.vx=Math.abs(d.vx);}
    if(d.x>W-d.r){d.x=W-d.r;d.vx=-Math.abs(d.vx);}
    if(d.y<d.r){d.y=d.r;d.vy=Math.abs(d.vy);}
    if(d.y>H-d.r){d.y=H-d.r;d.vy=-Math.abs(d.vy);}
  }
  for(let i=0;i<disks.length;i++)for(let j=i+1;j<disks.length;j++){
    const a=disks[i],b=disks[j];
    const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;
    if(dist>0&&dist<min){
      const nx=dx/dist,ny=dy/dist,ov=(min-dist)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
      if(vn<0){
        const imp=-vn;
        a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny;
      }
    }
  }
  for(const d of disks){
    ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill();
    ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath();ctx.arc(d.x-d.r*0.32,d.y-d.r*0.32,d.r*0.16,0,7);ctx.fill();
  }
}
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=Math.max(2,Math.round(r.width));H=Math.max(2,Math.round(r.height));
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);init();
}
window.addEventListener('resize',resize);
document.getElementById('tzSeed').addEventListener('click',()=>{seed=(Math.random()*1e9)|0;init();if(!running)toggle();});
document.getElementById('tzClear').addEventListener('click',init);
function toggle(){running=!running;document.getElementById('tzPause').textContent=running?'Pause':'Resume';if(running&&!reduced)tick();}
document.getElementById('tzPause').addEventListener('click',toggle);
function tick(){if(!running)return;step();requestAnimationFrame(tick);}
resize();
if(reduced){for(let i=0;i<240;i++)step();}
else tick();
</script>
</body>
</html>
