<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Ribbons (2D) — TZ-taste</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07100e;color:#dfeee7;font-family:"Avenir Next","Segoe UI",Verdana,sans-serif;-webkit-font-smoothing:antialiased}
.tz-wrap{max-width:760px;margin:0 auto;padding:20px 16px 32px}
.tz-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.65;margin:0 0 8px}
.tz-title{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:30px;margin:0 0 8px;letter-spacing:.01em}
.tz-caption{font-size:14px;line-height:1.55;opacity:.78;margin:0 0 16px;max-width:58ch}
.tz-controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tz-btn{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;opacity:.9}
.tz-btn:hover{opacity:1;background:rgba(223,238,231,.08)}
.tz-btn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border-radius:14px;border:1px solid rgba(223,238,231,.18);background:#07100e}
.tz-foot{font-size:12px;opacity:.55;margin:12px 0 0;line-height:1.5}
</style>
</head>
<body>
<div class="tz-wrap">
<header>
<p class="tz-kicker">TZ-taste &middot; Generative</p>
<h1 class="tz-title">Aurora Ribbons (2D)</h1>
<p class="tz-caption">Three ribbons of layered sine waves, drawn with additive glow over a seeded star field &mdash; a night sky reduced to pure waveform.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" type="button" id="tz-seed">New seed</button>
<button class="tz-btn" type="button" id="tz-pause">Pause</button>
<button class="tz-btn" type="button" id="tz-clear">Clear</button>
</div>
<canvas class="tz-canvas" id="tz-cv"></canvas>
<p class="tz-foot">Each ribbon is y = base + a1&middot;sin(f1x+p1) + a2&middot;sin(f2x+p2), stroked twice: soft wash, bright core. Seeded with mulberry32.</p>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var seedB=document.getElementById('tz-seed'),pauseB=document.getElementById('tz-pause'),clearB=document.getElementById('tz-clear');
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var DPR=Math.min(window.devicePixelRatio||1,2),W=0,H=0;
var stars=[],ribbons=[],t=0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mulberry32((Math.random()*4294967296)|0);
function init(){
  t=0;stars=[];ribbons=[];
  for(var i=0;i<130;i++)stars.push({x:rng()*W,y:rng()*H*0.8,r:0.4+rng()*1.2,tw:rng()*6.283});
  var cols=['67,232,162','159,240,208','255,209,102'];
  var bases=[0.22,0.38,0.55];
  for(var k=0;k<3;k++){
    ribbons.push({
      base:bases[k],a1:26+rng()*30,a2:10+rng()*16,
      f1:0.006+rng()*0.006,f2:0.014+rng()*0.012,
      p1:rng()*6.283,p2:rng()*6.283,
      sp:0.25+rng()*0.4,col:cols[k],
      band:46+rng()*30
    });
  }
}
function ribbonY(r,x){
  return r.base*H+Math.sin(x*r.f1+r.p1+t*r.sp)*r.a1+Math.sin(x*r.f2+r.p2-t*r.sp*1.7)*r.a2;
}
function drawRibbon(r){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=r.band;ctx.lineCap='round';
  ctx.strokeStyle='rgba('+r.col+',0.05)';
  ctx.beginPath();
  for(var x=0;x<=W;x+=8){
    var y=ribbonY(r,x)+r.band*0.35;
    if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.lineWidth=7;
  ctx.strokeStyle='rgba('+r.col+',0.10)';
  ctx.beginPath();
  for(var x2=0;x2<=W;x2+=8){
    var y2=ribbonY(r,x2)+r.band*0.15;
    if(x2===0)ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2);
  }
  ctx.stroke();
  ctx.shadowBlur=16;ctx.shadowColor='rgba('+r.col+',.9)';
  ctx.lineWidth=2.2;
  ctx.strokeStyle='rgba('+r.col+',0.55)';
  ctx.beginPath();
  for(var x3=0;x3<=W;x3+=6){
    var y3=ribbonY(r,x3);
    if(x3===0)ctx.moveTo(x3,y3);else ctx.lineTo(x3,y3);
  }
  ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#050b0a';ctx.fillRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){
    var s=stars[i],a=0.35+0.4*Math.abs(Math.sin(t*0.8+s.tw));
    ctx.fillStyle='rgba(223,238,231,'+a.toFixed(2)+')';
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  for(var k=0;k<ribbons.length;k++)drawRibbon(ribbons[k]);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#030806';
  ctx.beginPath();ctx.moveTo(0,H);
  for(var mx=0;mx<=W;mx+=24){
    ctx.lineTo(mx,H-26-22*Math.abs(Math.sin(mx*0.008+2))-8*Math.sin(mx*0.03));
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function step(dt){t+=dt;}
var raf=0,paused=false,last=0;
function loop(ts){if(paused)return;var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;step(dt);draw();raf=requestAnimationFrame(loop);}
function resize(){
  var r=cv.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  init();
  if(reduced){t=3;draw();}else{cancelAnimationFrame(raf);paused=false;pauseB.textContent='Pause';last=performance.now();loop(last);}
}
seedB.addEventListener('click',function(){rng=mulberry32((Math.random()*4294967296)|0);cancelAnimationFrame(raf);paused=false;pauseB.textContent='Pause';init();if(reduced){t=3;draw();}else{last=performance.now();loop(last);}});
pauseB.addEventListener('click',function(){if(reduced)return;paused=!paused;pauseB.textContent=paused?'Resume':'Pause';if(!paused){last=performance.now();loop(last);}});
clearB.addEventListener('click',function(){cancelAnimationFrame(raf);paused=true;pauseB.textContent='Resume';ctx.globalCompositeOperation='source-over';ctx.fillStyle='#050b0a';ctx.fillRect(0,0,W,H);});
window.addEventListener('resize',function(){cancelAnimationFrame(raf);resize();});
resize();
})();
</script>
</body>
</html>
