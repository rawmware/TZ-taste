<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel-Sorted Gradients — TZ-taste Generative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0906;color:#f5e6c8;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tz-head{text-align:center;padding:1.6rem 1.2rem .8rem;max-width:680px}
.tz-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:.6rem}
.tz-title{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:700;margin-bottom:.5rem}
.tz-caption{font-style:italic;font-size:.98rem;line-height:1.5;opacity:.72}
.tz-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem 1rem}
.tz-btn{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:999px;border:1px solid #ffb000;background:transparent;color:#ffb000;cursor:pointer}
.tz-btn:hover{background:#ffb000;color:#0b0906}
.tz-wrap{width:100%;max-width:980px;padding:0 1rem 2.5rem}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border:1px solid rgba(255,176,0,.25);border-radius:14px;background:#0b0906}
</style>
</head>
<body>
<header class="tz-head">
<p class="tz-kicker">TZ-taste · Generative</p>
<h1 class="tz-title">Pixel-Sorted Gradients</h1>
<p class="tz-caption">Amber bands are painted in code, then pixel-sorted row by row into glitchy streaks. Pure canvas, no image files.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" id="tz-b-seed" type="button">New seed</button>
<button class="tz-btn" id="tz-b-pause" type="button">Pause</button>
<button class="tz-btn" id="tz-b-clear" type="button">Clear</button>
</div>
<div class="tz-wrap"><canvas class="tz-canvas" id="tz-cv"></canvas></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,seed=424242,running=true,timer=0;
var LW=180,LH=110,BANDS=['#ffb000','#ff8c1a','#ffd166','#e36414','#7a4a12','#c97b1e'];
var off=document.createElement('canvas');off.width=LW;off.height=LH;
var ox=off.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sortRows(rnd,y0,y1){
  var img=ox.getImageData(0,y0,LW,y1-y0),d=img.data,h=y1-y0,yy,x,st,en,xx,px,p,i2;
  for(yy=0;yy<h;yy++){
    x=0;
    while(x<LW){
      if(rnd()<0.78){
        st=x;en=Math.min(LW,x+8+((rnd()*56)|0));
        px=[];
        for(xx=st;xx<en;xx++){i2=(yy*LW+xx)*4;px.push([d[i2]+d[i2+1]+d[i2+2],d[i2],d[i2+1],d[i2+2],d[i2+3]]);}
        if(rnd()<0.5)px.sort(function(a,b){return a[0]-b[0];});else px.sort(function(a,b){return b[0]-a[0];});
        for(xx=st;xx<en;xx++){p=px[xx-st];i2=(yy*LW+xx)*4;d[i2]=p[1];d[i2+1]=p[2];d[i2+2]=p[3];d[i2+3]=p[4];}
        x=en;
      }else{x+=4+((rnd()*20)|0);}
    }
  }
  ox.putImageData(img,0,y0);
}
function paint(s){
  seed=s;var rnd=mulberry32(s),y=0,h;
  ox.fillStyle='#0b0906';ox.fillRect(0,0,LW,LH);
  while(y<LH){h=4+((rnd()*22)|0);ox.fillStyle=BANDS[(rnd()*BANDS.length)|0];ox.fillRect(0,y,LW,h);y+=h;}
  sortRows(rnd,0,LH);
  render();
}
function render(){
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(off,0,0,W,H);
  ctx.fillStyle='rgba(11,9,6,0.6)';ctx.fillRect(0,H*0.36,W,H*0.28);
  ctx.font='700 '+Math.min(W*0.15,120)+'px Georgia,serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ffb000';ctx.fillText('SORTED',W/2,H/2+4);
  ctx.font='12px "Courier New",monospace';ctx.fillStyle='rgba(255,176,0,.7)';
  ctx.fillText('seed '+seed,W/2,H/2+Math.min(W*0.15,120)*0.62);
}
function glitch(){
  var rnd=mulberry32((Math.random()*0x7fffffff)|0);
  var y0=(rnd()*(LH-14))|0;
  sortRows(rnd,y0,y0+8+((rnd()*14)|0));
  render();
}
function startTimer(){stopTimer();if(!REDUCED&&running)timer=setInterval(glitch,1400);}
function stopTimer(){if(timer){clearInterval(timer);timer=0;}}
function resize(){
  var DPR=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  paint(seed);startTimer();
}
document.getElementById('tz-b-seed').addEventListener('click',function(){paint((Math.random()*0x7fffffff)|0);startTimer();});
document.getElementById('tz-b-pause').addEventListener('click',function(){
  running=!running;this.textContent=running?'Pause':'Resume';
  if(running)startTimer();else stopTimer();
});
document.getElementById('tz-b-clear').addEventListener('click',function(){
  stopTimer();ox.fillStyle='#0b0906';ox.fillRect(0,0,LW,LH);render();
});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
