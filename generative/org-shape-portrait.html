<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dithered Shape Portrait — TZ-taste</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#ece0c9;color:#3a2f24;font-family:"Avenir Next","Segoe UI",Verdana,sans-serif;-webkit-font-smoothing:antialiased}
.tz-wrap{max-width:760px;margin:0 auto;padding:20px 16px 32px}
.tz-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;margin:0 0 8px}
.tz-title{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:30px;margin:0 0 8px;letter-spacing:.01em}
.tz-caption{font-size:14px;line-height:1.55;opacity:.78;margin:0 0 16px;max-width:58ch}
.tz-controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tz-btn{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;opacity:.9}
.tz-btn:hover{opacity:1;background:rgba(58,47,36,.08)}
.tz-btn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.tz-canvas{display:block;width:100%;height:70vh;min-height:340px;border-radius:14px;border:1px solid rgba(58,47,36,.25);background:#ece0c9}
.tz-foot{font-size:12px;opacity:.55;margin:12px 0 0;line-height:1.5}
</style>
</head>
<body>
<div class="tz-wrap">
<header>
<p class="tz-kicker">TZ-taste &middot; Generative</p>
<h1 class="tz-title">Dithered Shape Portrait</h1>
<p class="tz-caption">A face built from 2,400 stippled ink dots &mdash; eyes, nose, lips placed by a density function in pure code. No image file involved.</p>
</header>
<div class="tz-controls">
<button class="tz-btn" type="button" id="tz-seed">New seed</button>
<button class="tz-btn" type="button" id="tz-pause">Pause</button>
<button class="tz-btn" type="button" id="tz-clear">Clear</button>
</div>
<canvas class="tz-canvas" id="tz-cv"></canvas>
<p class="tz-foot">Rejection-sampled stippling: each dot survives only where the face density says it should. Seeded with mulberry32.</p>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tz-cv'),ctx=cv.getContext('2d');
var seedB=document.getElementById('tz-seed'),pauseB=document.getElementById('tz-pause'),clearB=document.getElementById('tz-clear');
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var DPR=Math.min(window.devicePixelRatio||1,2),W=0,H=0;
var dots=[],t=0,N=2400;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mulberry32((Math.random()*4294967296)|0);
function gauss(a,b){return Math.exp(-(a*a+b*b));}
function density(nx,ny){
  var dx=(nx-0.5)/0.30,dy=(ny-0.52)/0.36;
  if(dx*dx+dy*dy>1)return 0;
  var d=0.40;
  d+=gauss((nx-0.395)/0.042,(ny-0.465)/0.030)*0.60;
  d+=gauss((nx-0.605)/0.042,(ny-0.465)/0.030)*0.60;
  d+=gauss((nx-0.395)/0.060,(ny-0.400)/0.016)*0.28;
  d+=gauss((nx-0.605)/0.060,(ny-0.400)/0.016)*0.28;
  d+=gauss((nx-0.500)/0.028,(ny-0.560)/0.100)*0.34;
  d+=gauss((nx-0.500)/0.085,(ny-0.690)/0.026)*0.52;
  d+=gauss((nx-0.500)/0.200,(ny-0.560)/0.240)*0.10;
  if(ny<0.33)d+=0.14;
  return Math.min(1,d);
}
function init(){
  dots=[];t=0;
  var guard=0;
  while(dots.length<N&&guard<N*40){
    guard++;
    var nx=rng(),ny=rng(),den=density(nx,ny);
    if(rng()<den){
      dots.push({
        tx:nx*W,ty:ny*H,
        sx:rng()*W,sy:rng()*H,
        r:0.5+den*1.9,
        delay:rng()*1.4,dur:1.2+rng()*1.2
      });
    }
  }
}
function ease(k){return k<0?0:k>1?1:1-Math.pow(1-k,3);}
function draw(){
  ctx.fillStyle='#ece0c9';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2e2620';
  for(var i=0;i<dots.length;i++){
    var d=dots[i];
    var k=ease((t-d.delay)/d.dur);
    var x=d.sx+(d.tx-d.sx)*k,y=d.sy+(d.ty-d.sy)*k;
    ctx.beginPath();ctx.arc(x,y,d.r,0,6.2832);ctx.fill();
  }
}
var raf=0,paused=false;
function loop(){if(paused)return;t+=1/60;draw();if(t<3.4)raf=requestAnimationFrame(loop);}
function resize(){
  var r=cv.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  init();
  if(reduced){t=10;draw();}else{cancelAnimationFrame(raf);paused=false;pauseB.textContent='Pause';loop();}
}
seedB.addEventListener('click',function(){rng=mulberry32((Math.random()*4294967296)|0);cancelAnimationFrame(raf);paused=false;pauseB.textContent='Pause';init();if(reduced){t=10;draw();}else loop();});
pauseB.addEventListener('click',function(){if(reduced)return;paused=!paused;pauseB.textContent=paused?'Resume':'Pause';if(!paused)loop();});
clearB.addEventListener('click',function(){cancelAnimationFrame(raf);paused=true;pauseB.textContent='Resume';ctx.fillStyle='#ece0c9';ctx.fillRect(0,0,W,H);});
window.addEventListener('resize',function(){cancelAnimationFrame(raf);resize();});
resize();
})();
</script>
</body>
</html>
