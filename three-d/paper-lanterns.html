<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lantern Festival · TZ-taste</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#070b18}
#app{position:fixed;inset:0}
.cap{position:fixed;left:18px;bottom:16px;color:#f3ead9;font:12px/1.6 ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;pointer-events:none;user-select:none;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.cap b{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.cap span{opacity:.6}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f3ead9;font:14px system-ui;background:#070b18;text-align:center;padding:2rem}
</style>
</head>
<body>
<div id="app"></div>
<div class="cap"><b>Lantern Festival</b><br><span>drag to orbit · scroll to zoom</span></div>
<div id="nogl" hidden><p>This scene needs WebGL.<br>Please try a browser with WebGL enabled.</p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true});
  if(!renderer.getContext()) throw new Error('no ctx');
}catch(err){
  document.getElementById('nogl').hidden = false;
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b18);
scene.fog = new THREE.FogExp2(0x070b18, 0.011);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 9, 32);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 11, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.maxPolarAngle = Math.PI * 0.55;

function radialTex(stops, size){
  size = size || 128;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const s of stops) gr.addColorStop(s[0], s[1]);
  g.fillStyle = gr; g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const softTex = radialTex([[0,'rgba(255,255,255,1)'],[0.4,'rgba(255,255,255,.5)'],[1,'rgba(255,255,255,0)']]);

const starGeo = new THREE.BufferGeometry();
{
  const n = 500, pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, e = Math.random()*Math.PI*0.48 + 0.03, r = 160 + Math.random()*80;
    pos[i*3]   = Math.cos(a)*Math.cos(e)*r;
    pos[i*3+1] = Math.sin(e)*r;
    pos[i*3+2] = Math.sin(a)*Math.cos(e)*r;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
}
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xcdd8ff, size:1.5, sizeAttenuation:false, transparent:true, opacity:0.85, depthWrite:false})));

const moon = new THREE.Sprite(new THREE.SpriteMaterial({map:softTex, color:0xe9edf6, transparent:true, opacity:0.95, depthWrite:false}));
moon.position.set(-46, 52, -110); moon.scale.set(16,16,1); scene.add(moon);
const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({map:softTex, color:0x9fb4dd, transparent:true, opacity:0.28, blending:THREE.AdditiveBlending, depthWrite:false}));
moonHalo.position.copy(moon.position); moonHalo.scale.set(42,42,1); scene.add(moonHalo);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshBasicMaterial({color:0x04060d}));
ground.rotation.x = -Math.PI/2; ground.position.y = -4; scene.add(ground);
const ggTex = radialTex([[0,'rgba(255,150,60,0.5)'],[0.5,'rgba(200,90,30,0.18)'],[1,'rgba(150,60,20,0)']], 256);
const groundGlow = new THREE.Mesh(new THREE.PlaneGeometry(70,70), new THREE.MeshBasicMaterial({map:ggTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
groundGlow.rotation.x = -Math.PI/2; groundGlow.position.y = -3.9; scene.add(groundGlow);

const palette = [0xffd9a0, 0xffc37e, 0xffb27a, 0xffc9a8, 0xffe7c2, 0xff9d7e];
const paperGeo = new THREE.SphereGeometry(0.55, 20, 16);
paperGeo.scale(1, 1.18, 1);
const capGeo = new THREE.CylinderGeometry(0.15, 0.19, 0.12, 10);
const capMat = new THREE.MeshBasicMaterial({color:0x2a1a10});
const lanterns = [];
for(let i=0;i<40;i++){
  const col = new THREE.Color(palette[(Math.random()*palette.length)|0]);
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(paperGeo, new THREE.MeshBasicMaterial({color:col})));
  const capT = new THREE.Mesh(capGeo, capMat); capT.position.y = 0.68; grp.add(capT);
  const capB = new THREE.Mesh(capGeo, capMat); capB.position.y = -0.68; grp.add(capB);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:softTex, color:col, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false}));
  halo.scale.set(3.4,3.4,1); grp.add(halo);
  const bx = (Math.random()*2-1)*24;
  grp.position.set(bx, -3 + Math.random()*34, -18 + Math.random()*26);
  grp.userData = {bx:bx, speed:0.5 + Math.random()*0.9, ph:Math.random()*6.283, sw:0.4 + Math.random()*0.7, rs:(Math.random()-0.5)*0.4};
  scene.add(grp);
  lanterns.push(grp);
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for(const l of lanterns){
    const u = l.userData;
    l.position.y += u.speed * dt;
    l.position.x = u.bx + Math.sin(t*u.sw + u.ph) * 1.4;
    l.rotation.z = Math.sin(t*u.sw + u.ph) * 0.12;
    l.rotation.y += u.rs * dt;
    if(l.position.y > 38){
      l.position.y = -3;
      u.bx = (Math.random()*2-1)*24;
      l.position.z = -18 + Math.random()*26;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
if(reduce){ tick(); } else { renderer.setAnimationLoop(tick); }

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
