<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bonsai Wind — TZ-taste</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#f7f4ec; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }
  .caption { position:fixed; left:18px; bottom:16px; z-index:5; color:#6e675c;
    font:12px/1.6 system-ui, -apple-system, sans-serif; letter-spacing:.05em;
    opacity:.9; pointer-events:none; }
  .caption b { display:block; font-size:13px; letter-spacing:.22em; text-transform:uppercase; }
  #fallback { display:none; position:fixed; inset:0; z-index:10; place-items:center;
    color:#6e675c; font:14px/1.6 system-ui, sans-serif; text-align:center;
    padding:32px; background:#f7f4ec; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption"><b>Bonsai Wind</b>the leaves know before you do<br/>drag to orbit &middot; scroll to zoom</div>
<div id="fallback"><p>This scene needs WebGL, which your browser could not provide.<br/>Try a recent version of Chrome, Safari, Firefox or Edge.</p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf7f4ec);
scene.fog = new THREE.Fog(0xf7f4ec, 30, 80);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(9, 7, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 3.4, 0);
controls.maxPolarAngle = 1.52;
controls.minDistance = 5;
controls.maxDistance = 45;

scene.add(new THREE.HemisphereLight(0xfffaf0, 0xcfc4ae, 1.0));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.1);
sun.position.set(12, 18, 8);
scene.add(sun);

/* ---------- room ---------- */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0xe9e2d2, roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const stand = new THREE.Mesh(new THREE.BoxGeometry(7, 0.5, 7),
  new THREE.MeshStandardMaterial({ color: 0x4a3b2c, roughness: 0.8 }));
stand.position.y = 0.25;
scene.add(stand);

/* ---------- pot, soil, rock ---------- */
const potMat = new THREE.MeshStandardMaterial({ color: 0xa33327, roughness: 0.6 });
const pot = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.0, 1.4, 24), potMat);
pot.position.y = 1.2;
scene.add(pot);
const soil = new THREE.Mesh(new THREE.CylinderGeometry(2.35, 2.35, 0.25, 24),
  new THREE.MeshStandardMaterial({ color: 0x3a2e22, roughness: 1 }));
soil.position.y = 1.95;
scene.add(soil);
const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7, 0),
  new THREE.MeshStandardMaterial({ color: 0x8a8478, roughness: 1, flatShading: true }));
rock.position.set(1.3, 2.3, 0.7);
scene.add(rock);

/* ---------- trunk + branches ---------- */
const barkMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2e, roughness: 1 });
const trunkPts = [
  new THREE.Vector3(0, 2.0, 0), new THREE.Vector3(0.35, 3.1, 0.1),
  new THREE.Vector3(0.15, 4.2, -0.1), new THREE.Vector3(-0.3, 5.2, 0.05)
];
const trunkCurve = new THREE.CatmullRomCurve3(trunkPts);
const trunk = new THREE.Mesh(new THREE.TubeGeometry(trunkCurve, 16, 0.34, 8), barkMat);
scene.add(trunk);
const branchEnds = [
  [new THREE.Vector3(0.35, 3.1, 0.1), new THREE.Vector3(1.9, 3.9, 0.5)],
  [new THREE.Vector3(0.15, 4.2, -0.1), new THREE.Vector3(-1.7, 4.9, -0.4)],
  [new THREE.Vector3(-0.3, 5.2, 0.05), new THREE.Vector3(0.4, 6.3, 0.6)],
  [new THREE.Vector3(-0.3, 5.2, 0.05), new THREE.Vector3(-1.1, 6.1, -0.5)]
];
const canopy = new THREE.Group();
scene.add(canopy);
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f5d3a, roughness: 0.9, flatShading: true });
for (const bp of branchEnds) {
  const curve = new THREE.CatmullRomCurve3([bp[0], bp[0].clone().lerp(bp[1], 0.5).add(new THREE.Vector3(0, 0.3, 0)), bp[1]]);
  canopy.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.12, 6), barkMat));
  const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(0.95, 1), leafMat);
  blob.position.copy(bp[1]);
  blob.scale.set(1.25, 0.8, 1.1);
  canopy.add(blob);
}

/* ---------- fluttering leaves, instanced ---------- */
const leafGeo = new THREE.PlaneGeometry(0.22, 0.3);
const leaves = new THREE.InstancedMesh(leafGeo, new THREE.MeshStandardMaterial({
  color: 0x3e7d4e, roughness: 0.9, side: THREE.DoubleSide }), 130);
const leafData = [];
const dummy = new THREE.Object3D();
for (let i = 0; i < 130; i++) {
  const bp = branchEnds[i % branchEnds.length][1];
  leafData.push({
    base: new THREE.Vector3(bp.x + (Math.random() - 0.5) * 2.2, bp.y + (Math.random() - 0.5) * 1.2, bp.z + (Math.random() - 0.5) * 2.2),
    ph: Math.random() * 6.28, amp: 0.25 + Math.random() * 0.5
  });
}
scene.add(leaves);

/* ---------- frame loop ---------- */
const clock = new THREE.Clock();
function renderFrame(t, dt) {
  const gust = Math.max(0, Math.sin(t * 0.35) * 0.5 + Math.sin(t * 0.13 + 2) * 0.5);
  canopy.rotation.z = Math.sin(t * 1.1) * 0.012 * (1 + gust * 2);
  for (let i = 0; i < leafData.length; i++) {
    const L = leafData[i];
    dummy.position.set(
      L.base.x + Math.sin(t * 2.2 + L.ph) * L.amp * (0.4 + gust),
      L.base.y + Math.sin(t * 3.1 + L.ph * 1.7) * L.amp * 0.5 * (0.4 + gust),
      L.base.z + Math.cos(t * 1.9 + L.ph) * L.amp * (0.4 + gust));
    dummy.rotation.set(t * 1.4 + L.ph, L.ph, Math.sin(t * 2.6 + L.ph) * 0.9);
    dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
  }
  leaves.instanceMatrix.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
}
if (REDUCED) {
  renderFrame(4.0, 0);
} else {
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    renderFrame(clock.elapsedTime, dt);
  });
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
