<!--tz-meta {"id":"crystal-prism","title":"Prism Study","category":"3D","file":"three-d/crystal-prism.html","tags":["threejs","calm"],"description":"A tumbling cluster of glass octahedra with inner-glow cores on a soft gallery-white stage.","dnas":["soft-minimal"]} -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Study — TZ-taste</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f2efe8}
  #c{position:fixed;inset:0;display:block}
  .caption{position:fixed;left:18px;bottom:16px;color:#8a8474;font:12px/1.6 system-ui,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;pointer-events:none;opacity:.9}
  .caption b{display:block;font-size:13px;letter-spacing:.28em;color:#3c382e}
  #fallback{position:fixed;inset:0;display:none;place-items:center;color:#5c574a;
    font:14px system-ui,sans-serif;background:#f2efe8;text-align:center;padding:2rem}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption"><b>Prism Study</b>drag to orbit</div>
<div id="fallback"><p>WebGL is unavailable in this browser, so the prism study cannot render.</p></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2efe8);
scene.fog = new THREE.Fog(0xf2efe8, 22, 48);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.5, 5.5, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.minDistance = 5; controls.maxDistance = 30;

// ---- procedural "studio" environment: vertical gradient equirect texture
function envTexture() {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, '#e8e4d8');
  g.addColorStop(0.62, '#b9b2a0'); g.addColorStop(1, '#6f6a5c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  // one warm window band for believable reflections
  const w = ctx.createLinearGradient(0, 90, 0, 150);
  w.addColorStop(0, 'rgba(255,240,220,0)'); w.addColorStop(0.5, 'rgba(255,240,220,0.9)');
  w.addColorStop(1, 'rgba(255,240,220,0)');
  ctx.fillStyle = w; ctx.fillRect(60, 90, 160, 60);
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.environment = envTexture();

// ---- lights
const key = new THREE.DirectionalLight(0xfff6e8, 2.2);
key.position.set(6, 10, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c2, 0.9));
const rim = new THREE.DirectionalLight(0xcfe4ff, 0.8);
rim.position.set(-8, 4, -6);
scene.add(rim);

// ---- ground: soft gallery disc catching shadows
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.ShadowMaterial({ opacity: 0.16 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const plinth = new THREE.Mesh(
  new THREE.CylinderGeometry(3.4, 3.6, 0.5, 64),
  new THREE.MeshStandardMaterial({ color: 0xe7e2d5, roughness: 0.9 })
);
plinth.position.y = 0.25; plinth.receiveShadow = true; plinth.castShadow = true;
scene.add(plinth);

// ---- prism cluster: octahedra with physical glass + inner glow cores
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.06,
  transmission: 0.92, thickness: 1.6, ior: 1.52,
  clearcoat: 1, clearcoatRoughness: 0.08,
  envMapIntensity: 1.4, transparent: true
});
function glowTex() {
  const s = 128, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, 'rgba(255,250,235,0.95)'); g.addColorStop(0.5, 'rgba(190,225,255,0.28)');
  g.addColorStop(1, 'rgba(190,225,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowMap = glowTex();
const cluster = new THREE.Group();
const prisms = [];
const layout = [
  { p: [0, 2.6, 0], r: 1.35, spin: [0.24, 0.31, 0.18] },
  { p: [-1.7, 1.7, 0.7], r: 0.85, spin: [-0.2, 0.4, 0.28] },
  { p: [1.6, 1.6, -0.6], r: 0.95, spin: [0.35, -0.26, 0.2] },
  { p: [0.3, 3.9, 0.4], r: 0.6, spin: [0.5, 0.44, -0.3] },
  { p: [-0.7, 2.0, -1.5], r: 0.7, spin: [-0.42, 0.22, 0.36] }
];
for (const L of layout) {
  const grp = new THREE.Group();
  const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(L.r, 0), glassMat);
  mesh.castShadow = true;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowMap, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.setScalar(L.r * 1.5);
  grp.add(mesh, glow);
  grp.position.set(...L.p);
  grp.userData.spin = L.spin;
  cluster.add(grp);
  prisms.push(grp);
}
scene.add(cluster);

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  cluster.rotation.y += dt * 0.22;                       // slow tumble of the whole study
  cluster.position.y = Math.sin(t * 0.5) * 0.12;          // gentle float
  for (const g of prisms) {
    const [sx, sy, sz] = g.userData.spin;
    g.rotation.x += dt * sx; g.rotation.y += dt * sy; g.rotation.z += dt * sz;
  }
  controls.update();
  renderer.render(scene, camera);
  if (!reduced) requestAnimationFrame(tick);
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);
resize();
tick();
</script>
</body>
</html>
