<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-Poly Islands — TZ-taste</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 38%, #fdf2f8 62%, #fde68a 100%);
  }
  canvas { display: block; }
  .caption {
    position: fixed; left: 18px; bottom: 16px; color: #57534e; pointer-events: none;
    font: 12px/1.6 system-ui, -apple-system, sans-serif; letter-spacing: .14em;
    text-transform: uppercase; opacity: .9;
  }
  .caption small { display: block; letter-spacing: .05em; text-transform: none; opacity: .6; }
  .fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #57534e; font: 14px system-ui, sans-serif; padding: 2rem; text-align: center;
  }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="caption">Low-Poly Islands<small>drag to orbit &middot; displaced icosahedra, gentle bob</small></div>
<div class="fallback" id="fallback" hidden>WebGL is unavailable in this browser, so this scene cannot render.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const fallback = document.getElementById('fallback');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
  fallback.hidden = false;
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xfbeed3, 34, 95);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 8, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);

// Soft daylight: warm hemisphere + one key directional
scene.add(new THREE.HemisphereLight(0xfff7ed, 0xbae6fd, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(10, 16, 8);
scene.add(sun);

const topColors = [0xa7d7a8, 0xf6d8a8, 0xf5b8c1, 0xa8d8f0, 0xd9c2f0, 0xb8e6d4];
const rockColor = 0x9c8b7a;

function makeIsland(radius, colorHex, seed) {
  const group = new THREE.Group();
  const geo = new THREE.IcosahedronGeometry(radius, 1);
  const p = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = 1 + 0.32 * Math.sin(v.x * 2.4 + seed) * Math.cos(v.z * 2.1 + seed * 1.7)
                + 0.14 * Math.sin(v.y * 4.0 + seed * 2.3);
    v.multiplyScalar(n);
    v.y *= 0.55; // squash into a floating slab
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const top = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: colorHex, roughness: 0.9, metalness: 0, flatShading: true
  }));
  group.add(top);

  // tapered rock underside
  const under = new THREE.Mesh(
    new THREE.ConeGeometry(radius * 0.72, radius * 1.5, 7),
    new THREE.MeshStandardMaterial({ color: rockColor, roughness: 1, flatShading: true })
  );
  under.rotation.x = Math.PI;
  under.position.y = -radius * 0.9;
  group.add(under);

  // a couple of low-poly pines on the larger islands
  if (radius > 2.2) {
    const treeMat = new THREE.MeshStandardMaterial({ color: 0x5f8f6a, roughness: 1, flatShading: true });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a6b4f, roughness: 1, flatShading: true });
    for (let k = 0; k < 2; k++) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.7, 5), trunkMat);
      trunk.position.y = 0.35;
      const crown = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.3, 6), treeMat);
      crown.position.y = 1.3;
      tree.add(trunk, crown);
      const a = seed + k * 2.1;
      tree.position.set(Math.cos(a) * radius * 0.45, radius * 0.32, Math.sin(a) * radius * 0.45);
      tree.scale.setScalar(0.8 + 0.4 * ((seed + k) % 1));
      group.add(tree);
    }
  }
  return group;
}

const islands = [];
const layout = [
  { x: -9, y: 3.5, z: -4, r: 2.8 },
  { x: 2,  y: 5.5, z: -8, r: 3.4 },
  { x: 10, y: 2.0, z: -2, r: 2.3 },
  { x: -3, y: 0.5, z: 5,  r: 2.0 },
  { x: 7,  y: 7.0, z: 4,  r: 2.6 },
  { x: -12, y: 6.0, z: 6, r: 1.8 }
];
layout.forEach((cfg, i) => {
  const isle = makeIsland(cfg.r, topColors[i % topColors.length], i * 3.7 + 1.2);
  isle.position.set(cfg.x, cfg.y, cfg.z);
  scene.add(isle);
  islands.push({ g: isle, baseY: cfg.y, phase: i * 1.3, speed: 0.35 + (i % 3) * 0.12 });
});

// drifting cloud puffs for depth
const clouds = [];
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true, transparent: true, opacity: 0.85 });
for (let i = 0; i < 5; i++) {
  const c = new THREE.Group();
  for (let k = 0; k < 4; k++) {
    const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9 + Math.random() * 0.9, 0), cloudMat);
    puff.position.set(k * 1.2 - 1.8 + Math.random(), Math.random() * 0.5, Math.random() * 0.8);
    c.add(puff);
  }
  c.position.set((Math.random() - 0.5) * 50, 9 + Math.random() * 6, -18 - Math.random() * 12);
  scene.add(c);
  clouds.push({ g: c, speed: 0.15 + Math.random() * 0.2 });
}

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();

function tick() {
  const t = clock.getElapsedTime();
  if (!reduced) {
    for (const isl of islands) {
      isl.g.position.y = isl.baseY + Math.sin(t * isl.speed + isl.phase) * 0.55;
      isl.g.rotation.y = Math.sin(t * 0.1 + isl.phase) * 0.08;
    }
    for (const cl of clouds) {
      cl.g.position.x += cl.speed * 0.016;
      if (cl.g.position.x > 32) cl.g.position.x = -32;
    }
    controls.update();
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

if (reduced) {
  renderer.render(scene, camera);
} else {
  renderer.setAnimationLoop(tick);
}
</script>
</body>
</html>
