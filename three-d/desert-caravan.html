<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Caravan at Golden Hour — TZ-taste</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#f2c184; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }
  .caption { position:fixed; left:18px; bottom:16px; z-index:5; color:#5a3d22;
    font:12px/1.6 system-ui, -apple-system, sans-serif; letter-spacing:.05em;
    opacity:.9; pointer-events:none; }
  .caption b { display:block; font-size:13px; letter-spacing:.22em; text-transform:uppercase; }
  #fallback { display:none; position:fixed; inset:0; z-index:10; place-items:center;
    color:#5a3d22; font:14px/1.6 system-ui, sans-serif; text-align:center;
    padding:32px; background:#f2c184; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption"><b>Caravan at Golden Hour</b>three camels, one long shadow each<br/>drag to orbit &middot; scroll to zoom</div>
<div id="fallback"><p>This scene needs WebGL, which your browser could not provide.<br/>Try a recent version of Chrome, Safari, Firefox or Edge.</p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2c184);
scene.fog = new THREE.Fog(0xf2c184, 55, 160);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(20, 7.5, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2.5, -4);
controls.maxPolarAngle = 1.5;
controls.minDistance = 8;
controls.maxDistance = 90;

/* ---------- low warm sun, long shadows ---------- */
const sun = new THREE.DirectionalLight(0xffd9a3, 2.4);
sun.position.set(42, 7, -14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffe3b8, 0xb97a45, 0.55));

/* low sun disc + halo */
const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(7, 40),
  new THREE.MeshBasicMaterial({ color: 0xfff3d2, fog: false })
);
sunDisc.position.set(95, 6, -120);
sunDisc.lookAt(camera.position);
scene.add(sunDisc);
const halo = new THREE.Mesh(
  new THREE.CircleGeometry(14, 40),
  new THREE.MeshBasicMaterial({ color: 0xffe9b8, transparent: true, opacity: 0.28, fog: false, depthWrite: false })
);
halo.position.set(95, 6, -121);
halo.lookAt(camera.position);
scene.add(halo);

/* ---------- dunes ---------- */
function duneH(x, z) {
  return Math.sin(x * 0.06 + 1.7) * Math.cos(z * 0.05 + 0.6) * 2.2
       + Math.sin(x * 0.018 - z * 0.024 + 0.4) * 3.4
       + Math.sin((x + z) * 0.11) * 0.5;
}
const duneGeo = new THREE.PlaneGeometry(220, 140, 130, 80);
{
  const p = duneGeo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    p.setZ(i, duneH(v.x, -v.y)); // plane local: x right, y up-before-rotation -> z maps to world -z... handled below
  }
  duneGeo.computeVertexNormals();
}
const dunes = new THREE.Mesh(duneGeo, new THREE.MeshStandardMaterial({
  color: 0xcf9455, roughness: 1.0, flatShading: true }));
dunes.rotation.x = -Math.PI / 2;
dunes.receiveShadow = true;
scene.add(dunes);

/* scattered rocks */
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a5f3d, roughness: 1, flatShading: true });
for (let i = 0; i < 14; i++) {
  const r = 0.4 + Math.random() * 1.1;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rockMat);
  const x = (Math.random() - 0.5) * 130, z = (Math.random() - 0.5) * 90;
  rock.position.set(x, duneH(x, z) + r * 0.25, z);
  rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  rock.castShadow = true; rock.receiveShadow = true;
  scene.add(rock);
}

/* ---------- the caravan ---------- */
function makeCamel() {
  const g = new THREE.Group();
  const hide = new THREE.MeshStandardMaterial({ color: 0x4a2f1d, roughness: 0.95, flatShading: true });
  const cloth = new THREE.MeshStandardMaterial({ color: 0x9a5f36, roughness: 0.9, flatShading: true });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 0.75), hide);
  body.position.y = 1.35; g.add(body);
  const hump = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), hide);
  hump.position.set(-0.1, 1.72, 0); hump.scale.set(1, 0.72, 0.9); g.add(hump);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.19, 1.3, 8), hide);
  neck.position.set(0.98, 1.95, 0); neck.rotation.z = -0.5; g.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.3, 0.32), hide);
  head.position.set(1.42, 2.5, 0); g.add(head);
  const rider = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.52, 0.3), cloth);
  rider.position.set(-0.15, 2.1, 0); g.add(rider);
  const rhead = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), cloth);
  rhead.position.set(-0.15, 2.5, 0); g.add(rhead);
  const legGeo = new THREE.CylinderGeometry(0.09, 0.07, 1.15, 8);
  const legs = [];
  [[0.62, 0.26], [0.62, -0.26], [-0.62, 0.26], [-0.62, -0.26]].forEach(([lx, lz], i) => {
    const leg = new THREE.Mesh(legGeo, hide);
    leg.position.set(lx, 0.55, lz);
    leg.userData.phase = i * Math.PI * 0.5;
    g.add(leg); legs.push(leg);
  });
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { group: g, legs };
}
const caravan = [];
const LANE_Z = -7;
for (let i = 0; i < 3; i++) {
  const c = makeCamel();
  c.offset = -i * 14;
  c.speed = 1.55;
  scene.add(c.group);
  caravan.push(c);
}

/* ---------- drifting sand ---------- */
const SAND_N = 520;
const sandPos = new Float32Array(SAND_N * 3);
const sandSpd = new Float32Array(SAND_N);
for (let i = 0; i < SAND_N; i++) {
  sandPos[i * 3] = (Math.random() - 0.5) * 150;
  sandPos[i * 3 + 1] = Math.random() * 11 + 0.4;
  sandPos[i * 3 + 2] = (Math.random() - 0.5) * 100;
  sandSpd[i] = 2.5 + Math.random() * 3.5;
}
const sandGeo = new THREE.BufferGeometry();
sandGeo.setAttribute('position', new THREE.BufferAttribute(sandPos, 3));
const sandPts = new THREE.Points(sandGeo, new THREE.PointsMaterial({
  color: 0xf6dcab, size: 0.16, transparent: true, opacity: 0.7, depthWrite: false }));
scene.add(sandPts);

/* ---------- frame loop ---------- */
const clock = new THREE.Clock();
function renderFrame(t, dt) {
  // caravan walks a long loop, riding the dune surface
  for (const c of caravan) {
    const px = -75 + (((t * c.speed + c.offset) % 150) + 150) % 150;
    c.group.position.set(px, duneH(px, LANE_Z) + Math.abs(Math.sin(t * 2.2 + c.offset)) * 0.16, LANE_Z);
    c.group.rotation.z = Math.sin(t * 2.2 + c.offset) * 0.03;
    for (const leg of c.legs) {
      leg.rotation.x = Math.sin(t * 4.4 + leg.userData.phase + c.offset) * 0.38;
    }
  }
  // sand blows east
  const p = sandGeo.attributes.position;
  for (let i = 0; i < SAND_N; i++) {
    let x = p.getX(i) + sandSpd[i] * dt;
    if (x > 75) x = -75;
    p.setX(i, x);
    p.setY(i, p.getY(i) + Math.sin(t * 1.7 + i) * dt * 0.35);
  }
  p.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
}
if (REDUCED) {
  renderFrame(0, 0);
} else {
  renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  renderFrame(clock.elapsedTime, dt);
});
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
