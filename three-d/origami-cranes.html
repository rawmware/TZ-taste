<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crane Flock — TZ-taste 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#232a52}
#c{position:fixed;inset:0}
.caption{position:fixed;left:18px;bottom:16px;color:#fff6e8;font:12px/1.6 system-ui,sans-serif;letter-spacing:.05em;opacity:.85;pointer-events:none;text-shadow:0 1px 10px rgba(40,20,40,.7)}
.caption b{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
#fallback{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#232a52;color:#fff6e8;font:14px/1.6 system-ui,sans-serif;text-align:center;padding:2rem}
</style>
</head>
<body>
<div id="c"></div>
<div class="caption"><b>Crane Flock</b><span>drag to orbit</span></div>
<div id="fallback"><p></p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  const f = document.getElementById('fallback');
  f.style.display = 'flex';
  f.querySelector('p').textContent = 'WebGL is unavailable in this browser, so this 3D scene cannot be rendered.';
}

if (renderer) {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('c').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xe9a06f, 25, 95);

  // Dawn sky: vertical gradient baked to a tiny canvas texture.
  function skyTexture() {
    const cv = document.createElement('canvas');
    cv.width = 2; cv.height = 512;
    const g = cv.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 512);
    gr.addColorStop(0.00, '#232a52');
    gr.addColorStop(0.35, '#7a5a8c');
    gr.addColorStop(0.55, '#d97b8f');
    gr.addColorStop(0.72, '#f7b46a');
    gr.addColorStop(0.88, '#f9d9a0');
    gr.addColorStop(1.00, '#f2c184');
    g.fillStyle = gr;
    g.fillRect(0, 0, 2, 512);
    const tx = new THREE.CanvasTexture(cv);
    tx.colorSpace = THREE.SRGBColorSpace;
    return tx;
  }
  scene.background = skyTexture();

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(0, 3, 14);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 3, -10);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;

  scene.add(new THREE.HemisphereLight(0xffd9b0, 0x2a2f55, 0.9));
  const sun = new THREE.DirectionalLight(0xffc37a, 1.6);
  sun.position.set(-20, 8, -30);
  scene.add(sun);

  // Low sun disc with a soft halo.
  const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(3.2, 48),
    new THREE.MeshBasicMaterial({ color: 0xfff2cf, fog: false }));
  sunDisc.position.set(-16, 3.5, -70);
  scene.add(sunDisc);
  const halo = new THREE.Mesh(new THREE.CircleGeometry(5.6, 48),
    new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.22, fog: false }));
  halo.position.copy(sunDisc.position).z -= 0.5;
  scene.add(halo);

  // Stylized origami crane: faceted cone body, folded wings on pivots.
  const mats = [0xf7f3e8, 0xefe9da, 0xe6dfcd].map(c =>
    new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85 }));
  const wingGeo = new THREE.TetrahedronGeometry(0.55);
  wingGeo.scale(1.5, 0.1, 0.75);

  function makeCrane(mat) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.16, 1.0, 4), mat);
    body.rotation.x = Math.PI / 2;      // nose toward +z
    body.scale.set(1, 1, 0.7);          // flatten vertically
    g.add(body);
    const neck = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.55, 4), mat);
    neck.position.set(0, 0.16, 0.55);
    neck.rotation.x = -0.9;
    g.add(neck);
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 4), mat);
    head.position.set(0, 0.36, 0.74);
    head.rotation.x = Math.PI / 2 - 0.25;
    g.add(head);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.42, 4), mat);
    tail.position.set(0, 0.04, -0.58);
    tail.rotation.x = -Math.PI / 2 + 0.15;
    g.add(tail);
    for (const s of [-1, 1]) {
      const pivot = new THREE.Group();
      pivot.position.set(0.06 * s, 0.06, 0.02);
      const w = new THREE.Mesh(wingGeo, mat);
      w.position.x = 0.62 * s;
      pivot.add(w);
      g.add(pivot);
      if (s < 0) g.userData.wingL = pivot; else g.userData.wingR = pivot;
    }
    g.rotation.y = Math.PI / 2;         // face direction of travel (+x)
    return g;
  }

  const flock = new THREE.Group();
  flock.position.set(0, 3, -10);
  scene.add(flock);
  const cranes = [];
  for (let i = 0; i < 25; i++) {
    const crane = makeCrane(mats[i % 3]);
    const row = Math.ceil(i / 2);
    const side = i === 0 ? 0 : (i % 2 === 0 ? 1 : -1);
    crane.userData.base = new THREE.Vector3(-row * 2.6, (Math.random() - 0.5) * 1.2, side * row * 1.9);
    crane.userData.phase = Math.random() * Math.PI * 2;
    crane.userData.flap = 7 + Math.random() * 3;
    crane.position.copy(crane.userData.base);
    flock.add(crane);
    cranes.push(crane);
  }

  function tick(t) {
    flock.position.x = -48 + ((t * 3.2 + 40) % 96);
    for (const c of cranes) {
      const u = c.userData;
      c.position.y = u.base.y + Math.sin(t * 2 + u.phase) * 0.35;
      c.position.z = u.base.z + Math.cos(t * 1.4 + u.phase) * 0.2;
      const flap = Math.sin(t * u.flap + u.phase) * 0.72;
      u.wingL.rotation.z = flap + 0.12;
      u.wingR.rotation.z = -flap - 0.12;
      c.rotation.z = Math.sin(t * 1.3 + u.phase) * 0.06;
    }
    controls.update();
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (REDUCED) { tick(0); renderer.render(scene, camera); }
  else {
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => { tick(clock.getElapsedTime()); renderer.render(scene, camera); });
  }
}
</script>
</body>
</html>
