<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Horizon — TZ-taste</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#050b18}
  #c{position:fixed;inset:0;display:block}
  .caption{position:fixed;left:18px;bottom:16px;color:#7f93ad;font:12px/1.6 system-ui,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;pointer-events:none;opacity:.85}
  .caption b{display:block;font-size:13px;letter-spacing:.28em;color:#ffe9c4}
  #fallback{position:fixed;inset:0;display:none;place-items:center;color:#c8d4e3;
    font:14px system-ui,sans-serif;background:#050b18;text-align:center;padding:2rem}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption"><b>Neon Horizon</b>drag to orbit</div>
<div id="fallback"><p>WebGL is unavailable in this browser, so the neon horizon cannot render.</p></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050b18);
scene.fog = new THREE.Fog(0x050b18, 30, 190);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 7.5, 34);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 12; controls.maxDistance = 90;

// ---- grid floor: custom shader, procedural lines scrolling toward the camera
const gridMat = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: {
    uTime: { value: 0 },
    uLine: { value: new THREE.Color(0x2dd4bf) },
    uHot: { value: new THREE.Color(0xffc36b) },
    uFog: { value: new THREE.Color(0x050b18) }
  },
  vertexShader: `
    varying vec2 vUv; varying float vDist;
    void main() {
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vDist = length(wp.xz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uLine, uHot, uFog;
    varying vec2 vUv; varying float vDist;
    float line(vec2 p, float cells) {
      vec2 g = abs(fract(p * cells) - 0.5);
      vec2 w = fwidth(p * cells) * 1.4;
      vec2 a = smoothstep(0.5 - w, 0.5, g);
      return max(a.x, a.y);
    }
    void main() {
      vec2 p = vUv * 130.0;
      p.y -= uTime * 9.0;                       // grid scrolls toward viewer
      float g = line(p, 1.0);
      float maj = line(p, 0.2);                 // brighter major lines
      vec3 col = uLine * g * 0.55 + uHot * maj * 0.9;
      float fade = smoothstep(190.0, 28.0, vDist);   // fog fade into navy
      float horizon = smoothstep(0.47, 0.5, vUv.y);  // glow band at horizon
      col += uHot * horizon * 0.16;
      gl_FragColor = vec4(col, g * fade + horizon * 0.4);
    }`
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(280, 280), gridMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// ---- glowing sun: layered sprites (core disc + halo) from procedural canvas
function radialTex(stops, size = 256) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  stops.forEach(([t, col]) => g.addColorStop(t, col));
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const sun = new THREE.Group();
const core = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialTex([[0,'rgba(255,236,200,1)'],[0.45,'rgba(255,190,110,0.95)'],[0.7,'rgba(255,150,70,0.35)'],[1,'rgba(255,140,60,0)']]),
  transparent: true, depthWrite: false }));
core.scale.setScalar(34);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialTex([[0,'rgba(255,170,90,0.35)'],[0.6,'rgba(255,150,80,0.12)'],[1,'rgba(255,150,80,0)']]),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
halo.scale.setScalar(90);
sun.add(halo, core);
sun.position.set(0, 13, -150);
scene.add(sun);

// ---- distant ridge silhouettes: two jagged line strips
function ridge(seed, hBase, hVar, zPos, color) {
  const pts = [];
  for (let x = -160; x <= 160; x += 4) {
    const h = hBase + Math.abs(Math.sin(x * 0.05 + seed) * hVar) + Math.abs(Math.sin(x * 0.13 + seed * 2) * hVar * 0.4);
    pts.push(new THREE.Vector3(x, h, zPos));
  }
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55 }));
  scene.add(l);
}
ridge(1.7, 5, 7, -120, 0x0f2a3a);
ridge(4.2, 3, 4, -95, 0x123448);

// ---- a few stars high in the sky
{
  const n = 220, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i*3] = (Math.random() - 0.5) * 320;
    pos[i*3+1] = 26 + Math.random() * 130;
    pos[i*3+2] = -80 - Math.random() * 120;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9fd8d0, size: 0.7, transparent: true, opacity: 0.7 })));
}

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  gridMat.uniforms.uTime.value += dt;
  // gentle sun breathing
  const s = 1 + Math.sin(clock.elapsedTime * 0.6) * 0.015;
  core.scale.setScalar(34 * s);
  controls.update();
  renderer.render(scene, camera);
  if (!reduced) requestAnimationFrame(tick);
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);
resize();
tick();
</script>
</body>
</html>
