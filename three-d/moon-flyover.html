<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lunar Flyover · TZ-taste</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#app{position:fixed;inset:0}
.cap{position:fixed;left:18px;bottom:16px;color:#e8e8e8;font:12px/1.6 ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;pointer-events:none;user-select:none;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.cap b{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.cap span{opacity:.6}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e8e8e8;font:14px system-ui;background:#000;text-align:center;padding:2rem}
</style>
</head>
<body>
<div id="app"></div>
<div class="cap"><b>Lunar Flyover</b><br><span>automatic flyover · move pointer to look</span></div>
<div id="nogl" hidden><p>This scene needs WebGL.<br>Please try a browser with WebGL enabled.</p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true});
  if(!renderer.getContext()) throw new Error('no ctx');
}catch(err){
  document.getElementById('nogl').hidden = false;
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 1200);
camera.position.set(33, 7.5, 0);

function hash3(x,y,z){
  const h = Math.sin(x*127.1 + y*311.7 + z*74.7) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x,y,z){
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x-xi, yf = y-yi, zf = z-zi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf), w = zf*zf*(3-2*zf);
  const c000=hash3(xi,yi,zi),   c100=hash3(xi+1,yi,zi),   c010=hash3(xi,yi+1,zi),   c110=hash3(xi+1,yi+1,zi);
  const c001=hash3(xi,yi,zi+1), c101=hash3(xi+1,yi,zi+1), c011=hash3(xi,yi+1,zi+1), c111=hash3(xi+1,yi+1,zi+1);
  const x00=c000+(c100-c000)*u, x10=c010+(c110-c010)*u;
  const x01=c001+(c101-c001)*u, x11=c011+(c111-c011)*u;
  const y0=x00+(x10-x00)*v, y1=x01+(x11-x01)*v;
  return y0+(y1-y0)*w;
}
function fbm(x,y,z){
  let a=0.5, f=1, s=0;
  for(let i=0;i<4;i++){ s += a*vnoise(x*f, y*f, z*f); f *= 2.03; a *= 0.5; }
  return s;
}

const R = 24, SEG = 128;
const craters = [];
for(let i=0;i<70;i++){
  const d = new THREE.Vector3().randomDirection();
  const r = 0.025 + Math.pow(Math.random(),2)*0.11;
  craters.push({d:d, cosR:Math.cos(r), depth:r*R*(0.35 + Math.random()*0.65)});
}

const geo = new THREE.SphereGeometry(R, SEG, SEG);
const posA = geo.attributes.position;
const n = new THREE.Vector3(), p = new THREE.Vector3();
const colors = new Float32Array(posA.count*3);
for(let i=0;i<posA.count;i++){
  n.fromBufferAttribute(posA, i).normalize();
  let disp = (fbm(n.x*2.5+7, n.y*2.5, n.z*2.5) - 0.5) * 2.4;
  let dent = 0;
  for(const c of craters){
    const cosA = n.dot(c.d);
    if(cosA > c.cosR){
      const w = (cosA - c.cosR) / (1 - c.cosR);
      const bowl = c.depth * (0.5 + 0.5*Math.cos(Math.PI*(1-w)));
      const rim = c.depth * 0.45 * Math.exp(-Math.pow((w-0.18)/0.10, 2));
      disp += rim - bowl;
      dent += bowl;
    }
  }
  p.copy(n).multiplyScalar(R + disp);
  posA.setXYZ(i, p.x, p.y, p.z);
  const sh = Math.max(0.55, 1 - Math.min(0.4, dent*0.10));
  colors[i*3] = sh; colors[i*3+1] = sh; colors[i*3+2] = sh*1.02;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
geo.computeVertexNormals();
scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:1, metalness:0})));

const sun = new THREE.DirectionalLight(0xfff4e0, 3.2);
sun.position.set(60, 14, 22);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x2a3a55, 0.6));
const rimLight = new THREE.DirectionalLight(0x88aaff, 0.35);
rimLight.position.set(-50, -8, -30);
scene.add(rimLight);

{
  const nStars = 800, sp = new Float32Array(nStars*3);
  for(let i=0;i<nStars;i++){
    const v = new THREE.Vector3().randomDirection().multiplyScalar(380 + Math.random()*200);
    sp[i*3] = v.x; sp[i*3+1] = v.y; sp[i*3+2] = v.z;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff, size:1.6, sizeAttenuation:false, transparent:true, opacity:0.9, depthWrite:false})));
}

const mouse = {x:0, y:0};
addEventListener('pointermove', (e)=>{
  mouse.x = (e.clientX/innerWidth)*2 - 1;
  mouse.y = -((e.clientY/innerHeight)*2 - 1);
});

const lookTarget = new THREE.Vector3();
const camR = 33;
function fly(t){
  const a = t * 0.03;
  camera.position.set(Math.cos(a)*camR, 7.5 + Math.sin(t*0.11)*1.6, Math.sin(a)*camR);
  const la = a + 0.45;
  lookTarget.set(Math.cos(la)*19 + mouse.x*3, 1.5 + mouse.y*2, Math.sin(la)*19);
  camera.lookAt(lookTarget);
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
function tick(){
  fly(clock.getElapsedTime());
  renderer.render(scene, camera);
}
if(reduce){ tick(); } else { renderer.setAnimationLoop(tick); }

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
