<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Map — TZ-taste 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a}
#c{position:fixed;inset:0}
.caption{position:fixed;left:18px;bottom:16px;color:#bfe3ff;font:12px/1.6 system-ui,sans-serif;letter-spacing:.05em;opacity:.8;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.caption b{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
#fallback{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#02030a;color:#bfe3ff;font:14px/1.6 system-ui,sans-serif;text-align:center;padding:2rem}
</style>
</head>
<body>
<div id="c"></div>
<div class="caption"><b>Orbit Map</b><span>drag to orbit</span></div>
<div id="fallback"><p></p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  const f = document.getElementById('fallback');
  f.style.display = 'flex';
  f.querySelector('p').textContent = 'WebGL is unavailable in this browser, so this 3D scene cannot be rendered.';
}

if (renderer) {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('c').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02030a);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(0, 2.2, 8.4);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;

  // Star shell.
  const starPos = [];
  for (let i = 0; i < 1000; i++) {
    const r = 45 + Math.random() * 40;
    const th = Math.acos(2 * Math.random() - 1);
    const ph = Math.random() * Math.PI * 2;
    starPos.push(r * Math.sin(th) * Math.cos(ph), r * Math.cos(th), r * Math.sin(th) * Math.sin(ph));
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo,
    new THREE.PointsMaterial({ color: 0xcfe0ff, size: 0.35, transparent: true, opacity: 0.85, fog: false })));

  // Abstract earth: day/night terminator + sine-noise continents, all original GLSL.
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1.6, 64, 64),
    new THREE.ShaderMaterial({
      uniforms: { uSun: { value: new THREE.Vector3(1, 0.35, 0.6).normalize() } },
      vertexShader: `
        varying vec3 vP;
        varying vec3 vN;
        void main() {
          vP = position;
          vN = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 uSun;
        varying vec3 vP;
        varying vec3 vN;
        float land(vec3 p) {
          return sin(p.x * 4.1) * sin(p.y * 3.3 + 1.7) * sin(p.z * 4.7 + 0.6)
               + 0.5 * sin(p.x * 8.3 + 2.0) * sin(p.y * 7.1) * sin(p.z * 7.9 + 1.2);
        }
        void main() {
          vec3 N = normalize(vN);
          float day = clamp(dot(N, normalize(uSun)), 0.0, 1.0);
          float cont = smoothstep(0.15, 0.45, land(normalize(vP) * 2.0));
          vec3 ocean = mix(vec3(0.02, 0.05, 0.12), vec3(0.05, 0.16, 0.35), day);
          vec3 ground = mix(vec3(0.03, 0.06, 0.03), vec3(0.16, 0.32, 0.14), day);
          vec3 col = mix(ocean, ground, cont);
          col += vec3(1.0, 0.85, 0.6) * pow(day, 3.0) * 0.08;
          gl_FragColor = vec4(col, 1.0);
        }`
    })
  );
  scene.add(earth);

  // Atmosphere rim glow shell.
  const atmo = new THREE.Mesh(
    new THREE.SphereGeometry(1.74, 48, 48),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `
        varying vec3 vN;
        varying vec3 vWp;
        void main() {
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWp = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        varying vec3 vN;
        varying vec3 vWp;
        void main() {
          vec3 V = normalize(cameraPosition - vWp);
          float rim = pow(1.0 - abs(dot(normalize(vN), V)), 2.5);
          gl_FragColor = vec4(vec3(0.35, 0.6, 1.0) * rim * 1.2, rim);
        }`
    })
  );
  scene.add(atmo);

  // Soft radial glow texture for satellites.
  function glowTexture() {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    const g = cv.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,246,200,1)');
    gr.addColorStop(0.4, 'rgba(255,246,200,0.35)');
    gr.addColorStop(1, 'rgba(255,246,200,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(cv);
  }
  const glowTex = glowTexture();

  // Three tilted orbit rings, each carrying two satellite dots.
  const sats = [];
  const rings = [
    { r: 2.6, tx: 0.35, tz: 0.15, speed: 0.55, color: 0x59d8ff },
    { r: 3.2, tx: -0.5, tz: 0.55, speed: 0.38, color: 0x8affc1 },
    { r: 3.8, tx: 1.05, tz: -0.35, speed: 0.27, color: 0xffb35c }
  ];
  for (const cfg of rings) {
    const grp = new THREE.Group();
    const pts = [];
    for (let i = 0; i <= 128; i++) {
      const a = (i / 128) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * cfg.r, 0, Math.sin(a) * cfg.r));
    }
    grp.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: cfg.color, transparent: true, opacity: 0.5 })));
    grp.rotation.set(cfg.tx, 0, cfg.tz);
    for (let s = 0; s < 2; s++) {
      const dot = new THREE.Group();
      dot.add(new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xfff6c8 })));
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending }));
      spr.scale.set(0.55, 0.55, 1);
      dot.add(spr);
      grp.add(dot);
      sats.push({ dot, r: cfg.r, speed: cfg.speed, phase: s * Math.PI + Math.random() * 0.6 });
    }
    scene.add(grp);
  }

  function tick(t) {
    earth.rotation.y = t * 0.05;
    for (const s of sats) {
      const a = t * s.speed + s.phase;
      s.dot.position.set(Math.cos(a) * s.r, 0, Math.sin(a) * s.r);
    }
    controls.update();
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (REDUCED) { tick(0); renderer.render(scene, camera); }
  else {
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => { tick(clock.getElapsedTime()); renderer.render(scene, camera); });
  }
}
</script>
</body>
</html>
