<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe Terrain — TZ-taste</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #030608; }
  canvas { display: block; }
  .caption {
    position: fixed; left: 18px; bottom: 16px; color: #a5f3fc; pointer-events: none;
    font: 12px/1.6 ui-monospace, SFMono-Regular, monospace; letter-spacing: .14em;
    text-transform: uppercase; opacity: .85;
  }
  .caption small { display: block; letter-spacing: .05em; text-transform: none; opacity: .55; font-family: system-ui, sans-serif; }
  .fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #a5f3fc; font: 14px system-ui, sans-serif; padding: 2rem; text-align: center;
  }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="caption">Wireframe Terrain<small>drag to orbit &middot; waves displace vertices in JS each frame</small></div>
<div class="fallback" id="fallback" hidden>WebGL is unavailable in this browser, so this scene cannot render.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const fallback = document.getElementById('fallback');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  fallback.hidden = false;
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030608);
scene.fog = new THREE.FogExp2(0x030608, 0.028);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 9, 22);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

const SIZE = 30, SEG = 96;
const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
geo.rotateX(-Math.PI / 2);
const base = geo.attributes.position.array.slice();
const vcount = geo.attributes.position.count;
const colors = new Float32Array(vcount * 3);
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const wire = new THREE.MeshBasicMaterial({ wireframe: true, vertexColors: true, transparent: true, opacity: 0.85 });
const mesh = new THREE.Mesh(geo, wire);
scene.add(mesh);

const deep = new THREE.Color(0x0a2540);
const mid = new THREE.Color(0x22d3ee);
const peak = new THREE.Color(0xa5f3fc);
const tmp = new THREE.Color();

function waveHeight(x, z, t) {
  return Math.sin(x * 0.45 + t * 1.1) * 1.0
       + Math.cos(z * 0.38 + t * 0.8) * 1.0
       + Math.sin((x + z) * 0.22 + t * 0.55) * 0.8
       + Math.cos((x - z) * 0.6 - t * 1.4) * 0.35;
}

function displace(t) {
  const p = geo.attributes.position.array;
  const c = geo.attributes.color.array;
  for (let i = 0; i < vcount; i++) {
    const x = base[i * 3], z = base[i * 3 + 2];
    const h = waveHeight(x, z, t);
    p[i * 3 + 1] = h;
    const k = THREE.MathUtils.clamp((h + 3) / 6, 0, 1);
    if (k < 0.5) tmp.copy(deep).lerp(mid, k * 2);
    else tmp.copy(mid).lerp(peak, (k - 0.5) * 2);
    c[i * 3] = tmp.r; c[i * 3 + 1] = tmp.g; c[i * 3 + 2] = tmp.b;
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;
  geo.computeVertexNormals();
}

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();

function tick() {
  const t = clock.getElapsedTime();
  displace(t);
  if (!reduced) {
    camera.position.x = Math.sin(t * 0.08) * 6;
    camera.position.z = 22 + Math.cos(t * 0.06) * 3;
    controls.update();
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

if (reduced) {
  displace(0);
  renderer.render(scene, camera);
} else {
  renderer.setAnimationLoop(tick);
}
</script>
</body>
</html>
