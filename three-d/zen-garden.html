<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raked Garden — TZ-taste</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#e8e0d0; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }
  .caption { position:fixed; left:18px; bottom:16px; z-index:5; color:#5c5546;
    font:12px/1.6 system-ui, -apple-system, sans-serif; letter-spacing:.05em;
    opacity:.85; pointer-events:none; }
  .caption b { display:block; font-size:13px; letter-spacing:.22em; text-transform:uppercase; }
  #fallback { display:none; position:fixed; inset:0; z-index:10; place-items:center;
    color:#5c5546; font:14px/1.6 system-ui, sans-serif; text-align:center;
    padding:32px; background:#e8e0d0; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption"><b>Raked Garden</b>drag to orbit &middot; scroll to zoom</div>
<div id="fallback"><p>This scene needs WebGL, which your browser could not provide.<br/>Try a recent version of Chrome, Safari, Firefox or Edge.</p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e0d0);
scene.fog = new THREE.Fog(0xe8e0d0, 30, 70);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 10, 15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0, 0);
controls.maxPolarAngle = 1.42;
controls.minDistance = 6;
controls.maxDistance = 45;

/* ---------- soft daylight, barely moving ---------- */
const sun = new THREE.DirectionalLight(0xfff0da, 1.55);
sun.position.set(8, 12, 6);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xf2f6ff, 0xcfc3a8, 0.7));

/* ---------- stones ---------- */
const ROCKS = [
  { x: -5.0, z: -2.0, r: 1.60, c: 0x8a8d90 },
  { x:  3.5, z:  1.5, r: 1.10, c: 0x9a9da0 },
  { x:  7.5, z: -3.5, r: 0.80, c: 0x7d8083 },
];
function makeRock(r, color) {
  const g = new THREE.DodecahedronGeometry(r, 2);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = Math.sin(v.x * 3.1) * Math.cos(v.y * 2.7 + 1.3) * 0.5
            + Math.sin(v.z * 4.3 + 0.7) * 0.3;
    v.multiplyScalar(1 + n * 0.18);
    v.y *= 0.72; // weathered, settled
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color, roughness: 0.95, flatShading: true }));
}
ROCKS.forEach(cfg => {
  const rock = makeRock(cfg.r, cfg.c);
  rock.position.set(cfg.x, cfg.r * 0.42, cfg.z);
  rock.rotation.y = Math.random() * Math.PI * 2;
  scene.add(rock);
});
// the one red accent: a small painted stone
const accent = makeRock(0.34, 0xb3392e);
accent.material.roughness = 0.55;
accent.position.set(0.6, 0.15, -0.9);
scene.add(accent);

/* ---------- raked sand: concentric rings near stones, straight lines beyond ---------- */
const sandUniforms = {
  uTime: { value: 0 },
  uRocks: { value: ROCKS.map(c => new THREE.Vector3(c.x, c.z, c.r)) },
};
const sand = new THREE.Mesh(
  new THREE.PlaneGeometry(38, 28, 1, 1),
  new THREE.ShaderMaterial({
    uniforms: sandUniforms,
    vertexShader: `
      varying vec2 vXZ;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vXZ = w.xz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      varying vec2 vXZ;
      uniform float uTime;
      uniform vec3 uRocks[3];
      void main() {
        vec2 p = vXZ;
        float dmin = 1e5;
        float rings = 0.0;
        for (int i = 0; i < 3; i++) {
          float d = distance(p, uRocks[i].xy);
          dmin = min(dmin, d);
          float mask = smoothstep(uRocks[i].z * 3.4, uRocks[i].z * 1.5, d);
          rings += mask * (0.5 + 0.5 * sin(d * 44.0 - uRocks[i].z * 44.0));
        }
        rings = clamp(rings, 0.0, 1.0);
        float straight = 0.5 + 0.5 * sin((p.x * 0.9 + p.y * 0.35) * 9.0);
        float nearRock = smoothstep(6.5, 2.2, dmin);
        float rake = mix(straight, rings, nearRock);
        vec3 sandCol  = vec3(0.93, 0.88, 0.80);
        vec3 grooveCol = vec3(0.78, 0.72, 0.62);
        vec3 col = mix(sandCol, grooveCol, rake * 0.55);
        // slow breath of light across the garden
        float breath = 0.5 + 0.5 * sin(uTime * 0.18 + p.x * 0.06 + p.y * 0.04);
        col *= 0.965 + breath * 0.05;
        // soft darkening toward the wooden edge
        float e = smoothstep(19.0, 10.5, length(p));
        col = mix(vec3(0.70, 0.64, 0.54), col, e);
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
sand.rotation.x = -Math.PI / 2;
scene.add(sand);

/* ---------- frame loop: near-still, only light breathes ---------- */
const clock = new THREE.Clock();
function renderFrame(t) {
  sandUniforms.uTime.value = t;
  sun.position.x = 8 + Math.sin(t * 0.10) * 2.0;
  sun.position.z = 6 + Math.cos(t * 0.07) * 1.5;
  controls.update();
  renderer.render(scene, camera);
}
if (REDUCED) {
  renderFrame(0);
} else {
  renderer.setAnimationLoop(() => renderFrame(clock.elapsedTime));
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
