<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Record Store Vinyl — TZ-taste</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#efe3cb; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }
  .caption { position:fixed; left:18px; bottom:16px; z-index:5; color:#6b5a43;
    font:12px/1.6 system-ui, -apple-system, sans-serif; letter-spacing:.05em;
    opacity:.9; pointer-events:none; }
  .caption b { display:block; font-size:13px; letter-spacing:.22em; text-transform:uppercase; }
  #fallback { display:none; position:fixed; inset:0; z-index:10; place-items:center;
    color:#6b5a43; font:14px/1.6 system-ui, sans-serif; text-align:center;
    padding:32px; background:#efe3cb; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption"><b>Record Store Vinyl</b>crates full, one record spinning<br/>drag to orbit &middot; scroll to zoom</div>
<div id="fallback"><p>This scene needs WebGL, which your browser could not provide.<br/>Try a recent version of Chrome, Safari, Firefox or Edge.</p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xefe3cb);
scene.fog = new THREE.Fog(0xefe3cb, 35, 95);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(11, 8, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2, 0);
controls.maxPolarAngle = 1.52;
controls.minDistance = 5;
controls.maxDistance = 55;

scene.add(new THREE.HemisphereLight(0xfff8ea, 0xb09a72, 1.0));
const lamp = new THREE.DirectionalLight(0xfff0d4, 1.1);
lamp.position.set(12, 18, 8);
scene.add(lamp);

/* ---------- floor + rug ---------- */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 90),
  new THREE.MeshStandardMaterial({ color: 0xdcc9a4, roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const rug = new THREE.Mesh(new THREE.CircleGeometry(7, 40),
  new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 1 }));
rug.rotation.x = -Math.PI / 2;
rug.position.y = 0.02;
scene.add(rug);

/* ---------- crates of records ---------- */
const woodMat = new THREE.MeshStandardMaterial({ color: 0x8a6b45, roughness: 0.85 });
const vinylMat = new THREE.MeshStandardMaterial({ color: 0x171412, roughness: 0.35, metalness: 0.2 });
const labelCols = [0xc0392b, 0x2e8f8a, 0xe8a13c, 0x3d7a52, 0x8c2b1f];
function makeCrate(x, z, ry, n) {
  const g = new THREE.Group();
  const Wd = 5.4, Ht = 2.6, Dp = 5.4, th = 0.18;
  const mk = (w, h, d, px, py, pz) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodMat);
    m.position.set(px, py, pz); g.add(m);
  };
  mk(Wd, th, Dp, 0, th / 2, 0);
  mk(Wd, Ht, th, 0, Ht / 2, -Dp / 2 + th / 2);
  mk(Wd, Ht, th, 0, Ht / 2, Dp / 2 - th / 2);
  mk(th, Ht, Dp, -Wd / 2 + th / 2, Ht / 2, 0);
  mk(th, Ht, Dp, Wd / 2 - th / 2, Ht / 2, 0);
  for (let i = 0; i < n; i++) {
    const rec = new THREE.Group();
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 0.05, 28), vinylMat);
    const label = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.06, 20),
      new THREE.MeshStandardMaterial({ color: labelCols[i % labelCols.length], roughness: 0.7 }));
    rec.add(disc); rec.add(label);
    rec.position.set(-Wd / 2 + 0.5 + (i / (n - 1)) * (Wd - 1), 1.75 + (i % 2) * 0.06, (Math.random() - 0.5) * 0.5);
    rec.rotation.x = (Math.random() - 0.5) * 0.14;
    rec.rotation.z = Math.PI / 2 + (Math.random() - 0.5) * 0.12;
    g.add(rec);
  }
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  scene.add(g);
}
makeCrate(-6.5, -2, 0.28, 12);
makeCrate(-6.5, 4.5, 0.28, 12);
makeCrate(6.5, 1, -0.3, 12);

/* ---------- turntable ---------- */
const table = new THREE.Group();
const plinth = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.9, 5.2),
  new THREE.MeshStandardMaterial({ color: 0x4a3b2c, roughness: 0.7 }));
plinth.position.y = 0.45;
table.add(plinth);
const platter = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 0.22, 36), vinylMat);
platter.position.y = 1.0;
table.add(platter);
const spinLabel = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.24, 24),
  new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.6 }));
spinLabel.position.y = 1.0;
table.add(spinLabel);
const armBase = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.42, 0.5, 12),
  new THREE.MeshStandardMaterial({ color: 0x9a8a72, metalness: 0.7, roughness: 0.35 }));
armBase.position.set(2.5, 1.1, -1.7);
table.add(armBase);
const tonearm = new THREE.Group();
const arm = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.12, 0.16),
  new THREE.MeshStandardMaterial({ color: 0x9a8a72, metalness: 0.7, roughness: 0.35 }));
arm.position.x = -1.4;
tonearm.add(arm);
tonearm.position.set(2.5, 1.45, -1.7);
tonearm.rotation.y = 0.5;
table.add(tonearm);
table.position.set(6.5, 0, -5.5);
table.rotation.y = -0.3;
scene.add(table);

/* ---------- poster ---------- */
const poster = new THREE.Mesh(new THREE.PlaneGeometry(5, 7),
  new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.9 }));
poster.position.set(-11, 6.5, -9.8);
poster.rotation.y = 0.3;
scene.add(poster);
const posterIn = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 5.4),
  new THREE.MeshStandardMaterial({ color: 0xf7f2e7, roughness: 0.9 }));
posterIn.position.set(-10.83, 6.5, -9.62);
posterIn.rotation.y = 0.3;
scene.add(posterIn);

/* ---------- frame loop ---------- */
const clock = new THREE.Clock();
function renderFrame(t, dt) {
  platter.rotation.y += dt * 2.4;
  spinLabel.rotation.y += dt * 2.4;
  tonearm.rotation.y = 0.5 + Math.sin(t * 0.4) * 0.02;
  controls.update();
  renderer.render(scene, camera);
}
if (REDUCED) {
  renderFrame(1.0, 0);
} else {
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    renderFrame(clock.elapsedTime, dt);
  });
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
