<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Dome — TZ-taste</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060f; }
  canvas { display: block; }
  .caption {
    position: fixed; left: 18px; bottom: 16px; color: #99f6e4; pointer-events: none;
    font: 12px/1.6 system-ui, -apple-system, sans-serif; letter-spacing: .14em;
    text-transform: uppercase; opacity: .85;
  }
  .caption small { display: block; letter-spacing: .05em; text-transform: none; opacity: .55; }
  .fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #99f6e4; font: 14px system-ui, sans-serif; padding: 2rem; text-align: center;
  }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="caption">Aurora Dome<small>drag to orbit &middot; custom GLSL, all original noise</small></div>
<div class="fallback" id="fallback" hidden>WebGL is unavailable in this browser, so this scene cannot render.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const fallback = document.getElementById('fallback');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  fallback.hidden = false;
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060f);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 3, 16);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 6, 0);

// Star field on a far shell
const starCount = 900;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const u = Math.random() * Math.PI * 2;
  const v = Math.acos(2 * Math.random() - 1);
  const r = 120;
  starPos[i*3] = r * Math.sin(v) * Math.cos(u);
  starPos[i*3+1] = Math.abs(r * Math.cos(v)) * 0.9 - 4;
  starPos[i*3+2] = r * Math.sin(v) * Math.sin(u);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xcdd6ff, size: 0.7, sizeAttenuation: false, transparent: true, opacity: 0.8
})));

// Aurora dome: inverted sphere with original fragment shader
const uniforms = { uTime: { value: 0 } };
const auroraMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  side: THREE.BackSide,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }
    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 4; i++) {
        v += a * vnoise(p);
        p = p * 2.03 + vec2(1.7, 9.2);
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec2 uv = vUv;
      float t = uTime * 0.06;

      // domain-warped curtains sweeping around the dome
      float warp = fbm(vec2(uv.x * 6.0 + t, uv.y * 2.0 - t * 0.7));
      float bands = sin(uv.x * 28.0 + warp * 7.0 + t * 2.5);
      bands = smoothstep(0.15, 1.0, bands * 0.5 + 0.5);
      float veil = fbm(vec2(uv.x * 3.0 - t * 0.8, uv.y * 4.0 + warp));
      float glow = bands * (0.3 + 0.7 * veil);

      // fade at the horizon line and the zenith so it reads as sky
      float mask = smoothstep(0.02, 0.3, uv.y) * smoothstep(1.0, 0.6, uv.y);

      vec3 teal = vec3(0.12, 0.95, 0.72);
      vec3 violet = vec3(0.52, 0.22, 0.95);
      vec3 deep = vec3(0.02, 0.05, 0.18);
      vec3 col = mix(deep, mix(teal, violet, clamp(uv.y + warp * 0.45, 0.0, 1.0)), glow * mask);
      float alpha = clamp(glow * mask * 1.6, 0.0, 1.0);

      gl_FragColor = vec4(col, alpha);
    }
  `
});
const dome = new THREE.Mesh(new THREE.SphereGeometry(90, 64, 40), auroraMat);
dome.position.y = 10;
scene.add(dome);

// faint ground haze disc so the horizon isn't empty
const haze = new THREE.Mesh(
  new THREE.CircleGeometry(60, 48),
  new THREE.MeshBasicMaterial({ color: 0x0b1a33, transparent: true, opacity: 0.9 })
);
haze.rotation.x = -Math.PI / 2;
haze.position.y = -4;
scene.add(haze);

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();

function tick() {
  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;
  if (!reduced) {
    dome.rotation.y = t * 0.015;
    controls.update();
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

if (reduced) {
  uniforms.uTime.value = 4.0; // frozen mid-sway frame
  renderer.render(scene, camera);
} else {
  renderer.setAnimationLoop(tick);
}
</script>
</body>
</html>
