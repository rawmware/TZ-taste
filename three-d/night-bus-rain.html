<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Night Bus Rain — TZ-taste</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#08080d; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }
  .caption { position:fixed; left:18px; bottom:16px; z-index:5; color:#9aa0b8;
    font:12px/1.6 system-ui, -apple-system, sans-serif; letter-spacing:.05em;
    opacity:.9; pointer-events:none; }
  .caption b { display:block; font-size:13px; letter-spacing:.22em; text-transform:uppercase; }
  #fallback { display:none; position:fixed; inset:0; z-index:10; place-items:center;
    color:#9aa0b8; font:14px/1.6 system-ui, sans-serif; text-align:center;
    padding:32px; background:#08080d; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption"><b>Night Bus Rain</b>the 11:47 is on time, as always<br/>drag to orbit &middot; scroll to zoom</div>
<div id="fallback"><p>This scene needs WebGL, which your browser could not provide.<br/>Try a recent version of Chrome, Safari, Firefox or Edge.</p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080d);
scene.fog = new THREE.Fog(0x08080d, 30, 110);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(16, 8, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 3, 0);
controls.maxPolarAngle = 1.52;
controls.minDistance = 8;
controls.maxDistance = 80;

scene.add(new THREE.HemisphereLight(0x2a2f4a, 0x050507, 0.6));

/* ---------- wet street ---------- */
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(160, 12),
  new THREE.MeshStandardMaterial({ color: 0x101014, roughness: 0.18, metalness: 0.65 }));
road.rotation.x = -Math.PI / 2;
scene.add(road);
const dashMat = new THREE.MeshBasicMaterial({ color: 0xd8d8e0 });
for (let i = -7; i <= 7; i++) {
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.28), dashMat);
  dash.rotation.x = -Math.PI / 2;
  dash.position.set(i * 9, 0.02, 0);
  scene.add(dash);
}

/* ---------- buildings ---------- */
const bMat = new THREE.MeshStandardMaterial({ color: 0x0e0e16, roughness: 0.9 });
for (let i = 0; i < 10; i++) {
  const h = 8 + (i * 37 % 14);
  const b = new THREE.Mesh(new THREE.BoxGeometry(8, h, 8), bMat);
  b.position.set(-54 + i * 12, h / 2, i % 2 === 0 ? -12 : 12);
  scene.add(b);
}

/* ---------- neon signs ---------- */
function neonSign(color, x, z, w) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 7, 8),
    new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.6 }));
  pole.position.set(x, 3.5, z);
  scene.add(pole);
  const sign = new THREE.Mesh(new THREE.BoxGeometry(w, 1.1, 0.3),
    new THREE.MeshBasicMaterial({ color: color }));
  sign.position.set(x, 6.6, z);
  scene.add(sign);
  const pl = new THREE.PointLight(color, 30, 22, 1.8);
  pl.position.set(x, 6.6, z);
  scene.add(pl);
}
neonSign(0xff2e88, -20, -7.5, 3.4);
neonSign(0x29e6ff, 2, 7.5, 2.6);
neonSign(0xffb13c, 24, -7.5, 3.0);

/* ---------- the bus ---------- */
const bus = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x16161f, roughness: 0.4, metalness: 0.3 });
const body = new THREE.Mesh(new THREE.BoxGeometry(9, 2.6, 2.6), bodyMat);
body.position.y = 2.1;
bus.add(body);
const winMat = new THREE.MeshBasicMaterial({ color: 0x9ad4e8 });
const windows = new THREE.Mesh(new THREE.BoxGeometry(8.2, 0.9, 2.66), winMat);
windows.position.y = 2.6;
bus.add(windows);
const destSign = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.5),
  new THREE.MeshBasicMaterial({ color: 0xffb13c }));
destSign.position.set(4.52, 2.9, 0);
destSign.rotation.y = Math.PI / 2;
bus.add(destSign);
const wheelGeo = new THREE.CylinderGeometry(0.62, 0.62, 0.4, 18);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.9 });
const wheels = [];
for (const wx of [-3, 3]) for (const wz of [-1.35, 1.35]) {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.x = Math.PI / 2;
  w.position.set(wx, 0.62, wz);
  bus.add(w); wheels.push(w);
}
const headMat = new THREE.MeshBasicMaterial({ color: 0xfff2c8 });
for (const hz of [-0.8, 0.8]) {
  const h = new THREE.Mesh(new THREE.CircleGeometry(0.28, 12), headMat);
  h.position.set(4.52, 1.5, hz);
  h.rotation.y = Math.PI / 2;
  bus.add(h);
}
const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2e3e });
for (const hz of [-0.8, 0.8]) {
  const tl = new THREE.Mesh(new THREE.CircleGeometry(0.2, 12), tailMat);
  tl.position.set(-4.52, 1.5, hz);
  tl.rotation.y = -Math.PI / 2;
  bus.add(tl);
}
const beamL = new THREE.SpotLight(0xfff2c8, 260, 40, 0.5, 0.6, 1.4);
beamL.position.set(4.5, 1.5, 0);
beamL.target.position.set(30, 0, 0);
bus.add(beamL); bus.add(beamL.target);
scene.add(bus);

/* ---------- rain ---------- */
const RAIN_N = 550;
const rainPos = new Float32Array(RAIN_N * 6);
const rainSpd = new Float32Array(RAIN_N);
function resetDrop(i, randomY) {
  const x = (Math.random() - 0.5) * 110;
  const z = (Math.random() - 0.5) * 50;
  const y = randomY ? Math.random() * 26 : 24 + Math.random() * 4;
  rainPos[i * 6] = x; rainPos[i * 6 + 1] = y; rainPos[i * 6 + 2] = z;
  rainPos[i * 6 + 3] = x; rainPos[i * 6 + 4] = y - 1.4; rainPos[i * 6 + 5] = z;
  rainSpd[i] = 18 + Math.random() * 10;
}
for (let i = 0; i < RAIN_N; i++) resetDrop(i, true);
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
scene.add(new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({
  color: 0x7f95c8, transparent: true, opacity: 0.4 })));

/* ---------- frame loop ---------- */
const clock = new THREE.Clock();
function renderFrame(t, dt) {
  const bx = -46 + ((t * 7) % 92);
  bus.position.set(bx, Math.sin(t * 9) * 0.03, -3);
  for (const w of wheels) w.rotation.z -= dt * 5;
  const rp = rainGeo.attributes.position;
  for (let i = 0; i < RAIN_N; i++) {
    const ny = rp.getY(i * 2) - rainSpd[i] * dt;
    if (ny < 0) { resetDrop(i, false); continue; }
    rp.setY(i * 2, ny);
    rp.setY(i * 2 + 1, ny - 1.4);
  }
  rp.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
}
if (REDUCED) {
  renderFrame(6.0, 0);
} else {
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    renderFrame(clock.elapsedTime, dt);
  });
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
