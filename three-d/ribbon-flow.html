<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ribbon Flow Field — TZ-taste</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04222b}
  #c{position:fixed;inset:0;display:block}
  .caption{position:fixed;left:18px;bottom:16px;color:#6fa3a8;font:12px/1.6 system-ui,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;pointer-events:none;opacity:.85}
  .caption b{display:block;font-size:13px;letter-spacing:.28em;color:#c9ecef}
  #fallback{position:fixed;inset:0;display:none;place-items:center;color:#c9ecef;
    font:14px system-ui,sans-serif;background:#04222b;text-align:center;padding:2rem}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption"><b>Ribbon Flow Field</b>drag to orbit</div>
<div id="fallback"><p>WebGL is unavailable in this browser, so the ribbon field cannot render.</p></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04222b);
scene.fog = new THREE.FogExp2(0x04222b, 0.045);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 4, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 10; controls.maxDistance = 60;

// ---- my own pseudo-noise flow field: layered sines, divergence-free-ish and smooth
const V = new THREE.Vector3();
function flow(x, y, z, t, out) {
  out.set(
    Math.sin(y * 0.55 + t * 0.7) + Math.sin(z * 0.42 - t * 0.4),
    Math.sin(z * 0.5 + t * 0.55) * 0.7 + Math.sin(x * 0.38 + t * 0.3),
    Math.sin(x * 0.48 - t * 0.6) + Math.sin(y * 0.36 + t * 0.45)
  );
  return out.normalize();
}

const RIBBONS = 48, SEG = 60, STEP = 0.34, WIDTH = 0.34;
const teal = new THREE.Color(0x2dd4bf), aqua = new THREE.Color(0x7df0e4),
      gold = new THREE.Color(0xf2c078), col = new THREE.Color();
const ribbons = [];
const p = new THREE.Vector3(), n = new THREE.Vector3(), side = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);

for (let r = 0; r < RIBBONS; r++) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array((SEG + 1) * 2 * 3);
  const idx = [];
  for (let i = 0; i < SEG; i++) {
    const a = i * 2, b = i * 2 + 1, c2 = i * 2 + 2, d = i * 2 + 3;
    idx.push(a, b, c2, b, d, c2);
  }
  geo.setIndex(idx);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  col.lerpColors(teal, Math.random() < 0.16 ? gold : aqua, Math.random() * 0.85);
  const mat = new THREE.MeshBasicMaterial({
    color: col.clone(), transparent: true, opacity: 0.34,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  // seed path across a soft disc volume
  const a0 = Math.random() * Math.PI * 2, rad = 4 + Math.random() * 8;
  ribbons.push({ mesh, pos,
    seed: [Math.cos(a0) * rad, (Math.random() - 0.5) * 9, Math.sin(a0) * rad],
    phase: Math.random() * 100 });
}

function drawRibbon(rb, t) {
  p.set(...rb.seed);
  const { pos } = rb;
  for (let i = 0; i <= SEG; i++) {
    flow(p.x, p.y, p.z, t + rb.phase, V);
    n.copy(V);
    side.crossVectors(n, up);
    if (side.lengthSq() < 1e-4) side.set(1, 0, 0);
    side.normalize();
    const fade = Math.sin((i / SEG) * Math.PI);            // taper head and tail
    const w = WIDTH * fade * (0.7 + 0.3 * Math.sin(t * 0.8 + rb.phase));
    const o = i * 6;
    pos[o]   = p.x - side.x * w; pos[o+1] = p.y - side.y * w; pos[o+2] = p.z - side.z * w;
    pos[o+3] = p.x + side.x * w; pos[o+4] = p.y + side.y * w; pos[o+5] = p.z + side.z * w;
    p.addScaledVector(n, STEP);
  }
  rb.mesh.geometry.attributes.position.needsUpdate = true;
  rb.mesh.geometry.computeVertexNormals();
}

const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  for (const rb of ribbons) drawRibbon(rb, t);
  controls.update();
  renderer.render(scene, camera);
  if (!reduced) requestAnimationFrame(tick);
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);
resize();
tick();
</script>
</body>
</html>
