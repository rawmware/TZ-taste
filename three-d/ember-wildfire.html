<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ember Drift · TZ-taste</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0503}
#app{position:fixed;inset:0}
.cap{position:fixed;left:18px;bottom:16px;color:#f5e6d4;font:12px/1.6 ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;pointer-events:none;user-select:none;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.cap b{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.cap span{opacity:.6}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f5e6d4;font:14px system-ui;background:#0b0503;text-align:center;padding:2rem}
</style>
</head>
<body>
<div id="app"></div>
<div class="cap"><b>Ember Drift</b><br><span>drag to orbit · scroll to zoom</span></div>
<div id="nogl" hidden><p>This scene needs WebGL.<br>Please try a browser with WebGL enabled.</p></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true});
  if(!renderer.getContext()) throw new Error('no ctx');
}catch(err){
  document.getElementById('nogl').hidden = false;
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0503);
scene.fog = new THREE.FogExp2(0x0b0503, 0.026);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.maxPolarAngle = Math.PI * 0.52;

function radialTex(stops, size){
  size = size || 128;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const s of stops) gr.addColorStop(s[0], s[1]);
  g.fillStyle = gr; g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const softTex = radialTex([[0,'rgba(255,255,255,1)'],[0.35,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);

const H = 26;

function makePoints(count, colA, colB, sizeMul, blending, opacity, swayMul){
  const pos = new Float32Array(count*3);
  const seed = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = Math.pow(Math.random(),0.6)*11, a = Math.random()*Math.PI*2;
    pos[i*3]   = Math.cos(a)*r;
    pos[i*3+1] = Math.random()*H;
    pos[i*3+2] = Math.sin(a)*r;
    seed[i*3]   = 0.5 + Math.random()*1.6;
    seed[i*3+1] = Math.random();
    seed[i*3+2] = (0.5 + Math.random()) * sizeMul;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed,3));
  const mat = new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0}, uMap:{value:softTex}, uH:{value:H},
      uColA:{value:new THREE.Color(colA)}, uColB:{value:new THREE.Color(colB)},
      uOp:{value:opacity}, uSway:{value:swayMul}
    },
    transparent:true, depthWrite:false, blending:blending,
    vertexShader:[
      'attribute vec3 aSeed;',
      'uniform float uTime; uniform float uH; uniform float uSway;',
      'varying float vF; varying float vFade;',
      'void main(){',
      '  vec3 p = position;',
      '  float y = mod(p.y + uTime * aSeed.x, uH);',
      '  p.y = y;',
      '  p.x += sin(uTime*0.7 + aSeed.y*6.2831) * uSway;',
      '  p.z += cos(uTime*0.55 + aSeed.y*6.2831) * uSway;',
      '  vF = 0.55 + 0.45 * sin(uTime*(2.5 + aSeed.x*2.0) + aSeed.y*40.0);',
      '  vFade = smoothstep(0.0, 1.5, y) * (1.0 - smoothstep(uH-5.0, uH, y));',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  gl_PointSize = aSeed.z * vF * (170.0 / max(1.0, -mv.z));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader:[
      'uniform sampler2D uMap; uniform vec3 uColA; uniform vec3 uColB; uniform float uOp;',
      'varying float vF; varying float vFade;',
      'void main(){',
      '  float a = texture2D(uMap, gl_PointCoord).a;',
      '  vec3 col = mix(uColA, uColB, vF);',
      '  gl_FragColor = vec4(col * vF, a * vFade * uOp);',
      '}'
    ].join('\n')
  });
  return new THREE.Points(geo, mat);
}

const embers = makePoints(320, 0xff3d00, 0xffc46b, 1.0, THREE.AdditiveBlending, 0.95, 0.9);
scene.add(embers);
const smoke = makePoints(60, 0x4a3a30, 0x201612, 6.5, THREE.NormalBlending, 0.16, 1.6);
scene.add(smoke);

const glowTex = radialTex([[0,'rgba(255,120,30,0.85)'],[0.4,'rgba(200,60,10,0.35)'],[1,'rgba(120,30,5,0)']], 256);
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(46,46),
  new THREE.MeshBasicMaterial({map:glowTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false})
);
glow.rotation.x = -Math.PI/2;
glow.position.y = 0.02;
scene.add(glow);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  embers.material.uniforms.uTime.value = t;
  smoke.material.uniforms.uTime.value = t * 0.5;
  controls.update();
  renderer.render(scene, camera);
}
if(reduce){ tick(); } else { renderer.setAnimationLoop(tick); }

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
