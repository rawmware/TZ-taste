<!--tz-meta {"id":"forms-feedback","title":"Feedback widget","category":"Forms","file":"patterns/forms-feedback.html","tags":["widget","rating"],"description":"A floating frosted feedback card with hand-drawn SVG face ratings.","dnas":["glass-calm"]} -->
<section class="tz-fb" aria-labelledby="tz-fb-h">
  <div class="tz-fb-card">
    <h2 id="tz-fb-h">How was today&rsquo;s visit?</h2>
    <p class="tz-fb-sub">Thirty seconds. Honest answers only.</p>
    <form action="#" method="post">
      <div class="tz-fb-faces" role="radiogroup" aria-label="Rating">
        <label class="tz-fb-face">
          <input type="radio" name="rating" value="1">
          <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="24" cy="24" r="20"/><circle cx="17" cy="19" r="1.6" fill="currentColor"/><circle cx="31" cy="19" r="1.6" fill="currentColor"/><path d="M15 33c3-4.5 15-4.5 18 0"/></svg>
          <span>Rough</span>
        </label>
        <label class="tz-fb-face">
          <input type="radio" name="rating" value="2">
          <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="24" cy="24" r="20"/><circle cx="17" cy="19" r="1.6" fill="currentColor"/><circle cx="31" cy="19" r="1.6" fill="currentColor"/><path d="M16 30h16"/></svg>
          <span>Fine</span>
        </label>
        <label class="tz-fb-face">
          <input type="radio" name="rating" value="3" checked>
          <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="24" cy="24" r="20"/><circle cx="17" cy="19" r="1.6" fill="currentColor"/><circle cx="31" cy="19" r="1.6" fill="currentColor"/><path d="M15 27c3 5 15 5 18 0"/></svg>
          <span>Lovely</span>
        </label>
      </div>
      <label class="tz-fb-sr" for="tz-fb-note">Anything we should know?</label>
      <textarea id="tz-fb-note" name="note" rows="2" placeholder="Anything we should know? (optional)"></textarea>
      <button type="submit">Send feedback</button>
    </form>
  </div>
</section>
<style>
.tz-fb{--ink:#1d2a2c;--accent:#0e6b62;--glass:rgba(255,255,255,.78);
  background:linear-gradient(140deg,#e8eef0,#f6f4ec);padding:clamp(56px,8vw,110px) 24px;
  font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
.tz-fb-card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(29,42,44,.14);border-radius:24px;box-shadow:0 20px 50px rgba(29,42,44,.14);
  padding:clamp(28px,4vw,44px);width:100%;max-width:440px;color:var(--ink)}
.tz-fb-card h2{font-size:26px;letter-spacing:-.02em;margin:0 0 8px}
.tz-fb-sub{font-size:15px;opacity:.7;margin:0 0 26px}
.tz-fb-faces{display:flex;justify-content:space-between;gap:8px;margin-bottom:24px}
.tz-fb-face{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  font-size:13px;padding:14px 10px;border-radius:16px;border:2px solid transparent;flex:1}
.tz-fb-face input{position:absolute;opacity:0;pointer-events:none}
.tz-fb-face svg{color:var(--ink);opacity:.55;transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .2s ease}
.tz-fb-face:hover svg{transform:translateY(-4px) scale(1.08);opacity:1}
.tz-fb-face:has(input:checked){border-color:var(--accent);background:rgba(14,107,98,.08)}
.tz-fb-face:has(input:checked) svg{opacity:1;color:var(--accent)}
.tz-fb-face:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.tz-fb-card textarea{width:100%;box-sizing:border-box;border:1px solid rgba(29,42,44,.2);
  border-radius:14px;background:rgba(255,255,255,.6);font-size:15px;font-family:inherit;
  color:var(--ink);padding:14px;resize:vertical;margin-bottom:18px}
.tz-fb-card textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.tz-fb-card button[type="submit"]{width:100%;background:var(--ink);color:#fff;border:0;
  border-radius:999px;font-size:16px;font-weight:bold;padding:15px;cursor:pointer;font-family:inherit}
.tz-fb-card button[type="submit"]:hover{background:var(--accent)}
.tz-fb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.tz-fb-face svg{transition:none}}
</style>
