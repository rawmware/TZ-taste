<!--tz-meta {"id":"stats-odometer","title":"Stats with odometer roll","category":"Sections","file":"patterns/stats-odometer.html","tags":["stats","numbers"],"description":"Stadium-floodlight stats: numbers roll like an odometer when scrolled into view, floodlight glow on the hero figure.","dnas":["stadium-floodlight"]} -->
<section class="tz-stats-odometer">
  <p class="tz-eyebrow">By the numbers</p>
  <h2>A season in <em>figures.</em></h2>
  <div class="tz-grid">
    <div class="tz-stat">
      <p class="tz-num"><span class="tz-odo" data-target="48213">0</span></p>
      <p class="tz-label">Fans through the gates</p>
    </div>
    <div class="tz-stat tz-hero-stat">
      <p class="tz-num"><span class="tz-odo" data-target="97">0</span><small>%</small></p>
      <p class="tz-label">Season-ticket renewal rate</p>
    </div>
    <div class="tz-stat">
      <p class="tz-num"><span class="tz-odo" data-target="34">0</span></p>
      <p class="tz-label">Home wins under the lights</p>
    </div>
    <div class="tz-stat">
      <p class="tz-num"><span class="tz-odo" data-target="12">0</span><small>M</small></p>
      <p class="tz-label">Concession pretzels served</p>
    </div>
  </div>
  <p class="tz-fine">2025–26 season · audited turnstile counts</p>
</section>
<style>
.tz-stats-odometer{--bg:#0d1117;--ink:#f2f4f8;--muted:#8b93a5;--accent:#ffb020;
  background:radial-gradient(70% 60% at 50% 0%,#1a2333 0%,var(--bg) 70%),var(--bg);
  color:var(--ink);text-align:center;padding:clamp(72px,10vw,140px) clamp(20px,5vw,64px);
  font-family:-apple-system,'Segoe UI',sans-serif}
.tz-stats-odometer .tz-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--accent);margin:0 0 18px;font-weight:700}
.tz-stats-odometer h2{font-size:clamp(36px,5.5vw,62px);font-weight:750;letter-spacing:-.02em;
  margin:0 0 56px}
.tz-stats-odometer h2 em{font-style:normal;color:var(--accent)}
.tz-stats-odometer .tz-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#ffffff14;
  border:1px solid #ffffff14;max-width:1080px;margin:0 auto}
.tz-stats-odometer .tz-stat{background:var(--bg);padding:44px 20px}
.tz-stats-odometer .tz-hero-stat{background:#141b29;box-shadow:inset 0 0 60px #ffb02014}
.tz-stats-odometer .tz-num{margin:0;font-variant-numeric:tabular-nums}
.tz-stats-odometer .tz-num span{font-size:clamp(38px,4.6vw,58px);font-weight:800;letter-spacing:-.02em;
  color:var(--accent);text-shadow:0 0 32px #ffb02055}
.tz-stats-odometer .tz-hero-stat .tz-num span{font-size:clamp(52px,6.5vw,80px)}
.tz-stats-odometer .tz-num small{font-size:.55em;color:var(--accent);font-weight:800}
.tz-stats-odometer .tz-label{margin:14px 0 0;color:var(--muted);font-size:13.5px;letter-spacing:.04em}
.tz-stats-odometer .tz-fine{color:var(--muted);font-size:12px;letter-spacing:.1em;margin:36px 0 0}
@media (max-width:860px){
  .tz-stats-odometer .tz-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  .tz-stats-odometer .tz-grid{grid-template-columns:1fr}
}
</style>
<script>
(function(){
  var nums=document.querySelectorAll('.tz-stats-odometer .tz-odo');
  function roll(el){
    var target=+el.dataset.target,t0=null,dur=1600;
    function frame(t){
      if(!t0)t0=t;var p=Math.min(1,(t-t0)/dur);
      var e=1-Math.pow(1-p,4);
      el.textContent=Math.round(target*e).toLocaleString('en-US');
      if(p<1)requestAnimationFrame(frame);
    }
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=target.toLocaleString('en-US');return;}
    requestAnimationFrame(frame);
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){roll(e.target);io.unobserve(e.target)}});
  },{threshold:.4});
  nums.forEach(function(n){io.observe(n)});
})();
</script>
