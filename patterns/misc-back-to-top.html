<!--tz-meta {"id":"misc-back-to-top","title":"Back to top button","category":"Sections","file":"patterns/misc-back-to-top.html","tags":["navigation","scroll"],"description":"Ticket-stub back-to-top: perforated stub button appears after scroll, smooth return, keyboard accessible.","dnas":["ticket-stub"]} -->
<section class="tz-misc-back-to-top" aria-label="Back to top demo">
  <div class="tz-demo-copy">
    <p class="tz-eyebrow">A long page needs an exit</p>
    <h2>Scroll down.<br><em>Then come back up.</em></h2>
    <p class="tz-lede">This button appears once you've scrolled past the fold — a perforated stub you can tear off to return to the top. Try it: scroll down a full screen.</p>
    <div class="tz-filler" aria-hidden="true">
      <span>keep scrolling</span><span>almost there</span><span>the button appears below</span>
    </div>
  </div>
  <button class="tz-top" type="button" aria-label="Back to top">
    <span class="tz-perf" aria-hidden="true"></span>
    <span class="tz-label">↑ Top</span>
  </button>
</section>
<style>
.tz-misc-back-to-top{--bg:#f1ece1;--ink:#241f18;--muted:#8a7d66;--accent:#b23a2e;
  background:var(--bg);color:var(--ink);padding:clamp(72px,10vw,130px) clamp(20px,5vw,64px) 40vh;
  font-family:Georgia,serif;text-align:center;position:relative}
.tz-misc-back-to-top .tz-demo-copy{max-width:640px;margin:0 auto}
.tz-misc-back-to-top .tz-eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--accent);margin:0 0 18px}
.tz-misc-back-to-top h2{font-weight:400;font-size:clamp(38px,6vw,66px);line-height:1.05;margin:0 0 18px}
.tz-misc-back-to-top h2 em{font-style:italic;color:var(--accent)}
.tz-misc-back-to-top .tz-lede{color:var(--muted);font-size:16.5px;max-width:52ch;margin:0 auto;
  font-family:-apple-system,'Segoe UI',sans-serif;line-height:1.7}
.tz-misc-back-to-top .tz-filler{display:grid;gap:38vh;margin-top:30vh;font-family:ui-monospace,Menlo,monospace;
  font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.tz-misc-back-to-top .tz-top{position:fixed;right:28px;bottom:28px;z-index:70;display:flex;align-items:center;
  background:#e3d9c4;border:2px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;
  font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;
  opacity:0;transform:translateY(16px);pointer-events:none;
  transition:opacity .35s cubic-bezier(.22,1,.36,1),transform .35s cubic-bezier(.22,1,.36,1)}
.tz-misc-back-to-top .tz-top.tz-show{opacity:1;transform:none;pointer-events:auto}
.tz-misc-back-to-top .tz-top:hover{border-color:var(--accent);color:var(--accent)}
.tz-misc-back-to-top .tz-top:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tz-misc-back-to-top .tz-perf{width:10px;align-self:stretch;
  background-image:linear-gradient(180deg,var(--ink) 55%,transparent 45%);background-size:10px 12px;opacity:.5}
.tz-misc-back-to-top .tz-label{padding:14px 20px}
@media (max-width:560px){
  .tz-misc-back-to-top .tz-top{right:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){
  .tz-misc-back-to-top .tz-top{transition:none}
}
</style>
<script>
(function(){
  var root=document.querySelector('.tz-misc-back-to-top');
  var btn=root.querySelector('.tz-top');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function onScroll(){btn.classList.toggle('tz-show',window.scrollY>window.innerHeight*.9);}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  btn.addEventListener('click',function(){
    if(reduce){window.scrollTo(0,0);}else{window.scrollTo({top:0,behavior:'smooth'});}
    btn.blur();
  });
})();
</script>
