<section class="tz-waitlist-form" aria-label="Join the waitlist">
  <p class="tz-k">Launching November</p>
  <h2>Get in line.<br>We&rsquo;ll save you a seat.</h2>
  <p class="tz-line"><span class="tz-count">4,812</span><span class="tz-ahead">people ahead of you</span></p>
  <div class="tz-meter" aria-hidden="true"><i style="width:34%"></i></div>
  <form class="tz-form" action="#" onsubmit="return false">
    <input type="email" required placeholder="you@example.com" aria-label="Email address">
    <button type="submit">Join the waitlist</button>
  </form>
  <p class="tz-fine">Every friend you refer jumps you 250 spots. No spam — one email when your invite is ready.</p>
</section>
<style>

  font-family:'Mulish',-apple-system,'Segoe UI',sans-serif;position:relative}
.tz-waitlist-form::before,.tz-waitlist-form::after{content:"";display:block;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:0 auto;max-width:560px}
.tz-waitlist-form::before{margin-bottom:40px}.tz-waitlist-form::after{margin-top:40px}
.tz-waitlist-form .tz-k{font-family:'Spline Sans Mono',ui-monospace,Menlo,monospace;font-size:11px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin:0 0 16px}
.tz-waitlist-form h2{font-family:'Fraunces',Georgia,serif;font-weight:500;
  font-size:clamp(32px,4.6vw,56px);letter-spacing:-.01em;line-height:1.1;margin:0 0 32px}
.tz-line{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:0 0 12px}
.tz-count{font-family:'Fraunces',Georgia,serif;font-size:clamp(48px,6vw,76px);color:var(--accent);line-height:1}
.tz-ahead{color:var(--muted);font-size:14px}
.tz-meter{max-width:420px;height:3px;background:#f5a62322;margin:0 auto 32px;border-radius:3px;overflow:hidden}

.tz-form{display:flex;gap:10px;max-width:480px;margin:0 auto 20px}
.tz-form input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:#ffffff0d;

.tz-form input::placeholder{color:var(--muted)}
.tz-form input:focus{outline:2px solid var(--accent);outline-offset:2px}

.tz-form button:hover{filter:brightness(1.08)}

@media(max-width:520px){.tz-form{flex-direction:column}.tz-form button{width:100%}}
</style>
