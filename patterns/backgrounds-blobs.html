<!--tz-meta {"id":"backgrounds-blobs","title":"Pastel blobs","category":"Backgrounds","file":"patterns/backgrounds-blobs.html","tags":["blobs","generative"],"description":"Generative pastel flow field: seeded ink particles drift on a looping current.","dnas":["glass-calm"]} -->
<!-- lineage: inspired by OpenProcessing trending flow-field sketches — original implementation -->
<!-- Usage: generative canvas behind content; renders one composed frame under reduced motion. -->
<div class="tz-blobs"><canvas aria-hidden="true"></canvas></div>
<style>
.tz-blobs{position:absolute;inset:0;pointer-events:none;background:#edf0f4;overflow:hidden}
.tz-blobs canvas{display:block;width:100%;height:100%}
</style>
<script>
(function(){
  var box=document.querySelector('.tz-blobs');if(!box)return;
  var c=box.querySelector('canvas'),x=c.getContext('2d');
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,TAU=Math.PI*2,LOOP=2400,frame=0;
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(20261003);
  var inks=['242,184,198','188,211,184','169,195,217','242,223,167','216,183,205'];
  function size(){var r=box.getBoundingClientRect();W=c.width=Math.max(2,r.width|0);H=c.height=Math.max(2,r.height|0);x.fillStyle='#edf0f4';x.fillRect(0,0,W,H);}
  size();addEventListener('resize',size);
  function spawn(anywhere){return{x:anywhere?rnd()*W:-24,y:rnd()*H,life:120+rnd()*180,ink:inks[(rnd()*inks.length)|0],w:10+rnd()*16};}
  var P=[],N=170,i;
  for(i=0;i<N;i++)P.push(spawn(true));
  function step(){
    var ph=((frame%LOOP)/LOOP)*TAU;
    x.fillStyle='rgba(237,240,244,0.035)';x.fillRect(0,0,W,H);
    for(i=0;i<N;i++){var q=P[i];
      var a=1.7*Math.sin(q.x*0.004+ph*2)+1.3*Math.cos(q.y*0.005-ph)+0.6*Math.sin((q.x+q.y)*0.002+ph*3);
      var nx=q.x+Math.cos(a)*1.4,ny=q.y+Math.sin(a)*1.4;
      x.strokeStyle='rgba('+q.ink+',0.30)';x.lineWidth=q.w;x.lineCap='round';
      x.beginPath();x.moveTo(q.x,q.y);x.lineTo(nx,ny);x.stroke();
      q.x=nx;q.y=ny;
      if(--q.life<0||q.x<-48||q.x>W+48||q.y<-48||q.y>H+48)P[i]=spawn(false);
    }
    frame++;
  }
  if(reduced){for(var k=0;k<420;k++)step();}
  else{(function loop(){step();requestAnimationFrame(loop);})();}
})();
</script>
