<section class="tz-boot">
  <div class="tz-boot-win">
    <div class="tz-boot-bar" aria-hidden="true"><i></i><i></i><i></i><span>tizi — zsh</span></div>
    <div class="tz-boot-log">
      <p style="--d:.15s"><span class="tz-boot-p">$</span> cold boot pocket-agent <b>OK</b></p>
      <p style="--d:.7s"><span class="tz-boot-p">$</span> checking memory ............ <b>OK</b></p>
      <p style="--d:1.25s"><span class="tz-boot-p">$</span> mounting /ideas ............. <b>OK</b></p>
      <p style="--d:1.8s"><span class="tz-boot-p">$</span> loading agent core .......... <b>OK</b></p>
      <p class="tz-boot-final" style="--d:2.4s"><span class="tz-boot-p">$</span> your assistant is awake. it runs on your phone, on your keys, on your rules.</p>
    </div>
    <a class="tz-boot-cta" href="#demo" style="--d:3s"><span class="tz-boot-p">$</span> run demo<span class="tz-boot-cursor" aria-hidden="true">▊</span></a>
  </div>
</section>
<style>
.tz-boot{--bg:#0c0e0c;--green:#4ade80;--dim:#4ade8099;--ink:#e7f0e7;
  background:var(--bg);color:var(--ink);display:flex;justify-content:center;
  padding:clamp(64px,9vw,130px) clamp(20px,5vw,60px);
  font-family:ui-monospace,Menlo,monospace}
.tz-boot-win{width:min(680px,100%);border:1px solid #4ade8033;border-radius:8px;
  background:#080908;box-shadow:0 24px 80px #000000aa;overflow:hidden}
.tz-boot-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;
  border-bottom:1px solid #4ade8022;background:#0e100e}
.tz-boot-bar i{width:11px;height:11px;border-radius:50%;background:#2a2e2a}
.tz-boot-bar i:first-child{background:#ff5f57}.tz-boot-bar i:nth-child(2){background:#febc2e}
.tz-boot-bar i:nth-child(3){background:#28c840}
.tz-boot-bar span{margin-left:8px;font-size:12px;opacity:.5}
.tz-boot-log{padding:28px 24px 8px;font-size:clamp(13px,2.6vw,15px);line-height:2}
.tz-boot-log p{margin:0;opacity:0;animation:tz-linein .01s linear forwards;animation-delay:var(--d)}
.tz-boot-log b{color:var(--green);font-weight:400}
.tz-boot-p{color:var(--green);margin-right:10px}
.tz-boot-final{color:var(--ink)}
@keyframes tz-linein{to{opacity:1}}
.tz-boot-cta{display:inline-block;margin:16px 24px 30px;color:var(--ink);text-decoration:none;
  font-size:clamp(15px,3vw,18px);border:1px solid var(--green);padding:14px 22px;
  opacity:0;animation:tz-linein .01s linear forwards;animation-delay:var(--d)}
.tz-boot-cta:hover{background:var(--green);color:#061206}
.tz-boot-cursor{color:var(--green);animation:tz-blink 1.06s steps(1) infinite;margin-left:2px}
.tz-boot-cta:hover .tz-boot-cursor{color:#061206}
@keyframes tz-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .tz-boot-log p,.tz-boot-cta{opacity:1;animation:none}
  .tz-boot-cursor{animation:none}
}
</style>
