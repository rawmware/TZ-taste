<section class="tz-peek">

</section>
<style>
.tz-peek{--bg:#fbfaf7;--ink:#1e1c17;--sage:#5c7a5e;--line:#1e1c171f;
  background:var(--bg);color:var(--ink);display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(40px,6vw,90px);align-items:center;

  font-family:Georgia,'Times New Roman',serif;overflow:hidden}
.tz-peek-eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--sage);margin:0 0 24px}
.tz-peek-h{font-size:clamp(40px,5.6vw,78px);line-height:1.06;letter-spacing:-.02em;
  font-weight:400;margin:0 0 26px;max-width:14ch}
.tz-peek-sub{font-size:clamp(16px,1.6vw,19px);line-height:1.65;max-width:38ch;
  margin:0 0 40px;opacity:.8}
.tz-peek-cta{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;
  font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:15px;padding:18px 38px;
  border-radius:10px;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.tz-peek-cta:hover{transform:translateY(-3px)}
.tz-peek-stage{display:flex;justify-content:center;perspective:1200px}
.tz-peek-win{width:min(430px,80vw);background:#fff;border:1px solid var(--line);

  transform:rotateY(-14deg) rotateX(6deg) rotate(-2deg)}
.tz-peek-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;background:#f1efe9;
  border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6a675e}
.tz-peek-bar i{width:10px;height:10px;border-radius:50%;background:#d8d4c8}
.tz-peek-bar span{margin-left:6px}
.tz-peek-ui{display:grid;grid-template-columns:88px 1fr;min-height:300px}
.tz-peek-side{background:#f6f4ee;border-right:1px solid var(--line);padding:18px 14px;
  display:flex;flex-direction:column;gap:12px}
.tz-peek-side b{height:10px;border-radius:5px;background:#dcd8cb}
.tz-peek-side b:first-child{background:var(--sage)}
.tz-peek-main{padding:20px;display:flex;flex-direction:column;gap:12px}

.tz-peek-chart{display:flex;align-items:flex-end;gap:10px;height:92px;margin-top:6px;

.tz-peek-chart b{flex:1;background:var(--sage);height:var(--h);border-radius:4px 4px 0 0;opacity:.85}
.tz-peek-total{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sage)}
@media (max-width:760px){
  .tz-peek{grid-template-columns:1fr}
  .tz-peek-win{transform:rotate(-2deg)}
}
</style>
