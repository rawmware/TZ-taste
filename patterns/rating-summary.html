<style>
.tz-rating-summary{--bg:#241109;--ink:#f7e8cf;--accent:#e9a820;--muted:#b0854f;--line:#e9a82066;
  background:var(--bg);color:var(--ink);padding:clamp(36px,5vw,80px);
  display:grid;grid-template-columns:auto 1fr;gap:clamp(32px,6vw,96px);align-items:center;
  font-family:'Work Sans',-apple-system,'Segoe UI',sans-serif}
.tz-rating-summary .tz-k{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.tz-num{font-family:'Yeseva One',Georgia,serif;font-size:clamp(72px,9vw,128px);line-height:1;
  letter-spacing:-.02em;margin:0 0 16px;color:var(--ink)}
.tz-stars{display:flex;gap:6px;margin-bottom:14px}
.tz-stars svg{width:26px;height:26px;fill:var(--accent)}
.tz-count{margin:0;font-size:14px;color:var(--muted)}
.tz-dist{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.tz-row{display:grid;grid-template-columns:16px 1fr;gap:12px;align-items:center}
.tz-row dt{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);margin:0}
.tz-row dd{margin:0;display:flex;align-items:center;gap:12px}
.tz-bar{flex:1;height:10px;background:#e9a82022;border-radius:6px;overflow:hidden}
.tz-bar i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:6px;
  transform-origin:left;animation:tz-rs-grow 1s cubic-bezier(.22,1,.36,1) both}
.tz-row:nth-child(2) i{animation-delay:.08s}.tz-row:nth-child(3) i{animation-delay:.16s}
.tz-row:nth-child(4) i{animation-delay:.24s}.tz-row:nth-child(5) i{animation-delay:.32s}
@keyframes tz-rs-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tz-pct{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);min-width:38px;text-align:right}
@media(max-width:640px){.tz-rating-summary{grid-template-columns:1fr;gap:36px}}
@media(prefers-reduced-motion:reduce){.tz-bar i{animation:none}}
</style>
