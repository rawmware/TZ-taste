<!--tz-meta {"id":"notification-toast","title":"Notification toast","category":"Misc","file":"patterns/notification-toast.html","tags":["toast","notifications","feedback","script"],"description":"Slide-in toast with progress timer and one honest state each. One tiny inline script.","dnas":["soft-minimal"]} -->
<section class="tz-notification-toast" aria-label="Toast demo">
  <div class="tz-demo">
    <p class="tz-label">Press a button. A toast lands bottom-right, then leaves on its own.</p>
    <button type="button" class="tz-trigger" data-kind="success">Save changes</button>
    <button type="button" class="tz-trigger" data-kind="error">Run the failing demo</button>
  </div>
  <div class="tz-stack" aria-live="polite"></div>
</section>
<script>
(function(){
  var root=document.querySelector('.tz-notification-toast');
  var stack=root.querySelector('.tz-stack');
  var copy={
    success:{title:'Saved',body:'Your draft is up to date on every device.'},
    error:{title:'That failed',body:'The demo hit a snag. Nothing was saved.'}
  };
  root.querySelectorAll('.tz-trigger').forEach(function(btn){
    btn.addEventListener('click',function(){
      var c=copy[btn.dataset.kind];
      var el=document.createElement('div');
      el.className='tz-toast tz-'+btn.dataset.kind;
      el.innerHTML='<p class="tz-t"><strong>'+c.title+'</strong><span>'+c.body+'</span></p><i class="tz-bar"></i>';
      stack.appendChild(el);
      requestAnimationFrame(function(){el.classList.add('tz-in')});
      setTimeout(function(){el.classList.remove('tz-in');
        setTimeout(function(){el.remove()},320)},4200);
    });
  });
})();
</script>
<style>
.tz-notification-toast{--bg:#f7f7f5;--ink:#1a1a1a;--muted:#8a8a93;--accent:#5b5bd6;
  --line:#1a1a1414;--good:#1f7a3d;--bad:#b3261e;
  background:var(--bg);color:var(--ink);padding:clamp(48px,8vw,120px);
  font-family:-apple-system,'Segoe UI',sans-serif;min-height:340px}
.tz-demo{max-width:560px;margin:0 auto;text-align:center}
.tz-label{color:var(--muted);font-size:15px;margin:0 0 20px}
.tz-trigger{border:1px solid var(--line);background:#fff;color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;padding:12px 24px;border-radius:10px;
  cursor:pointer;margin:0 6px}
.tz-trigger:hover{border-color:var(--ink)}
.tz-stack{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;
  gap:12px;z-index:50}
.tz-toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:10px;padding:14px 18px 18px;min-width:280px;max-width:360px;
  box-shadow:0 8px 28px #1a1a1a14;position:relative;overflow:hidden;
  transform:translateX(calc(100% + 24px));opacity:0;
  transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .24s ease}
.tz-toast.tz-in{transform:none;opacity:1}
.tz-success{border-left-color:var(--good)}
.tz-error{border-left-color:var(--bad)}
.tz-t{margin:0;font-size:14px;line-height:1.5}
.tz-t strong{display:block;font-size:14.5px;margin-bottom:2px}
.tz-t span{color:var(--muted)}
.tz-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);
  width:100%;transform-origin:left;animation:tz-drain 4.2s linear forwards}
.tz-success .tz-bar{background:var(--good)}
.tz-error .tz-bar{background:var(--bad)}
@keyframes tz-drain{to{transform:scaleX(0)}}
@media(max-width:640px){.tz-stack{left:16px;right:16px}.tz-toast{min-width:0}}
@media(prefers-reduced-motion:reduce){.tz-toast{transition:none;transform:none}
  .tz-bar{animation:none;display:none}}
</style>
