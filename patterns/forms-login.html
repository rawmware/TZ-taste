<!--tz-meta {"id":"forms-login","title":"Login card","category":"Forms","file":"patterns/forms-login.html","tags":["auth","centered"],"description":"Centered dark auth card with champagne focus rings and a quiet SSO row.","dnas":["dark-luxe"]} -->
<section class="tz-login" aria-labelledby="tz-login-h">
  <div class="tz-login-card">
    <p class="tz-login-word">Vesper</p>
    <h2 id="tz-login-h">Welcome back</h2>
    <p class="tz-login-sub">Sign in to your atelier account.</p>
    <form action="#" method="post">
      <div class="tz-login-field">
        <label for="tz-lg-email">Email</label>
        <input id="tz-lg-email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="tz-login-field">
        <label for="tz-lg-pass">Password</label>
        <input id="tz-lg-pass" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <div class="tz-login-row">
        <label class="tz-login-remember"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit">Sign in</button>
    </form>
    <div class="tz-login-div"><span>or continue with</span></div>
    <div class="tz-login-sso">
      <a href="#">Google</a><a href="#">Apple</a><a href="#">GitHub</a>
    </div>
    <p class="tz-login-alt">New here? <a href="#">Create an account</a></p>
  </div>
</section>
<style>
.tz-login{--bg:#121013;--card:#1a171c;--ink:#f3ede2;--champ:#d9c39a;--dim:#a89e90;
  background:radial-gradient(1200px 600px at 50% -10%,#241f26,var(--bg));
  padding:clamp(56px,8vw,110px) 24px;font-family:Arial,Helvetica,sans-serif;
  display:flex;justify-content:center}
.tz-login-card{background:var(--card);border:1px solid #d9c39a2e;border-radius:18px;
  padding:clamp(32px,5vw,52px);width:100%;max-width:420px;color:var(--ink)}
.tz-login-word{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:22px;
  color:var(--champ);margin:0 0 20px}
.tz-login-card h2{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.02em;
  font-size:32px;margin:0 0 8px}
.tz-login-sub{color:var(--dim);font-size:15px;margin:0 0 30px}
.tz-login-field{margin-bottom:18px}
.tz-login-field label{display:block;font-size:13px;letter-spacing:.06em;margin-bottom:8px;color:var(--dim)}
.tz-login-field input{width:100%;box-sizing:border-box;background:#121013;border:1px solid #d9c39a2e;
  border-radius:10px;color:var(--ink);font-size:16px;padding:14px 16px;font-family:inherit}
.tz-login-field input::placeholder{color:#a89e9066}
.tz-login-field input:focus{outline:2px solid var(--champ);outline-offset:2px;border-color:var(--champ)}
.tz-login-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 26px;
  font-size:14px;color:var(--dim)}
.tz-login-remember{display:flex;align-items:center;gap:8px;cursor:pointer}
.tz-login-remember input{accent-color:var(--champ);width:16px;height:16px}
.tz-login-row a,.tz-login-alt a{color:var(--champ);text-decoration:none}
.tz-login-row a:hover,.tz-login-alt a:hover{text-decoration:underline;text-underline-offset:4px}
.tz-login-card button[type="submit"]{width:100%;background:var(--champ);color:#121013;border:0;
  border-radius:10px;font-size:16px;font-weight:bold;padding:15px;cursor:pointer;font-family:inherit}
.tz-login-card button[type="submit"]:hover{background:#e6d0a8}
.tz-login-div{display:flex;align-items:center;gap:14px;color:var(--dim);font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;margin:28px 0 18px}
.tz-login-div::before,.tz-login-div::after{content:"";flex:1;height:1px;background:#d9c39a2e}
.tz-login-sso{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tz-login-sso a{text-align:center;border:1px solid #d9c39a2e;border-radius:10px;color:var(--ink);
  text-decoration:none;font-size:14px;padding:12px 0}
.tz-login-sso a:hover{border-color:var(--champ);color:var(--champ)}
.tz-login-alt{text-align:center;font-size:14px;color:var(--dim);margin:26px 0 0}
</style>
