<!--tz-meta {"id":"backgrounds-stars","title":"Starfield","category":"Backgrounds","file":"patterns/backgrounds-stars.html","tags":["canvas","space"],"description":"Seeded starfield: twinkling phosphor stars on a looping sine cycle.","dnas":["retro-terminal"]} -->
<!-- lineage: inspired by OpenProcessing trending particle sketches — original implementation -->
<!-- Usage: generative starfield behind content; one static frame under reduced motion. -->
<div class="tz-stars"><canvas aria-hidden="true"></canvas></div>
<style>
.tz-stars{position:absolute;inset:0;pointer-events:none;background:#070b07;overflow:hidden}
.tz-stars canvas{display:block;width:100%;height:100%}
</style>
<script>
(function(){
  var box=document.querySelector('.tz-stars');if(!box)return;
  var c=box.querySelector('canvas'),x=c.getContext('2d');
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,TAU=Math.PI*2,LOOP=900,frame=0;
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(77031),S=[],N=220,i;
  function size(){var r=box.getBoundingClientRect();W=c.width=Math.max(2,r.width|0);H=c.height=Math.max(2,r.height|0);}
  size();addEventListener('resize',size);
  for(i=0;i<N;i++)S.push({x:rnd()*W,y:rnd()*H,r:0.6+rnd()*1.6,ph:rnd()*TAU,sp:0.5+rnd()*2,dr:6+rnd()*14,green:rnd()<0.55});
  function step(){
    var t=((frame%LOOP)/LOOP)*TAU;
    x.fillStyle='#070b07';x.fillRect(0,0,W,H);
    for(i=0;i<N;i++){var s=S[i];
      var tw=0.25+0.75*Math.abs(Math.sin(t*s.sp+s.ph));
      var px=(s.x+s.dr*Math.sin(t*0.5+s.ph)+W)%W;
      x.fillStyle=s.green?('rgba(120,255,170,'+tw.toFixed(3)+')'):('rgba(235,255,240,'+tw.toFixed(3)+')');
      x.beginPath();x.arc(px,s.y,s.r,0,TAU);x.fill();
    }
    frame++;
  }
  if(reduced){step();}
  else{(function loop(){step();requestAnimationFrame(loop);})();}
})();
</script>
