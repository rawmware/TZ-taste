<!--tz-meta {"id":"misc-qr-download","title":"QR app download","category":"Sections","file":"patterns/misc-qr-download.html","tags":["qr","app","download"],"description":"Matchbook-cover QR download: strike-a-match framing, real QR placeholder with store buttons, SMS-the-link fallback.","dnas":["matchbook-cover"]} -->
<section class="tz-misc-qr-download">
  <div class="tz-matchbook">
    <div class="tz-strike" aria-hidden="true"></div>
    <div class="tz-qr-card">
      <p class="tz-eyebrow">Get the app</p>
      <h2>Point your camera.<br><em>That's the whole tutorial.</em></h2>
      <div class="tz-qr" role="img" aria-label="QR code linking to the app download page">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="4" y="4" width="100" height="100" fill="#fff"/>
          <g fill="#1c1a16">
            <rect x="10" y="10" width="24" height="24"/><rect x="14" y="14" width="16" height="16" fill="#fff"/><rect x="18" y="18" width="8" height="8"/>
            <rect x="66" y="10" width="24" height="24"/><rect x="70" y="14" width="16" height="16" fill="#fff"/><rect x="74" y="18" width="8" height="8"/>
            <rect x="10" y="66" width="24" height="24"/><rect x="14" y="70" width="16" height="16" fill="#fff"/><rect x="18" y="74" width="8" height="8"/>
            <rect x="42" y="10" width="8" height="8"/><rect x="54" y="18" width="8" height="8"/><rect x="42" y="30" width="8" height="8"/>
            <rect x="10" y="42" width="8" height="8"/><rect x="22" y="50" width="8" height="8"/><rect x="42" y="42" width="16" height="8"/>
            <rect x="66" y="42" width="8" height="8"/><rect x="78" y="50" width="8" height="8"/><rect x="42" y="58" width="8" height="8"/>
            <rect x="54" y="66" width="16" height="8"/><rect x="78" y="66" width="8" height="8"/><rect x="66" y="78" width="8" height="8"/>
            <rect x="42" y="78" width="8" height="8"/><rect x="54" y="82" width="8" height="8"/><rect x="82" y="82" width="8" height="8"/>
          </g>
        </svg>
        <p class="tz-scan">app.example.com/get</p>
      </div>
      <div class="tz-stores">
        <a class="tz-store" href="#ios"><b>App Store</b><span>Download on iOS</span></a>
        <a class="tz-store" href="#android"><b>Google Play</b><span>Get it on Android</span></a>
      </div>
      <form class="tz-sms">
        <label for="tz-sms-num">No camera handy? Text yourself the link:</label>
        <div class="tz-sms-row">
          <input id="tz-sms-num" type="tel" placeholder="(555) 000-0000" inputmode="tel">
          <button type="submit">Text me</button>
        </div>
        <p class="tz-done" hidden>Sent — check your messages.</p>
      </form>
    </div>
  </div>
</section>
<style>
.tz-misc-qr-download{--bg:#e8ddc4;--ink:#1c1a16;--muted:#7a6a4d;--accent:#b3402e;
  background:var(--bg);color:var(--ink);padding:clamp(72px,10vw,130px) clamp(20px,5vw,64px);
  font-family:Georgia,serif}
.tz-misc-qr-download .tz-matchbook{max-width:560px;margin:0 auto;background:#f4edda;
  border:2px solid var(--ink);box-shadow:8px 8px 0 #1c1a1622;position:relative}
.tz-misc-qr-download .tz-strike{height:26px;border-bottom:2px solid var(--ink);
  background:repeating-linear-gradient(90deg,var(--accent) 0 34px,#f4edda 34px 44px)}
.tz-misc-qr-download .tz-qr-card{padding:clamp(32px,5vw,56px);text-align:center}
.tz-misc-qr-download .tz-eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--accent);margin:0 0 16px}
.tz-misc-qr-download h2{font-weight:400;font-size:clamp(30px,4.6vw,44px);line-height:1.12;margin:0 0 32px}
.tz-misc-qr-download h2 em{font-style:italic;color:var(--accent)}
.tz-misc-qr-download .tz-qr{display:inline-block;background:#fff;border:2px solid var(--ink);padding:18px;margin-bottom:28px}
.tz-misc-qr-download .tz-qr svg{width:180px;height:180px;display:block}
.tz-misc-qr-download .tz-scan{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);margin:12px 0 0}
.tz-misc-qr-download .tz-stores{display:flex;gap:12px;justify-content:center;margin-bottom:32px;flex-wrap:wrap}
.tz-misc-qr-download .tz-store{background:var(--ink);color:#f4edda;text-decoration:none;padding:12px 24px;
  text-align:left;min-width:170px;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.tz-misc-qr-download .tz-store:hover{transform:translateY(-2px)}
.tz-misc-qr-download .tz-store b{display:block;font-size:15px;font-family:-apple-system,'Segoe UI',sans-serif}
.tz-misc-qr-download .tz-store span{font-size:11px;color:#f4edda99;font-family:ui-monospace,Menlo,monospace}
.tz-misc-qr-download .tz-sms{border-top:1px dashed #1c1a1633;padding-top:28px}
.tz-misc-qr-download .tz-sms label{font-size:14px;color:var(--muted);display:block;margin-bottom:12px;font-style:italic}
.tz-misc-qr-download .tz-sms-row{display:flex;gap:10px;max-width:380px;margin:0 auto}
.tz-misc-qr-download .tz-sms input{flex:1;border:2px solid var(--ink);background:#fff;padding:13px 16px;
  font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink)}
.tz-misc-qr-download .tz-sms button{background:var(--accent);color:#fff;border:0;padding:13px 24px;
  font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;cursor:pointer}
.tz-misc-qr-download .tz-done{color:var(--accent);font-size:14px;margin:14px 0 0;font-style:italic}
@media (max-width:520px){
  .tz-misc-qr-download .tz-sms-row{flex-direction:column}
}
</style>
<script>
(function(){
  var f=document.querySelector('.tz-misc-qr-download .tz-sms');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    f.querySelector('.tz-done').hidden=false;
  });
})();
</script>
