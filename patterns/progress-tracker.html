<section class="tz-progress-tracker" aria-label="Checkout progress">
  <p class="tz-k">Checkout — step 3 of 5</p>
  <ol class="tz-steps">
    <li class="tz-step tz-done">
      <span class="tz-dot" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="tz-label">Cart</span>
    </li>
    <li class="tz-step tz-done">
      <span class="tz-dot" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="tz-label">Details</span>
    </li>
    <li class="tz-step tz-now" aria-current="step">
      <span class="tz-dot" aria-hidden="true">3</span>
      <span class="tz-label">Shipping</span>
    </li>
    <li class="tz-step">
      <span class="tz-dot" aria-hidden="true">4</span>
      <span class="tz-label">Payment</span>
    </li>
    <li class="tz-step">
      <span class="tz-dot" aria-hidden="true">5</span>
      <span class="tz-label">Review</span>
    </li>
  </ol>
  <p class="tz-note">You&rsquo;re past the boring part — payment details are next, then you&rsquo;re done.</p>
</section>
<style>
.tz-progress-tracker{--bg:#f7f7f5;--ink:#1a1a1a;--muted:#8a8a93;--accent:#5b5bd6;--surface:#fff;--line:#1a1a1414;
  background:var(--bg);padding:clamp(32px,5vw,72px);
  font-family:'Instrument Sans',-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
.tz-progress-tracker .tz-k{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 28px}
.tz-steps{list-style:none;display:flex;margin:0 0 24px;padding:0;overflow-x:auto}
.tz-step{flex:1;min-width:110px;display:flex;flex-direction:column;gap:12px;position:relative;padding-top:2px}
.tz-step::before{content:"";position:absolute;top:21px;left:calc(-50% + 22px);right:calc(50% + 22px);
  height:2px;background:var(--line);border-radius:2px}
.tz-step:first-child::before{display:none}
.tz-step.tz-done::before{background:var(--accent)}
.tz-step.tz-now::before{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.tz-dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;
  background:var(--surface);border:2px solid var(--line);color:var(--muted);
  font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
.tz-step.tz-done .tz-dot{background:var(--accent);border-color:var(--accent);color:#fff}
.tz-step.tz-now .tz-dot{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 6px #5b5bd622}
.tz-label{font-size:13.5px;font-weight:600;color:var(--muted)}
.tz-step.tz-done .tz-label,.tz-step.tz-now .tz-label{color:var(--ink)}
.tz-note{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}
@media(max-width:640px){.tz-step{min-width:96px}.tz-label{font-size:12.5px}}
</style>
