<style>

  0 60px #39ff14,24px 60px #39ff14,36px 60px #39ff14,48px 60px #39ff14,60px 60px #39ff14,72px 60px #39ff14,84px 60px #39ff14,96px 60px #39ff14,120px 60px #39ff14,
  0 72px #39ff14,24px 72px #39ff14,96px 72px #39ff14,120px 72px #39ff14,
