<!--tz-meta {"id":"nav-scroll-progress","title":"Nav with scroll progress","category":"Sections","file":"patterns/nav-scroll-progress.html","tags":["nav","scroll"],"description":"Docs-solar nav: slim reading-progress hairline under the header, section-aware active link, back-to-top on long scroll.","dnas":["docs-solar"]} -->
<section class="tz-nav-scroll-progress">
  <div class="tz-bar"><div class="tz-fill" id="tz-progress-fill"></div></div>
  <nav class="tz-nav" aria-label="Guide sections">
    <a class="tz-logo" href="#top">Field Guide</a>
    <div class="tz-links">
      <a href="#start" data-spy="start" class="tz-active">Start</a>
      <a href="#tools" data-spy="tools">Tools</a>
      <a href="#technique" data-spy="technique">Technique</a>
      <a href="#recipes" data-spy="recipes">Recipes</a>
    </div>
    <a class="tz-top" href="#top" aria-label="Back to top">↑ Top</a>
  </nav>
</section>
<style>
.tz-nav-scroll-progress{--bg:#fdf9f0;--ink:#2b2118;--muted:#8a7a5f;--accent:#c97b1e;
  position:sticky;top:0;z-index:90;background:var(--bg);font-family:Georgia,serif}
.tz-nav-scroll-progress .tz-bar{height:3px;background:#2b211814}
.tz-nav-scroll-progress .tz-fill{height:100%;width:0;background:var(--accent);
  transition:width .1s linear}
.tz-nav-scroll-progress .tz-nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;
  gap:32px;padding:0 clamp(16px,4vw,32px);height:62px;border-bottom:1px solid #2b211814}
.tz-nav-scroll-progress .tz-logo{font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);
  letter-spacing:-.01em}
.tz-nav-scroll-progress .tz-links{display:flex;gap:26px;margin-left:8px}
.tz-nav-scroll-progress .tz-links a{text-decoration:none;color:var(--muted);font-size:14.5px;
  font-family:-apple-system,'Segoe UI',sans-serif;position:relative;padding:4px 0}
.tz-nav-scroll-progress .tz-links a.tz-active{color:var(--ink);font-weight:600}
.tz-nav-scroll-progress .tz-links a.tz-active::after{content:"";position:absolute;left:0;right:0;
  bottom:-2px;height:2px;background:var(--accent)}
.tz-nav-scroll-progress .tz-top{margin-left:auto;text-decoration:none;color:var(--muted);font-size:13px;
  font-family:ui-monospace,Menlo,monospace;opacity:0;pointer-events:none;transition:opacity .3s}
.tz-nav-scroll-progress.tz-past .tz-top{opacity:1;pointer-events:auto}
.tz-nav-scroll-progress .tz-top:hover{color:var(--accent)}
@media (max-width:680px){
  .tz-nav-scroll-progress .tz-links{display:none}
}
</style>
<script>
(function(){
  var root=document.querySelector('.tz-nav-scroll-progress');
  var fill=document.getElementById('tz-progress-fill');
  var links=root.querySelectorAll('[data-spy]');
  function onScroll(){
    var h=document.documentElement;
    var max=h.scrollHeight-h.clientHeight;
    fill.style.width=(max>0?(h.scrollTop/max*100):0)+'%';
    root.classList.toggle('tz-past',h.scrollTop>900);
  }
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(l){l.classList.toggle('tz-active',l.dataset.spy===e.target.id)});
      }
    });
  },{rootMargin:'-40% 0px -55% 0px'});
  links.forEach(function(l){var t=document.getElementById(l.dataset.spy);if(t)io.observe(t)});
})();
</script>
