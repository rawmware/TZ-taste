<!--tz-meta {"id":"shipping-calculator","title":"Shipping estimate ticket","category":"Forms","file":"patterns/shipping-calculator.html","tags":["shipping","checkout","ecommerce","estimate"],"description":"Ledger-style shipping ticket: ZIP input, three speed rows, honest arrival date.","dnas":["alpine-ledger"]} -->
<section class="tz-shipping-calculator" aria-label="Shipping estimate">
  <p class="tz-stamp">Shipping estimate</p>
  <label class="tz-zip">
    <span>Deliver to</span>
    <input type="text" inputmode="numeric" value="03801" aria-label="ZIP code" maxlength="5">
  </label>
  <div class="tz-opts" role="radiogroup" aria-label="Shipping speed">
    <label class="tz-opt tz-picked">
      <input type="radio" name="tz-ship" checked>
      <span class="tz-radio" aria-hidden="true"></span>
      <span class="tz-what"><strong>Standard</strong><small>3–5 business days</small></span>
      <span class="tz-price">$4.95</span>
    </label>
    <label class="tz-opt">
      <input type="radio" name="tz-ship">
      <span class="tz-radio" aria-hidden="true"></span>
      <span class="tz-what"><strong>Express</strong><small>2 business days</small></span>
      <span class="tz-price">$9.95</span>
    </label>
    <label class="tz-opt">
      <input type="radio" name="tz-ship">
      <span class="tz-radio" aria-hidden="true"></span>
      <span class="tz-what"><strong>Overnight</strong><small>Next business day, order by 2 PM</small></span>
      <span class="tz-price">$19.95</span>
    </label>
  </div>
  <p class="tz-total">Standard arrives <strong>Thu, Oct 8</strong> · free on orders over $75</p>
</section>
<style>
.tz-shipping-calculator{--bg:#f0e6d2;--ink:#2b2118;--accent:#b33a2b;--muted:#7a6c58;--line:#c9b98f;
  background:var(--bg);color:var(--ink);padding:clamp(28px,4vw,56px);max-width:560px;
  font-family:'Karla',-apple-system,'Segoe UI',sans-serif;border:1px solid var(--line)}
.tz-shipping-calculator .tz-stamp{font-family:'Special Elite','Courier New',monospace;font-size:15px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin:0 0 20px;
  border-bottom:2px dashed var(--line);padding-bottom:16px}
.tz-zip{display:flex;align-items:center;gap:14px;margin-bottom:20px;font-size:14px;color:var(--muted)}
.tz-zip input{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:16px;color:var(--ink);
  background:transparent;border:1px solid var(--line);padding:8px 12px;width:110px;border-radius:4px}
.tz-zip input:focus{outline:2px solid var(--accent);outline-offset:2px}
.tz-opts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tz-opt{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tz-opt input{position:absolute;opacity:0;pointer-events:none}
.tz-radio{width:18px;height:18px;border:2px solid var(--muted);border-radius:50%;position:relative}
.tz-opt.tz-picked .tz-radio{border-color:var(--accent)}
.tz-opt.tz-picked .tz-radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.tz-what strong{display:block;font-size:15.5px}
.tz-what small{color:var(--muted);font-size:13px}
.tz-price{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:600}
.tz-total{margin:20px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.tz-total strong{color:var(--ink)}
@media(max-width:480px){.tz-shipping-calculator{padding:24px}}
</style>
