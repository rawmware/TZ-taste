<!-- lineage: inspired by OpenProcessing trending geometric-rhythm sketches — original implementation -->
<!-- Usage: generative mesh behind content; a chrome sheen band crosses diagonally. -->
<div class="tz-mesh"><canvas aria-hidden="true"></canvas><span class="tz-mesh-sheen" aria-hidden="true"></span></div>
<style>
.tz-mesh{position:absolute;inset:0;pointer-events:none;background:#dde2e8;overflow:hidden}
.tz-mesh canvas{display:block;width:100%;height:100%}
.tz-mesh-sheen{position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.38) 50%,transparent 58%)}
</style>
<script>
(function(){
  var box=document.querySelector('.tz-mesh');if(!box)return;
  var c=box.querySelector('canvas'),x=c.getContext('2d');
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,TAU=Math.PI*2,LOOP=1440,frame=0;
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(4242),i;
  var cols=['127,216,200','245,168,184','247,230,162','150,200,230','255,217,184'];
  var B=[];
  for(i=0;i<5;i++)B.push({kx:1+((rnd()*2)|0),ky:1+((rnd()*2)|0),ph:rnd()*TAU,ph2:rnd()*TAU,col:cols[i]});
  function size(){var r=box.getBoundingClientRect();W=c.width=Math.max(2,r.width|0);H=c.height=Math.max(2,r.height|0);}
  size();addEventListener('resize',size);
  function step(){
    var p=((frame%LOOP)/LOOP)*TAU,R=Math.min(W,H)*0.5;
    x.fillStyle='#dde2e8';x.fillRect(0,0,W,H);
    for(i=0;i<B.length;i++){var b=B[i];
      var cx=W*(0.5+0.30*Math.cos(p*b.kx+b.ph));
      var cy=H*(0.5+0.28*Math.sin(p*b.ky+b.ph2));
      var g=x.createRadialGradient(cx,cy,0,cx,cy,R);
      g.addColorStop(0,'rgba('+b.col+',0.62)');g.addColorStop(1,'rgba('+b.col+',0)');
      x.fillStyle=g;x.beginPath();x.arc(cx,cy,R,0,TAU);x.fill();
    }
    frame++;
  }
  if(reduced){frame=LOOP/4|0;step();}
  else{(function loop(){step();requestAnimationFrame(loop);})();}
})();
</script>
