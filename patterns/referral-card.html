<section class="tz-referral-card" aria-label="Refer a friend">
  <div class="tz-badge" aria-hidden="true"><span>Give $20<br>Get $20</span></div>
  <p class="tz-k">Referrals</p>
  <h2>Your friends get $20 off.<br>You get $20 credit.</h2>
  <p class="tz-sub">No limits, no expiry games. If they buy, you both win — that&rsquo;s the whole pitch.</p>
  <div class="tz-code">
    <code>ROMAN-20-XKQ</code>
    <button>Copy code</button>
  </div>
  <ol class="tz-how">
    <li><strong>1</strong> Share your link or code</li>
    <li><strong>2</strong> They save $20 on their first order</li>
    <li><strong>3</strong> You bank $20 in credit</li>
  </ol>
</section>
<style>

.tz-badge span{font-family:'Archivo Black','Arial Black',sans-serif;font-size:15px;line-height:1.25;
  text-align:center;color:#fff}
.tz-referral-card .tz-k{font-family:'Space Mono',ui-monospace,Menlo,monospace;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.tz-referral-card h2{font-family:'Archivo Black','Arial Black',sans-serif;font-size:clamp(26px,3.6vw,42px);
  line-height:1.12;letter-spacing:-.01em;margin:0 130px 14px 0}
.tz-sub{color:var(--muted);font-size:15px;line-height:1.65;margin:0 130px 28px 0;max-width:38ch}

.tz-code code{font-family:'Space Mono',ui-monospace,Menlo,monospace;font-size:19px;

.tz-code button:hover{background:var(--accent)}

</style>
