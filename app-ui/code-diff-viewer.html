mark{background:var(--accent);color:#0b0f0a;padding:0 1px}
.tz-empty{padding:60px 24px;text-align:center;color:var(--muted)}

var st={file:0,split:false,ws:false,q:'',cur:0},
    tabs=document.getElementById('tabs'),body=document.getElementById('body'),
    toast=document.getElementById('toast');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(t){toast.textContent=t;toast.style.display='block';
  clearTimeout(showToast._t);showToast._t=setTimeout(function(){toast.style.display='none';},1800);}

function hl(text){
  var out=esc(text);
  if(st.ws)out=out.replace(/( +)$/,'<span class="tz-ws">$1</span>').replace(/(\t)/g,'<span class="tz-ws">⇥</span>');
  if(st.q){var q=st.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp('('+q+')','gi'),'<mark>$1</mark>');}
  return out;
}
function rowUni(l){
  var cls=l.t==='+'?'tz-add':l.t==='-'?'tz-del':'tz-ctx';
  return '<div class="tz-row '+cls+(l.t!== ' '?' tz-change':'')+'">'+
    '<span class="tz-g">'+(l.o==null?'':l.o)+'</span>'+
    '<span class="tz-g">'+(l.n==null?'':l.n)+'</span>'+
    '<span class="tz-t">'+l.t+hl(l.x)+'</span></div>';
}
function render(){
  tabs.innerHTML='';
  FILES.forEach(function(f,i){
    var b=document.createElement('button');b.type='button';b.className='tz-tab';
    b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===st.file));
    b.innerHTML=esc(f.name)+'<span class="tz-n">+'+f.adds+'/−'+f.dels+'</span>';

  });
  var f=FILES[st.file],html='';
  html+='<div class="tz-filehead"><span class="tz-fn">'+esc(f.name)+'</span>'+
        '<span class="tz-fs">+'+f.adds+' −'+f.dels+'</span></div>';
  var matchCount=0;
  f.hunks.forEach(function(h,hi){
    html+='<div class="tz-hunk" data-h="'+hi+'"><div class="tz-hunkhead" role="button" tabindex="0" '+

          '<div class="tz-lines">';
    if(st.split){
      var left='',right='';
      h.lines.forEach(function(l){
        if(l.t==='+' ){left+='<div class="tz-row"><span class="tz-g"></span><span class="tz-t"> </span></div>';
                       right+='<div class="tz-row tz-add tz-change"><span class="tz-g">'+l.n+'</span><span class="tz-t">+'+hl(l.x)+'</span></div>';}
        else if(l.t==='-'){left+='<div class="tz-row tz-del tz-change"><span class="tz-g">'+l.o+'</span><span class="tz-t">-'+hl(l.x)+'</span></div>';
                       right+='<div class="tz-row"><span class="tz-g"></span><span class="tz-t"> </span></div>';}
        else{var r='<div class="tz-row tz-ctx"><span class="tz-g">'+(l.o==null?'':l.o)+'</span><span class="tz-t"> '+hl(l.x)+'</span></div>';
             left+=r;right+=r.replace(new RegExp('<span class="tz-g">'+(l.o==null?'':l.o)+'</span>'),
                                     '<span class="tz-g">'+(l.n==null?'':l.n)+'</span>');}
      });
      html+='<div class="tz-split"><div class="tz-pane"><div class="tz-panehead">BEFORE</div>'+left+
            '</div><div class="tz-pane"><div class="tz-panehead">AFTER</div>'+right+'</div></div>';
    }else{
      h.lines.forEach(function(l){html+=rowUni(l);});
    }
    html+='</div></div>';
  });
  if(st.q){
    var re=new RegExp(st.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    matchCount=f.hunks.reduce(function(a,h){return a+h.lines.filter(function(l){return re.test(l.x);}).length;},0);
    if(!matchCount)html='<div class="tz-empty">no matches for "'+esc(st.q)+'" in '+esc(f.name)+'</div>';
  }

  body.querySelectorAll('.tz-hunkhead').forEach(function(hd){

    hd.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tg();}});
  });

function changes(){return Array.prototype.slice.call(body.querySelectorAll('.tz-change'));}
function syncPos(){
  var c=changes();
  c.forEach(function(el,i){el.classList.toggle('tz-cur',i===st.cur);});

  if(el)el.scrollIntoView({block:'nearest'});
  document.getElementById('pos').textContent=c.length?('change '+(st.cur+1)+' of '+c.length):'no changes';

function step(d){
  var c=changes();if(!c.length)return;
  st.cur=(st.cur+d+c.length)%c.length;syncPos();
}

  this.textContent=st.split?'Unified view':'Split view';st.cur=0;render();});

  st.ws=!st.ws;this.setAttribute('aria-pressed',String(st.ws));render();});
function patchText(){
  var f=FILES[st.file],out='diff --git a/'+f.name+' b/'+f.name+'\n';
  f.hunks.forEach(function(h){out+=h.h+'\n';
    h.lines.forEach(function(l){out+=l.t+l.x+'\n';});});
  return out;

function copyPatch(){
  var t=patchText();
  function done(){showToast('Patch copied — '+FILES[st.file].name);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,function(){fallback();});
  }else fallback();
  function fallback(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);

    document.body.removeChild(ta);}
