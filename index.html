<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TZ-taste — 5,000 style DNAs</title>
<meta name="description" content="5,000 style DNAs. Pick one. Build like that.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: #fff; color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #e5e5e5; }
  .bar { max-width: 1400px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .wordmark { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #111; text-decoration: none; white-space: nowrap; }
  .count { font-size: 12px; color: #6b7280; border: 1px solid #e5e5e5; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .spacer { flex: 1; }
  input[type="search"], select { font: inherit; font-size: 13px; color: #111; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 10px; outline: none; }
  input[type="search"] { width: 220px; }
  input[type="search"]:focus, select:focus { border-color: #9ca3af; }
  .shuffle { font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: #111; border: 1px solid #111; border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .shuffle:hover { background: #333; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { display: block; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: #9ca3af; transform: translateY(-2px); }
  .nm { font-size: 13px; font-weight: 650; color: #111; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { display: flex; gap: 5px; margin-bottom: 10px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.08); }
  .sw { border-radius: 6px; padding: 10px 12px; min-height: 74px; display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden; }
  .aa { font-size: 26px; line-height: 1.1; font-weight: 400; }
  .tx { font-size: 11px; line-height: 1.4; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fam { margin-top: 8px; font-size: 10.5px; color: #9ca3af; text-transform: uppercase; letter-spacing: .06em; }
  #sentinel { height: 1px; }
  #empty { display: none; text-align: center; color: #9ca3af; font-size: 14px; padding: 80px 20px; }
  footer { border-top: 1px solid #e5e5e5; margin-top: 24px; }
  footer div { max-width: 1400px; margin: 0 auto; padding: 14px 16px; font-size: 12px; color: #9ca3af; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: #6b7280; text-decoration: none; }

  .sec { margin-bottom: 30px; }
  .sec-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; margin-bottom: 12px; }
  .sec-h .n { color: #9ca3af; font-weight: 400; }
  .tag { font-size: 12px; color: #6b7280; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pills a { font-size: 13px; color: #111; border: 1px solid #e5e5e5; border-radius: 999px; padding: 7px 14px; text-decoration: none; }
  .pills a:hover { border-color: #111; }
  @media (max-width: 640px) { input[type="search"] { width: 140px; } #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }

  .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .tile { display: block; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden; background: #fff; color: #111; text-decoration: none; }
  .tile:hover { border-color: #111; }
  .pv { display: block; height: 420px; overflow: hidden; position: relative; background: #f4f4f5; container-type: inline-size; }
  .pv iframe { width: 1200px; height: 1500px; border: 0; transform-origin: 0 0; transform: scale(calc(100cqw / 1200px)); pointer-events: none; background: #fff; }
  .tlabel { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 12px; border-top: 1px solid #e5e5e5; }
  .tlabel b { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tlabel i { font-style: normal; font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  @media (max-width: 640px) { .feed { grid-template-columns: 1fr; } .pv { height: 300px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="wordmark" href="./">TZ-taste</a>
    <span class="count" id="count">… styles</span>
    <div class="spacer"></div>
    <input type="search" id="q" placeholder="Search styles…" autocomplete="off" aria-label="Search styles">
    <select id="fam" aria-label="Filter by family"><option value="">All families</option></select>
    <button class="shuffle" id="shuffle" type="button">Shuffle</button>
  </div>
</header>
<main>
<section class="sec">
  <h2 class="sec-h">New</h2>
  <div class="feed" id="feed-new"></div>
</section>
<section class="sec">
  <h2 class="sec-h">Originals <span class="n">100</span></h2>
  <div class="feed" id="feed-originals"></div>
</section>
<section class="sec">
  <h2 class="sec-h">Fresh pages <span class="n">1200</span></h2>
  <div class="feed" id="feed-fresh"></div>
</section>
<nav class="sec" aria-label="Collections">
  <h2 class="sec-h">Collections</h2>
  <div class="pills">
    <a href="https://github.com/rawmware/TZ-taste/tree/main/patterns">patterns</a>
    <a href="https://github.com/rawmware/TZ-taste/tree/main/templates">templates</a>
    <a href="https://github.com/rawmware/TZ-taste/tree/main/generative">generative</a>
    <a href="https://github.com/rawmware/TZ-taste/tree/main/three-d">three-d</a>
    <a href="https://github.com/rawmware/TZ-taste/tree/main/app-ui">app-ui</a>
    <a href="https://github.com/rawmware/TZ-taste/tree/main/emails">emails</a>
    <a href="https://github.com/rawmware/TZ-taste/tree/main/styles">styles</a>
  </div>
</nav>
<section class="sec">
  <h2 class="sec-h">Style DNAs</h2>
  <div id="grid"></div>
  <div id="empty">No styles match.</div>
  <div id="sentinel"></div>
</section>
</main>
<footer><div><span>MIT · free forever</span><a href="https://github.com/rawmware/TZ-taste">rawmware/TZ-taste</a></div></footer>
<script>
(function () {
  "use strict";
  var MAX_ALIVE = 12;
  var alive = [];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function nearViewport(el, m) { var r = el.getBoundingClientRect(); return r.bottom > -m && r.top < (window.innerHeight + m); }
  function unload(frame) { frame.removeAttribute("src"); var i = alive.indexOf(frame); if (i >= 0) alive.splice(i, 1); }
  var ioLoad = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      var tile = en.target, frame = tile._frame;
      if (!en.isIntersecting || !frame || frame.getAttribute("src")) return;
      frame.setAttribute("src", frame.getAttribute("data-src"));
      alive.push(frame);
      if (alive.length > MAX_ALIVE) {
        var i, f;
        for (i = 0; i < alive.length; i++) {
          f = alive[i];
          if (f !== frame && !nearViewport(f, 800)) { unload(f); break; }
        }
        while (alive.length > MAX_ALIVE) { var o = alive.shift(); if (o !== frame) o.removeAttribute("src"); }
      }
    });
  }, { rootMargin: "800px" });
  var ioFar = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      var tile = en.target, frame = tile._frame;
      if (!en.isIntersecting && frame && frame.getAttribute("src")) unload(frame);
    });
  }, { rootMargin: "1600px" });
  function renderFeed(el, items) {
    var html = items.map(function (it) {
      return '<a class="tile" href="' + it.href + '"><span class="pv"><iframe loading="lazy" tabindex="-1" aria-hidden="true" title="' + esc(it.name) + '" data-src="' + it.src + '"></iframe></span><span class="tlabel"><b>' + esc(it.name) + '</b><i>' + esc(it.fam) + '</i></span></a>';
    }).join("");
    var tmp = document.createElement("div");
    tmp.innerHTML = html;
    var tiles = tmp.children, i, t;
    for (i = 0; i < tiles.length; i++) {
      t = tiles[i];
      t._frame = t.querySelector("iframe");
      el.appendChild(t);
      ioLoad.observe(t);
      ioFar.observe(t);
    }
  }
  renderFeed(document.getElementById("feed-new"), [
    { href: "showcase/halloween.html", src: "showcase/halloween.html", name: "Dreadhollow Manor", fam: "Original" },
    { href: "showcase/fall-lofi.html", src: "showcase/fall-lofi.html", name: "Maple & Static", fam: "Original" },
    { href: "showcase/ramen-ya.html", src: "showcase/ramen-ya.html", name: "Menya Midnight", fam: "Original" },
    { href: "showcase/tiki-bar.html", src: "showcase/tiki-bar.html", name: "The Brass Parrot", fam: "Original" },
    { href: "showcase/roller-disco.html", src: "showcase/roller-disco.html", name: "Moonlight Wheels", fam: "Original" },
    { href: "showcase/lighthouse-keeper.html", src: "showcase/lighthouse-keeper.html", name: "Greypoint Light", fam: "Original" },
    { href: "showcase/tamagotchi.html", src: "showcase/tamagotchi.html", name: "Pocket Pal", fam: "Original" },
    { href: "showcase/pixel-retro-game.html", src: "showcase/pixel-retro-game.html", name: "Starlight Drifter", fam: "Original" }
  ]);
  fetch("data/originals.json").then(function (r) { return r.json(); }).then(function (d) {
    renderFeed(document.getElementById("feed-originals"), d.map(function (o) {
      return { href: "showcase/" + o.slug + ".html", src: "showcase/" + o.slug + ".html", name: o.name, fam: "Original" };
    }));
  });
  fetch("data/fresh-pages.json").then(function (r) { return r.json(); }).then(function (d) {
    renderFeed(document.getElementById("feed-fresh"), d.map(function (o) {
      return { href: "pages/" + o.slug + ".html", src: "pages/" + o.slug + ".html", name: o.name, fam: o.familyName };
    }));
  });
})();
</script>
<script>
(function () {
  "use strict";
  var grid = document.getElementById("grid"),
      q = document.getElementById("q"),
      famSel = document.getElementById("fam"),
      empty = document.getElementById("empty"),
      sentinel = document.getElementById("sentinel"),
      countEl = document.getElementById("count"),
      all = [], filtered = [], rendered = 0, BATCH = 800,
      loadedFonts = {};

  function gfUrl(a, b) {
    return "https://fonts.googleapis.com/css2?family=" + a.replace(/ /g, "+") +
           "&family=" + b.replace(/ /g, "+") + "&display=swap";
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var fontObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var card = e.target;
      fontObs.unobserve(card);
      var d = card._dna;
      var key = d.display + "|" + d.body;
      var apply = function () {
        var aa = card.querySelector(".aa"), tx = card.querySelector(".tx");
        if (aa) aa.style.fontFamily = "'" + d.display + "', sans-serif";
        if (tx) tx.style.fontFamily = "'" + d.body + "', sans-serif";
      };
      if (loadedFonts[key]) { apply(); return; }
      loadedFonts[key] = true;
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = gfUrl(d.display, d.body);
      link.onload = apply;
      document.head.appendChild(link);
      setTimeout(apply, 1200);
    });
  }, { rootMargin: "400px" });

  function cardHTML(d) {
    var dots = d.palette.map(function (h) { return '<span style="background:' + h + '"></span>'; }).join("");
    return '<a class="card" href="dna.html?d=' + d.slug + '">' +
      '<div class="nm">' + esc(d.name) + '</div>' +
      '<div class="dots">' + dots + '</div>' +
      '<div class="sw" style="background:' + d.palette[0] + '">' +
        '<div class="aa" style="color:' + d.palette[2] + '">Aa</div>' +
        '<div class="tx" style="color:' + d.palette[4] + '">Pack my box with five dozen liquor jugs</div>' +
      '</div>' +
      '<div class="fam">' + esc(d.familyName) + '</div>' +
    '</a>';
  }

  function renderMore() {
    if (rendered >= filtered.length) return;
    var frag = document.createDocumentFragment();
    var tmp = document.createElement("div");
    var end = Math.min(rendered + BATCH, filtered.length);
    for (var i = rendered; i < end; i++) {
      tmp.innerHTML = cardHTML(filtered[i]);
      var node = tmp.firstChild;
      node._dna = filtered[i];
      frag.appendChild(node);
      fontObs.observe(node);
    }
    grid.appendChild(frag);
    rendered = end;
  }

  var gridObs = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) renderMore();
  }, { rootMargin: "1200px" });
  gridObs.observe(sentinel);

  function applyFilter() {
    var term = q.value.trim().toLowerCase(), f = famSel.value;
    filtered = all.filter(function (d) {
      if (f && d.family !== f) return false;
      if (term && d.name.toLowerCase().indexOf(term) < 0 &&
          d.familyName.toLowerCase().indexOf(term) < 0) return false;
      return true;
    });
    grid.innerHTML = ""; rendered = 0;
    empty.style.display = filtered.length ? "none" : "block";
    renderMore();
  }

  var deb;
  q.addEventListener("input", function () { clearTimeout(deb); deb = setTimeout(applyFilter, 120); });
  famSel.addEventListener("change", applyFilter);
  document.getElementById("shuffle").addEventListener("click", function () {
    if (!all.length) return;
    var d = all[Math.floor(Math.random() * all.length)];
    location.href = "dna.html?d=" + d.slug;
  });

  fetch("data/index.json").then(function (r) { return r.json(); }).then(function (data) {
    all = data; filtered = data;
    countEl.textContent = data.length.toLocaleString("en-US") + " styles";
    var seen = {}, opts = ['<option value="">All families</option>'];
    data.forEach(function (d) {
      if (!seen[d.family]) { seen[d.family] = d.familyName; opts.push('<option value="' + d.family + '">' + esc(d.familyName) + '</option>'); }
    });
    famSel.innerHTML = opts.join("");
    renderMore();
  }).catch(function () { countEl.textContent = "failed to load"; });
})();
</script>
</body>
</html>
